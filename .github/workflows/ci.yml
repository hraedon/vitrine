name: CI

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/hraedon/vitrine

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}
          cache-python: true
      - name: Install
        run: uv sync --locked --extra dev
      - name: Install Playwright browser (with system deps)
        run: .venv/bin/playwright install --with-deps chromium
      - name: Lint
        run: .venv/bin/ruff check .
      - name: Types
        run: .venv/bin/mypy
      - name: Tests
        run: .venv/bin/pytest -q --ignore=tests/test_browser.py --ignore=tests/test_display_layout.py
      - name: Provenance gate
        run: .venv/bin/vitrine check
      - name: Build renders
        run: .venv/bin/vitrine build --out _site
      - name: Browser tests
        run: .venv/bin/pytest tests/test_browser.py tests/test_display_layout.py -v
      - name: Render-coverage gate
        run: .venv/bin/vitrine check --against-build _site
      - name: Export surface (standalone CLI path)
        run: .venv/bin/vitrine export --out _export
      - name: Cross-check (source-topic consistency)
        run: .venv/bin/python scripts/cross_check.py

  build-and-push:
    name: Publish tested image
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
