# Japan, the 1980s. The decade Japan's official household statistics reach full
# national coverage (FIES from 1963; MLS all-industry total from 1970; HLS
# quinquennial from 1948). Three Tier-A official series anchor the room: FIES
# workers'-household income (1985), MLS wages and hours (1985), HLS housing
# (1988). No affordability anchors are set: the MLS wage is monthly (not hourly)
# and no item prices are in the archive, so the affordability axis is not
# computed.
# Data year anchors: 1985 (income, wages, hours, consumption), 1988 (housing).
# Country caveat: Japan's surveys measure households (two-or-more-person;
# workers' households), not a four-person family median — the composite-family
# disclaimer applies. The FIES income series is workers' households only; a
# long-run all-household income series was not located.

[room]
country = "jp"
decade = "1980s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "jp-1980s-workers-income"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1985/income/value", target = "amount_minor", guards = [{ locator = "/fies/1985/income/year", value = "1985" }, { locator = "/fies/1985/income/title", value = "18-2 Yearly Average of Monthly Receipts and Disbursements per Household for Workers' Households (1963\uff5e2017)" }, { locator = "/fies/1985/income/heading", value = "Income" }, { locator = "/fies/1985/income/unit", value = "(yen)" }, { locator = "/fies/1985/income/file", value = "36-jp-income/fies-a18-2.xls" }, { locator = "/fies/1985/income/sha256", value = "36407a833d72c661aaef7ca541405e16f5497b2624358a6a02f7a2ca8888379d" }, { locator = "/fies/1985/income/cell", value = "\u52e4\u52b4\u8005\u4e16\u5e2f!R37C8" }, { locator = "/fies/1985/income/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
basis = "monthly"
amount_minor = 444846
currency = "JPY"
price_year = 1985
panel = "budget"
label = "Workers' household monthly income, 1985"
value = "¥444,846 per month"
unit = "JPY per month, nominal (actual monthly income, workers' households)"
source = "jp-fies"
tier = "A"
notes = "From the archived FIES long-run table, 1985, 勤労者世帯!R37C8. This is annual-average monthly income of workers' households, not a median or a four-person family estimate. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

[[fact]]
id = "jp-1980s-mls-wages"
audit = { file = "36-jp-income/mls-long-term-actual.csv", extractor = "csv-cell", encoding = "cp932", locator = "R1574:C7", guards = [{ locator = "R1574:C1", value = "実数" }, { locator = "R1574:C2", value = "1985" }, { locator = "R1574:C3", value = "CY" }, { locator = "R1574:C4", value = "TL" }, { locator = "R1574:C5", value = "0" }, { locator = "R1574:C6", value = "0" }, { locator = "R1:C7", value = "現金給与総額" }], target = "amount_minor" }
basis = "monthly"
amount_minor = 317091
currency = "JPY"
price_year = 1985
panel = "budget"
label = "Average monthly cash earnings, all surveyed industries, 1985"
value = "¥317,091 per month"
unit = "JPY per month, nominal (total cash earnings, all surveyed industries, establishments with 30+ regular workers)"
source = "jp-mls"
tier = "A"
notes = "From MLS long-term actual data (mls-long-term-actual.csv), year=1985, month=CY, industry=TL (all surveyed industries), size=0 (30+ regular workers), emp_type=0. Calendar-year average of monthly total cash earnings (regular + special pay). This is an establishment/payroll survey of workers, not a household-income figure."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "jp-1980s-homeownership"
audit = { file = "38-jp-housing/world-hls-curator-extract.json", extractor = "json-pointer", locator = "/rows/1988/owned/value", target = "quantity", guards = [{ locator = "/rows/1988/year", value = "1988" }, { locator = "/rows/1988/owned/heading", value = "Ratio of owned houses" }, { locator = "/population", value = "Occupied dwellings" }, { locator = "/publisher_files_sha256/jsy2016-y652105000.xls", value = "8bcf5903fa5cb9cc46985e7324eae4f77ed16b8eeac6ba1c3db4418f4cf263b7" }] }
quantity = 61.3
panel = "home"
label = "Homeownership rate, 1988"
value = "61.3%"
unit = "% of occupied dwellings owner-occupied"
source = "jp-hls"
tier = "A"
notes = "From HLS 1988 via JSY 2016 Table 21-5 (jsy2016-y652105000.xls): 22,948 thousand owned houses ÷ 37,413 thousand occupied dwellings = 61.3% (homeownership ratio, dwellings-based). The 'owner household ratio' (households-based) was 61.1%. HLS surveyed October 1988; nationwide, sampled enumeration districts."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-1980s-floor-area"
audit = { file = "38-jp-housing/world-hls-curator-extract.json", extractor = "json-pointer", locator = "/rows/1988/area/value", target = "quantity", guards = [{ locator = "/rows/1988/year", value = "1988" }, { locator = "/rows/1988/area/heading", value = "Area of floor space per dwelling" }, { locator = "/population", value = "Occupied dwellings" }, { locator = "/publisher_files_sha256/jsy2016-y652101000.xls", value = "a66515ed7dc3d73dc0a440e3f36c3786e720c533cc561ef2894f0fb8c0e9c0de" }] }
