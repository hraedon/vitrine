# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "jp-1980s-consumption"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1985/consumption/value", target = "amount_minor", guards = [{ locator = "/fies/1985/consumption/year", value = "1985" }, { locator = "/fies/1985/consumption/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/1985/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/1985/consumption/unit", value = "(yen)" }, { locator = "/fies/1985/consumption/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/1985/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1985/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R36C7" }, { locator = "/fies/1985/consumption/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
basis = "monthly"
amount_minor = 273114
currency = "JPY"
price_year = 1985
panel = "table"
label = "Monthly consumption expenditure, all households, 1985"
value = "¥273,114 per month"
