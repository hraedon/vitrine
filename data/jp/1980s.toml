[[fact]]
id = "jp-1980s-work-hours"
audit = { file = "36-jp-income/mls-long-term-actual.csv", extractor = "csv-cell", encoding = "cp932", locator = "R1574:C12", guards = [{ locator = "R1574:C1", value = "実数" }, { locator = "R1574:C2", value = "1985" }, { locator = "R1574:C3", value = "CY" }, { locator = "R1574:C4", value = "TL" }, { locator = "R1574:C5", value = "0" }, { locator = "R1574:C6", value = "0" }, { locator = "R1:C12", value = "総実労働時間" }], target = "quantity" }
