assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

[[fact]]
id = "jp-1980s-food-share"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1985/food/value", target = "quantity", guards = [{ locator = "/fies/1985/food/year", value = "1985" }, { locator = "/fies/1985/food/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/1985/food/heading", value = "Food" }, { locator = "/fies/1985/food/unit", value = "(yen)" }, { locator = "/fies/1985/food/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/1985/food/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1985/food/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R36C8" }, { locator = "/fies/1985/food/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }, { locator = "/fies/1985/consumption/year", value = "1985" }, { locator = "/fies/1985/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/1985/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1985/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R36C7" }], calculation = { op = "pct_of", operands = ["/fies/1985/consumption/value"], precision = 1, rounding = "half_up", method = "Food expenditure divided by total consumption expenditure in the same annual-average source row, times one hundred; same household population and year, rounded once to one decimal place." } }
quantity = 27.0
panel = "table"
label = "Food share of consumption expenditure, 1985"
value = "27.0%"
unit = "% of consumption expenditure spent on food"
source = "jp-fies"
tier = "A"
notes = "Calculated from the archived FIES long-run table's Food and Consumption expenditures cells in the same 1985 annual-average row. The source's Food category is retained without relabelling it as food and non-alcoholic beverages. The percentage is rounded once to one decimal place; calculation operands and rounding are recorded in the audit. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "jp-household-not-family", "jp-fies-food-share"]

