# Japan, the 2010s. The lost decades' third decade: nominal workers'-household
# income stagnated (¥522,629 in 2005 → ¥525,955 in 2015, essentially flat) and
# MLS wages continued to decline (¥381,807 → ¥361,684). The food share reversed
# its long decline, rising from 22.9% to 25.0% as nominal consumption fell
# faster than food spending. Three Tier-A official series anchor the room:
# FIES (2015), MLS (2015), HLS housing (2013). Durable-goods diffusion comes
# from the NSFIIE 2009 survey (the 2014/2019 NSFIIE surveys do not publish
# English durable-goods summaries) and the ICWP 2015 (data end 2014). No
# affordability anchors are set: the MLS wage is monthly (not hourly) and no
# item prices are in the archive.
# Data year anchors: 2015 (income, wages, hours, consumption), 2013 (housing),
# 2009/2014 (diffusion).
# Country caveat: Japan's surveys measure households, not a four-person family
# median — the composite-family disclaimer applies. Nominal-value facts carry
# the jp-deflation-lost-decades assumption.

[room]
country = "jp"
decade = "2010s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "jp-2010s-workers-income"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/2015/income/value", target = "amount_minor", guards = [{ locator = "/fies/2015/income/year", value = "2015" }, { locator = "/fies/2015/income/title", value = "18-2 Yearly Average of Monthly Receipts and Disbursements per Household for Workers' Households (1963\uff5e2017)" }, { locator = "/fies/2015/income/heading", value = "Income" }, { locator = "/fies/2015/income/unit", value = "(yen)" }, { locator = "/fies/2015/income/file", value = "36-jp-income/fies-a18-2.xls" }, { locator = "/fies/2015/income/sha256", value = "36407a833d72c661aaef7ca541405e16f5497b2624358a6a02f7a2ca8888379d" }, { locator = "/fies/2015/income/cell", value = "\u52e4\u52b4\u8005\u4e16\u5e2f!R67C8" }, { locator = "/fies/2015/income/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
basis = "monthly"
amount_minor = 525955
currency = "JPY"
price_year = 2015
panel = "budget"
label = "Workers' household monthly income, 2015"
value = "¥525,955 per month"
unit = "JPY per month, nominal (actual monthly income, workers' households)"
source = "jp-fies"
tier = "A"
notes = "From the archived FIES long-run table, 2015, 勤労者世帯!R67C8. This is annual-average monthly income of workers' households, not a median or a four-person family estimate. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-deflation-lost-decades"]

[[fact]]
id = "jp-2010s-mls-wages"
audit = { file = "36-jp-income/mls-long-term-actual.csv", extractor = "csv-cell", encoding = "cp932", locator = "R10409:C7", guards = [{ locator = "R10409:C1", value = "実数" }, { locator = "R10409:C2", value = "2015" }, { locator = "R10409:C3", value = "CY" }, { locator = "R10409:C4", value = "TL" }, { locator = "R10409:C5", value = "0" }, { locator = "R10409:C6", value = "0" }, { locator = "R1:C7", value = "現金給与総額" }], target = "amount_minor" }
basis = "monthly"
amount_minor = 361684
currency = "JPY"
price_year = 2015
panel = "budget"
label = "Average monthly cash earnings, all surveyed industries, 2015"
value = "¥361,684 per month"
unit = "JPY per month, nominal (total cash earnings, all surveyed industries, establishments with 30+ regular workers)"
source = "jp-mls"
tier = "A"
notes = "From MLS long-term actual data (mls-long-term-actual.csv), year=2015, month=CY, industry=TL, size=0, emp_type=0. Calendar-year average of monthly total cash earnings. Continued decline from ¥381,807 (2005) — down 11.5% from the 1995 peak (¥408,864). Establishment/payroll survey, not household income."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-deflation-lost-decades"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "jp-2010s-homeownership"
audit = { file = "38-jp-housing/jsy2026-y752105000.xlsx", extractor = "xlsx-cell", locator = "y2105000!J13", target = "quantity", guards = [{ locator = "y2105000!B13", value = "2013" }, { locator = "y2105000!J6", value = "Ratio of owned houses" }, { locator = "y2105000!A18", value = "Occupied dwellings.  1)  Including tenure of dwellings not reported.  2)  (Owned houses / occupied dwellings) x 100" }] }
quantity = 61.7
panel = "home"
label = "Homeownership rate, 2013"
value = "61.7%"
unit = "% of occupied dwellings owner-occupied"
source = "jp-hls"
tier = "A"
notes = "From HLS 2013 via JSY 2016 Table 21-5 (jsy2016-y652105000.xls): 32,166 thousand owned ÷ 52,102 thousand occupied dwellings = 61.7% (homeownership ratio). The 2018 survey (JSY 2026 Table 21-5) gave 61.2%. Homeownership held near 61% across the decade. 2013 is the HLS year closest to the 2015 income anchor."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2010s-floor-area"
audit = { file = "38-jp-housing/jsy2026-y752101000.xlsx", extractor = "xlsx-cell", locator = "y2101000!E20", target = "quantity", guards = [{ locator = "y2101000!B20", value = "2013" }, { locator = "y2101000!C15", value = "Occupied dwellings" }, { locator = "y2101000!E17", value = "Area of floor space per dwelling" }] }
quantity = 94.42
panel = "home"
label = "Floor area per dwelling, 2013"
value = "94.42 m²"
unit = "m² per dwelling (occupied dwellings, nationwide)"
source = "jp-hls"
tier = "A"
notes = "HLS 2013, JSY 2016 Table 21-1: 94.42 square metres per occupied dwelling. The same source prints 94.85 in 2003; JSY 2026 prints 93.04 in 2018. These are occupied-dwelling means, not dwelling medians or values for a matched family. No claim about the historical peak is made."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2010s-rooms"
audit = { file = "38-jp-housing/jsy2026-y752101000.xlsx", extractor = "xlsx-cell", locator = "y2101000!C20", target = "quantity", guards = [{ locator = "y2101000!B20", value = "2013" }, { locator = "y2101000!C15", value = "Occupied dwellings" }, { locator = "y2101000!C17", value = "Dwelling rooms per dwelling" }] }
quantity = 4.59
panel = "home"
label = "Rooms per dwelling, 2013"
value = "4.59 rooms"
unit = "rooms per dwelling (occupied dwellings, nationwide)"
source = "jp-hls"
tier = "A"
notes = "From HLS 2013 via JSY 2016 Table 21-1 (jsy2016-y652101000.xls): 4.59 rooms per dwelling. Rooms declined steadily — 4.77 (2003) → 4.67 (2008) → 4.59 (2013) → 4.42 (2018) — as measured in the survey (persons per room 0.53 in 2013, down from 0.56 in 2003). Nationwide."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2010s-housing-amenities-gap"
panel = "home"
label = "Dwelling facilities (bath, flush toilet, kitchen)"
value = "no reliable record curated for this measure"
unit = "n/a"
source = "jp-hls"
tier = "D"
notes = "A compatible observation has not yet been transcribed and qualified for this measure."

