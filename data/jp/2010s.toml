source = "jp-nsfiie"
tier = "A"
notes = "NSFIIE 2009 results4.pdf: 61.9% of two-or-more-person households owned a flat-screen TV, with 865 sets per thousand households. The source 652.2% change concerns sets per thousand households, not the ownership rate. The 2014 durable-goods tables remain untranscribed here; the 2019 survey terminated that questionnaire. This record remains dated 2009."
assumptions = ["composite-family", "jp-household-not-family"]

