source = "jp-fies"
tier = "A"
notes = "From the archived FIES long-run table, 2015, 二人以上の世帯!R66C7. This is annual-average monthly total consumption expenditure, not a food basket. The expenditure population includes all household types within the stated survey scope; the income observations use workers' households. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-deflation-lost-decades"]

[[fact]]
id = "jp-2010s-food-share"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/2015/food/value", target = "quantity", guards = [{ locator = "/fies/2015/food/year", value = "2015" }, { locator = "/fies/2015/food/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/2015/food/heading", value = "Food" }, { locator = "/fies/2015/food/unit", value = "(yen)" }, { locator = "/fies/2015/food/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/2015/food/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/2015/food/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R66C8" }, { locator = "/fies/2015/food/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }, { locator = "/fies/2015/consumption/year", value = "2015" }, { locator = "/fies/2015/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/2015/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/2015/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R66C7" }], calculation = { op = "pct_of", operands = ["/fies/2015/consumption/value"], precision = 1, rounding = "half_up", method = "Food expenditure divided by total consumption expenditure in the same annual-average source row, times one hundred; same household population and year, rounded once to one decimal place." } }
quantity = 25.0
panel = "table"
label = "Food share of consumption expenditure, 2015"
value = "25.0%"
unit = "% of consumption expenditure spent on food"
source = "jp-fies"
tier = "A"
notes = "Calculated from the archived FIES long-run table's Food and Consumption expenditures cells in the same 2015 annual-average row. The source's Food category is retained without relabelling it as food and non-alcoholic beverages. The percentage is rounded once to one decimal place; calculation operands and rounding are recorded in the audit. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "jp-household-not-family", "jp-fies-food-share"]

