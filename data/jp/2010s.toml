notes = "From NSFIIE 2009 summary: cellular phone ownership rate 92.7% (2,131 units per 1,000 households). Up from 84.7% (2004). The ICWP 2015 (end 2014) household penetration was 94.6%, of which smartphones were 64.2%. 2009 is the closest English-language NSFIIE durable-goods summary transcribed here. Two-or-more-person households, nationwide."
