# Japan, the 1950s. Postwar recovery decade; official household surveys began in
# 1946 but national coverage and English-language long-run tables arrive later.
# The 1955 FIES workers' household income is urban-only; the yearbook wage is
# establishment-based. Everything else in the archive begins after 1960.
# Data year anchors: 1955.
# Country caveat: Japanese surveys measure households; the composite-family
# disclaimer applies.

[room]
country = "jp"
decade = "1950s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "jp-1950s-fies-workers-income"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1955/income/value", target = "amount_minor", guards = [{ locator = "/fies/1955/income/year", value = "1955" }, { locator = "/fies/1955/income/title", value = "Annual Average of Monthly Household Receipts and Disbursements - Workers' Households of All Cities (1948\uff5e1962)" }, { locator = "/fies/1955/income/heading", value = "Income" }, { locator = "/fies/1955/income/unit", value = "(Value in yen)" }, { locator = "/fies/1955/income/file", value = "36-jp-income/fies-18-02-a.xls" }, { locator = "/fies/1955/income/sha256", value = "91ea0aec3fee6b088a7297fb378bc00222535b0d5a8957d472bb2857734fd95d" }, { locator = "/fies/1955/income/cell", value = "18-2-a!R17C6" }] }
panel = "budget"
label = "Workers' household monthly income, 1955"
value = "¥29,169"
quantity = 29169
unit = "JPY per month, nominal (workers' households, all cities)"
source = "jp-fies"
tier = "A"
amount_minor = 29169
currency = "JPY"
price_year = 1955
basis = "monthly"
notes = "From the archived FIES long-run table, 1955, 18-2-a!R17C6. This is annual-average monthly income of workers' households, not a median or a four-person family estimate. This earlier table covers workers' households in all cities."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-kakei-1962-seam"]

[[fact]]
id = "jp-1950s-yearbook-wage"
panel = "budget"
label = "Average monthly wage, establishments with 30+ workers, 1955"
value = "¥18,300"
quantity = 18300
unit = "JPY per month, nominal (industries covered, establishments with 30 or more regular workers)"
source = "jp-jsy"
tier = "A"
amount_minor = 18300
currency = "JPY"
price_year = 1955
basis = "monthly"
notes = "From the Japan Statistical Yearbook historical wage tables. 1955: average monthly cash earnings for industries covered, establishments with 30 or more regular workers. Establishment-based payroll data, not household income."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-kakei-1962-seam"]

