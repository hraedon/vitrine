# Japan, the 1960s. The "income-doubling" decade: FIES becomes national in 1963,
# with the source's exclusion of agricultural, forestry and fisheries households. The yearbook
# wage series gives an establishment-based anchor. Hours and durable-goods
# diffusion remain inaccessible in English for this decade.
# Data year anchors: 1965.
# Country caveat: Japanese surveys measure households; the composite-family
# disclaimer applies.

[room]
country = "jp"
decade = "1960s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "jp-1960s-fies-workers-income"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1965/income/value", target = "amount_minor", guards = [{ locator = "/fies/1965/income/year", value = "1965" }, { locator = "/fies/1965/income/title", value = "18-2 Yearly Average of Monthly Receipts and Disbursements per Household for Workers' Households (1963\uff5e2017)" }, { locator = "/fies/1965/income/heading", value = "Income" }, { locator = "/fies/1965/income/unit", value = "(yen)" }, { locator = "/fies/1965/income/file", value = "36-jp-income/fies-a18-2.xls" }, { locator = "/fies/1965/income/sha256", value = "36407a833d72c661aaef7ca541405e16f5497b2624358a6a02f7a2ca8888379d" }, { locator = "/fies/1965/income/cell", value = "\u52e4\u52b4\u8005\u4e16\u5e2f!R17C8" }, { locator = "/fies/1965/income/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
panel = "budget"
label = "Workers' household monthly income, 1965"
value = "¥65,141"
quantity = 65141
unit = "JPY per month, nominal (workers' households, national)"
source = "jp-fies"
tier = "A"
amount_minor = 65141
currency = "JPY"
price_year = 1965
basis = "monthly"
notes = "From the archived FIES long-run table, 1965, 勤労者世帯!R17C8. This is annual-average monthly income of workers' households, not a median or a four-person family estimate. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

[[fact]]
id = "jp-1960s-yearbook-wage"
panel = "budget"
label = "Average monthly wage, establishments with 30+ workers, 1965"
value = "¥39,400"
quantity = 39400
unit = "JPY per month, nominal (all industries, establishments with 30 or more regular workers)"
source = "jp-jsy"
tier = "A"
amount_minor = 39400
currency = "JPY"
price_year = 1965
basis = "monthly"
notes = "From the Japan Statistical Yearbook historical wage tables. 1965: average monthly cash earnings for all industries, establishments with 30 or more regular workers. Establishment-based payroll data, not household income."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "jp-1960s-home-gap"
panel = "home"
label = "Housing tenure, floor area, and amenities, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-hls"
tier = "D"
notes = "The Housing and Land Survey summary results used by this project are extracted from the Japan Statistical Yearbook, which begins English-language housing tables in 1988. The 1960s HLS data is not in the archive."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "jp-1960s-diffusion-gap"
panel = "diffusion"
label = "Household durable goods and communications, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-nsfiie"
tier = "D"
notes = "The National Survey of Family Income and Expenditure publishes English durable-goods summaries from 1999 onward. Earlier survey waves (including the 1960s) are not in the archive in English."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "jp-1960s-day-gap"
panel = "day"
label = "Working hours, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-mls"
tier = "D"
notes = "The Monthly Labour Survey all-industry total (30+ regular workers) begins in 1970. Scanned yearbook data gives 1965 wages but not hours. Without hours, no hourly wage or affordability anchor can be computed."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "jp-1960s-fies-consumption"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1965/consumption/value", target = "amount_minor", guards = [{ locator = "/fies/1965/consumption/year", value = "1965" }, { locator = "/fies/1965/consumption/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/1965/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/1965/consumption/unit", value = "(yen)" }, { locator = "/fies/1965/consumption/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/1965/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1965/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R16C7" }, { locator = "/fies/1965/consumption/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
panel = "table"
label = "All-household monthly consumption expenditure, 1965"
value = "¥48,396"
quantity = 48396
unit = "JPY per month, nominal (all two-or-more-person households)"
source = "jp-fies"
tier = "A"
amount_minor = 48396
currency = "JPY"
price_year = 1965
basis = "monthly"
notes = "From the archived FIES long-run table, 1965, 二人以上の世帯!R16C7. This is annual-average monthly total consumption expenditure, not a food basket. The expenditure population includes all household types within the stated survey scope; the income observations use workers' households. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

[[fact]]
id = "jp-1960s-fies-food-share"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1965/food/value", target = "quantity", guards = [{ locator = "/fies/1965/food/year", value = "1965" }, { locator = "/fies/1965/food/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/1965/food/heading", value = "Food" }, { locator = "/fies/1965/food/unit", value = "(yen)" }, { locator = "/fies/1965/food/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/1965/food/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1965/food/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R16C8" }, { locator = "/fies/1965/food/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }, { locator = "/fies/1965/consumption/year", value = "1965" }, { locator = "/fies/1965/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/1965/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1965/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R16C7" }], calculation = { op = "pct_of", operands = ["/fies/1965/consumption/value"], precision = 1, rounding = "half_up", method = "Food expenditure divided by total consumption expenditure in the same annual-average source row, times one hundred; same household population and year, rounded once to one decimal place." } }
panel = "table"
label = "Food share of consumption expenditure, 1965"
value = "38.1%"
quantity = 38.1
unit = "% of consumption expenditure (all two-or-more-person households)"
source = "jp-fies"
tier = "A"
notes = "Calculated from the archived FIES long-run table's Food and Consumption expenditures cells in the same 1965 annual-average row. The source's Food category is retained without relabelling it as food and non-alcoholic beverages. The percentage is rounded once to one decimal place; calculation operands and rounding are recorded in the audit. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "jp-household-not-family", "jp-fies-food-share"]

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "jp-1960s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-mls"
tier = "D"
notes = "Without an hourly wage (no hours data) or durable-goods prices in the archive, hours-of-work-to-afford comparisons cannot be computed for the 1960s. The monthly wage figures above are the available wage references."
assumptions = ["composite-family", "jp-household-not-family"]
