source = "jp-fies"
tier = "A"
notes = "Calculated from the archived FIES long-run table's Food and Consumption expenditures cells in the same 1995 annual-average row. The source's Food category is retained without relabelling it as food and non-alcoholic beverages. The percentage is rounded once to one decimal place; calculation operands and rounding are recorded in the audit. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "jp-household-not-family", "jp-fies-food-share"]

