source = "jp-hls"
tier = "A"
notes = "HLS 1993, JSY 2016 Table 21-5: the source prints 59.8% owned among occupied dwellings. It separately reports 24,376 thousand owned and 40,773 thousand occupied dwellings; the displayed percentage is retained as published, not recalculated from rounded counts. The 1998 and 2003 published ratios are 60.3% and 61.2%. The survey year is 1993, not 1995."
