panel = "home"
label = "Rooms per dwelling, 1993"
value = "4.85 rooms"
unit = "rooms per dwelling (occupied dwellings, nationwide)"
source = "jp-hls"
tier = "A"
notes = "From HLS 1993 via JSY 2016 Table 21-1 (jsy2016-y652101000.xls): 4.85 rooms per dwelling. The 1998 survey gave 4.79. Persons per room 0.62 (down from 0.66 in 1988). Nationwide."
