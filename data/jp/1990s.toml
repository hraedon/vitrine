source = "jp-nsfiie"
tier = "A"
notes = "From NSFIIE 1999 summary (https://www.stat.go.jp/english/data/zensho/1999/1.html), narrative text: PC ownership rate 37.7% (485 units per 1,000 households). PCs had increased 2.6-fold from 1994. The 1994 NSFIIE English summary is not in the archive; 1999 is the earliest English-language NSFIIE durable-goods summary transcribed here. Two-or-more-person households, nationwide, as of end of October."
assumptions = ["composite-family", "jp-household-not-family"]

