notes = "From ICWP 2005 white paper, Chapter 2, Section 7 (Figure 2-7-1), data end of 2004: PC household penetration 77.5%. Source: 2004 Communications Usage Trend Survey, MIC. Higher than the NSFIIE 2004 rate (69.3%) due to survey-method differences."
