assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2000s-car"
quantity = 86.2
panel = "diffusion"
label = "Households with a car, 2004"
value = "86.2%"
unit = "% of two-or-more-person households"
source = "jp-nsfiie"
tier = "A"
notes = "From NSFIIE 2004 summary: car ownership rate 86.2% (1,446 units per 1,000 households). Up from 84.9% (1999, per the 2004 text's comparison figures). Of these, 1,392 were domestic cars and 54 imported. Two-or-more-person households, nationwide."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2000s-mobile-phone-icwp"
quantity = 91.1
