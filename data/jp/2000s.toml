# Japan, the 2000s. The lost decades in full: nominal workers'-household
# income fell from its 1995 peak (¥570,817) to ¥522,629 (2005), and MLS wages
# declined from ¥408,864 to ¥381,807 — nominal contraction amid persistent
# deflation. Real (CPI-adjusted) values rose as prices fell. Three Tier-A
# official series anchor the room: FIES (2005), MLS (2005), HLS housing (2003).
# Durable-goods diffusion comes from the NSFIIE 2004 survey and ICWP 2005
# (data end 2004). No affordability anchors are set: the MLS wage is monthly
# (not hourly) and no item prices are in the archive.
# Data year anchors: 2005 (income, wages, hours, consumption), 2003 (housing),
# 2004 (diffusion).
# Country caveat: Japan's surveys measure households, not a four-person family
# median — the composite-family disclaimer applies. Nominal-value facts carry
# the jp-deflation-lost-decades assumption.

[room]
country = "jp"
decade = "2000s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "jp-2000s-workers-income"
basis = "monthly"
amount_minor = 522629
currency = "JPY"
price_year = 2005
panel = "budget"
label = "Workers' household monthly income, 2005"
value = "¥522,629 per month"
unit = "JPY per month, nominal (actual monthly income, workers' households)"
source = "jp-fies"
tier = "A"
notes = "From FIES long-run time-series (fies-a18-2.xls), 2005, column 実収入, workers' households. Nominal income declined 8.4% from the 1995 peak (¥570,817) — the lost-decades contraction. It would stagnate near this level through 2015 (¥525,955). Two-or-more-person workers' households, Japan."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-deflation-lost-decades"]

[[fact]]
id = "jp-2000s-mls-wages"
audit = { file = "36-jp-income/mls-long-term-actual.csv", extractor = "csv-cell", encoding = "cp932", locator = "R5770:C7", guards = [{ locator = "R5770:C1", value = "実数" }, { locator = "R5770:C2", value = "2005" }, { locator = "R5770:C3", value = "CY" }, { locator = "R5770:C4", value = "TL" }, { locator = "R5770:C5", value = "0" }, { locator = "R5770:C6", value = "0" }, { locator = "R1:C7", value = "現金給与総額" }], target = "amount_minor" }
basis = "monthly"
amount_minor = 381807
currency = "JPY"
price_year = 2005
panel = "budget"
label = "Average monthly cash earnings, all surveyed industries, 2005"
value = "¥381,807 per month"
unit = "JPY per month, nominal (total cash earnings, all surveyed industries, establishments with 30+ regular workers)"
source = "jp-mls"
tier = "A"
notes = "From MLS long-term actual data (mls-long-term-actual.csv), year=2005, month=CY, industry=TL, size=0, emp_type=0. Calendar-year average of monthly total cash earnings. Down 6.6% from the 1995 peak (¥408,864); continued decline to ¥361,684 (2015). Establishment/payroll survey, not household income."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-deflation-lost-decades"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "jp-2000s-homeownership"
quantity = 61.2
panel = "home"
label = "Homeownership rate, 2003"
value = "61.2%"
unit = "% of occupied dwellings owner-occupied"
source = "jp-hls"
tier = "A"
notes = "From HLS 2003 via JSY 2016 Table 21-5 (jsy2016-y652105000.xls): 28,666 thousand owned ÷ 46,863 thousand occupied dwellings = 61.2% (homeownership ratio). The 2008 survey gave 61.1%. Homeownership recovered above 61% after dipping near 60% in the 1990s and held steady through the decade. 2003 is the HLS year closest to the 2005 income anchor."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2000s-floor-area"
quantity = 94.85
panel = "home"
label = "Floor area per dwelling, 2003"
value = "94.85 m²"
unit = "m² per dwelling (occupied dwellings, nationwide)"
source = "jp-hls"
tier = "A"
notes = "From HLS 2003 via JSY 2016 Table 21-1 (jsy2016-y652101000.xls): 94.85 m² floor space per dwelling (occupied dwellings). Up from 91.92 m² (1993); the 2008 survey gave 94.13 m² (a slight decline). Floor area peaked around 2003–2008. Owned houses averaged 121.67 m² vs rented 51.56 m² (JSY 2016 Table 21-8)."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2000s-rooms"
quantity = 4.77
panel = "home"
label = "Rooms per dwelling, 2003"
value = "4.77 rooms"
unit = "rooms per dwelling (occupied dwellings, nationwide)"
source = "jp-hls"
tier = "A"
notes = "From HLS 2003 via JSY 2016 Table 21-1 (jsy2016-y652101000.xls): 4.77 rooms per dwelling. Down from 4.85 (1993); the 2008 survey gave 4.67. Persons per room 0.56 (down from 0.62 in 1993) as household size continued to fall. Nationwide."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
id = "jp-2000s-housing-amenities-gap"
panel = "home"
label = "Dwelling facilities (bath, flush toilet, kitchen)"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-hls"
tier = "D"
notes = "The HLS 'Situation of facilities' (bath, toilet, kitchen) data is not published in the English JSY tables — only aged-person and energy-saving facility tables appear. Basic facility prevalence for the 2000s is not transcribed; needs e-Stat (Japanese) or printed HLS reports."

