notes = "From NSFIIE 2004 summary: cellular phone ownership rate 84.7% (1,823 units per 1,000 households). Up from 64.9% (1999). The ICWP 2005 (end 2004) household penetration rate for mobile phones was 91.1% — the difference reflects the two surveys' methodologies (NSFIIE durable-goods questionnaire vs Communications Usage Trend Survey). Two-or-more-person households, nationwide."
