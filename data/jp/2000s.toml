tier = "A"
notes = "From ICWP 2005 white paper, Chapter 2, Section 7 (Figure 2-7-1, 'Digitization of homes'), data end of 2004: mobile phone household penetration 91.1%. Source: 2004 Communications Usage Trend Survey, MIC. This is a household penetration rate from a communications survey; the NSFIIE 2004 durable-goods rate was 84.7%."
assumptions = ["composite-family", "jp-household-not-family"]

[[fact]]
