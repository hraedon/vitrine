assumptions = ["composite-family", "jp-household-not-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "jp-2000s-consumption"
basis = "monthly"
amount_minor = 300903
currency = "JPY"
price_year = 2005
panel = "table"
label = "Monthly consumption expenditure, all households, 2005"
value = "¥300,903 per month"
unit = "JPY per month, nominal (consumption expenditure, all two-or-more-person households)"
source = "jp-fies"
tier = "A"
notes = "From FIES long-run time-series (fies-a18-1.xls), 2005, all two-or-more-person households. Nominal consumption declined 8.6% from the 1995 peak (¥329,062) — deflation reduced both nominal income and nominal spending. Continued decline to ¥288,326 (2015). Population differs from the income fact (all households vs workers' households)."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family", "jp-deflation-lost-decades"]

[[fact]]
id = "jp-2000s-food-share"
quantity = 22.9
panel = "table"
label = "Food share of consumption expenditure, 2005"
value = "22.9%"
unit = "% of consumption expenditure spent on food"
source = "jp-fies"
tier = "A"
notes = "From FIES (fies-a18-1.xls), 2005: food ¥68,910 ÷ consumption ¥300,903 = 22.9%. All two-or-more-person households. The Engel ratio reached its low point here (23.7% in 1995 → 22.9% in 2005) before rising to 25.0% in 2015 as nominal consumption fell faster than food spending."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "jp-2000s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 2000s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-mls"
tier = "D"
notes = "No item prices are in the archive for the 2000s, so hours-of-work-to-afford comparisons cannot be computed. The MLS wage (¥381,807/month, 2005) is the available wage reference. Under deflation, the affordability axis (hours-to-afford) would be the more reliable comparator than nominal-value ratios."
