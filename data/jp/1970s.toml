# Japan, the 1970s. FIES and MLS are both national by this decade, giving
# household income, consumption, and establishment wages/hours. The HLS and
# NSFIIE durable-goods summaries remain inaccessible in English for the 1970s,
# so the home and diffusion panels are gaps.
# Data year anchors: 1975.
# Country caveat: Japanese surveys measure households; the composite-family
# disclaimer applies.

[room]
country = "jp"
decade = "1970s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "jp-1970s-fies-workers-income"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1975/income/value", target = "amount_minor", guards = [{ locator = "/fies/1975/income/year", value = "1975" }, { locator = "/fies/1975/income/title", value = "18-2 Yearly Average of Monthly Receipts and Disbursements per Household for Workers' Households (1963\uff5e2017)" }, { locator = "/fies/1975/income/heading", value = "Income" }, { locator = "/fies/1975/income/unit", value = "(yen)" }, { locator = "/fies/1975/income/file", value = "36-jp-income/fies-a18-2.xls" }, { locator = "/fies/1975/income/sha256", value = "36407a833d72c661aaef7ca541405e16f5497b2624358a6a02f7a2ca8888379d" }, { locator = "/fies/1975/income/cell", value = "\u52e4\u52b4\u8005\u4e16\u5e2f!R27C8" }, { locator = "/fies/1975/income/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
panel = "budget"
label = "Workers' household monthly income, 1975"
value = "¥236,152"
quantity = 236152
unit = "JPY per month, nominal (workers' households, national)"
source = "jp-fies"
tier = "A"
amount_minor = 236152
currency = "JPY"
price_year = 1975
basis = "monthly"
notes = "From the archived FIES long-run table, 1975, 勤労者世帯!R27C8. This is annual-average monthly income of workers' households, not a median or a four-person family estimate. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

[[fact]]
id = "jp-1970s-mls-wage"
audit = { file = "36-jp-income/mls-long-term-actual.csv", extractor = "csv-cell", encoding = "cp932", locator = "R854:C7", guards = [{ locator = "R854:C1", value = "実数" }, { locator = "R854:C2", value = "1975" }, { locator = "R854:C3", value = "CY" }, { locator = "R854:C4", value = "TL" }, { locator = "R854:C5", value = "0" }, { locator = "R854:C6", value = "0" }, { locator = "R1:C7", value = "現金給与総額" }], target = "amount_minor" }
panel = "budget"
label = "Average monthly wage, establishments with 30+ workers, 1975"
value = "¥177,213"
quantity = 177213
unit = "JPY per month, nominal (all surveyed industries, establishments with 30 or more regular workers)"
source = "jp-mls"
tier = "A"
amount_minor = 177213
currency = "JPY"
price_year = 1975
basis = "monthly"
notes = "From the Monthly Labour Survey long-term actual data. 1975: average monthly total cash earnings for all surveyed industries, establishments with 30 or more regular workers. Includes regular and special pay. Establishment-based payroll data, not household income."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "jp-1970s-home-gap"
panel = "home"
label = "Housing tenure, floor area, and amenities, 1970s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-hls"
tier = "D"
notes = "The Housing and Land Survey summary results used by this project are extracted from the Japan Statistical Yearbook, which begins English-language housing tables in 1988. The 1970s HLS data is not in the archive."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "jp-1970s-diffusion-gap"
panel = "diffusion"
label = "Household durable goods and communications, 1970s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-nsfiie"
tier = "D"
notes = "The National Survey of Family Income and Expenditure publishes English durable-goods summaries from 1999 onward. The 1974 and 1979 survey waves are not in the archive in English."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "jp-1970s-mls-hours"
audit = { file = "36-jp-income/mls-long-term-actual.csv", extractor = "csv-cell", encoding = "cp932", locator = "R854:C12", guards = [{ locator = "R854:C1", value = "実数" }, { locator = "R854:C2", value = "1975" }, { locator = "R854:C3", value = "CY" }, { locator = "R854:C4", value = "TL" }, { locator = "R854:C5", value = "0" }, { locator = "R854:C6", value = "0" }, { locator = "R1:C12", value = "総実労働時間" }], target = "quantity" }
panel = "day"
label = "Average monthly working hours, establishments with 30+ workers, 1975"
value = "172.0 hours"
quantity = 172.0
unit = "hours per month, all surveyed industries, establishments with 30 or more regular workers"
source = "jp-mls"
tier = "A"
notes = "From the Monthly Labour Survey long-term actual data. 1975: average monthly scheduled working hours for all surveyed industries, establishments with 30 or more regular workers. This is a monthly, not weekly, figure — it cannot be used directly as an hourly-wage affordability anchor without a weeks-per-month conversion."
assumptions = ["composite-family", "jp-household-not-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "jp-1970s-fies-consumption"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1975/consumption/value", target = "amount_minor", guards = [{ locator = "/fies/1975/consumption/year", value = "1975" }, { locator = "/fies/1975/consumption/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/1975/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/1975/consumption/unit", value = "(yen)" }, { locator = "/fies/1975/consumption/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/1975/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1975/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R26C7" }, { locator = "/fies/1975/consumption/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }] }
panel = "table"
label = "All-household monthly consumption expenditure, 1975"
value = "¥157,982"
quantity = 157982
unit = "JPY per month, nominal (all two-or-more-person households)"
source = "jp-fies"
tier = "A"
amount_minor = 157982
currency = "JPY"
price_year = 1975
basis = "monthly"
notes = "From the archived FIES long-run table, 1975, 二人以上の世帯!R26C7. This is annual-average monthly total consumption expenditure, not a food basket. The expenditure population includes all household types within the stated survey scope; the income observations use workers' households. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "nominal-values", "jp-household-not-family"]

[[fact]]
id = "jp-1970s-fies-food-share"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/fies/1975/food/value", target = "quantity", guards = [{ locator = "/fies/1975/food/year", value = "1975" }, { locator = "/fies/1975/food/title", value = "18-1 Yearly Average of Monthly Disbursements per Household for Two-or-more-person Households (1963\uff5e2017)" }, { locator = "/fies/1975/food/heading", value = "Food" }, { locator = "/fies/1975/food/unit", value = "(yen)" }, { locator = "/fies/1975/food/file", value = "36-jp-income/fies-a18-1.xls" }, { locator = "/fies/1975/food/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1975/food/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R26C8" }, { locator = "/fies/1975/food/exclusion", value = "\uff0a The data is not including agricultural, forestry and fisheries households." }, { locator = "/fies/1975/consumption/year", value = "1975" }, { locator = "/fies/1975/consumption/heading", value = "Consumption expenditures" }, { locator = "/fies/1975/consumption/sha256", value = "35159f6fa73f09e786857f9aee43800f880a57126a0ec09c821b0d423cdbe172" }, { locator = "/fies/1975/consumption/cell", value = "\u4e8c\u4eba\u4ee5\u4e0a\u306e\u4e16\u5e2f!R26C7" }], calculation = { op = "pct_of", operands = ["/fies/1975/consumption/value"], precision = 1, rounding = "half_up", method = "Food expenditure divided by total consumption expenditure in the same annual-average source row, times one hundred; same household population and year, rounded once to one decimal place." } }
panel = "table"
label = "Food share of consumption expenditure, 1975"
value = "32.0%"
quantity = 32.0
unit = "% of consumption expenditure (all two-or-more-person households)"
source = "jp-fies"
tier = "A"
notes = "Calculated from the archived FIES long-run table's Food and Consumption expenditures cells in the same 1975 annual-average row. The source's Food category is retained without relabelling it as food and non-alcoholic beverages. The percentage is rounded once to one decimal place; calculation operands and rounding are recorded in the audit. The archived table excludes agricultural, forestry and fisheries households."
assumptions = ["composite-family", "jp-household-not-family", "jp-fies-food-share"]

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "jp-1970s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 1970s"
value = "no reliable record accessible online"
unit = "n/a"
source = "jp-mls"
tier = "D"
notes = "Monthly working hours are available from 1975, but no weekly-hour series or durable-goods prices are in the archive, so an hourly wage and hours-of-work-to-afford comparisons cannot be computed for the 1970s. The monthly wage figure above is the available wage reference."
assumptions = ["composite-family", "jp-household-not-family"]
