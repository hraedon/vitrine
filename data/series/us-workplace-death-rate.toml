notes = "The whole series, because the whole series is this short. The Census of Fatal Occupational Injuries has covered all 50 states and DC only since 1992 — before that the United States kept no federal census of people killed at work — and BLS changed the rate's basis in 2006 from employment to hours worked, so figures before 2006 measure something else and are not chained on. Rate = (fatal work injuries / total hours worked) x 200,000,000, the base for 100,000 full-time equivalents at 40 hours a week for 50 weeks."

