# Plan 027 WI-10: daily newspapers — net paid circulation, transcribed from
# the newspapers tables of the Statistical Abstract of the United States
# (1953-1994 editions archived at samples/01-statistical-abstracts/; the 2001
# and 2012 edition sections archived at samples/52-newspapers/). The
# transcription dump with the per-edition prints and archive pins is
# samples/52-newspapers/daily-newspaper-circulation-dump.txt — see the source
# registry entry and the verification log, Plan 027 WI-10, before editing.

[[series]]
id = "us-daily-newspaper-circulation"
label = "Daily newspapers sold per weekday, 1950-2009"
source = "statistical-abstract-newspapers"
tier = "C"
unit = "daily newspapers, net paid circulation, millions of copies"
population = "English-language daily newspapers published in the United States; net paid circulation as of September 30 of the year shown (October 1 in the earliest editions); all-day papers counted once in the total"
notes = "A trade-publisher series: Editor & Publisher yearbook data as republished by the Census Bureau's Statistical Abstract — Tier C, per the source/tier review that governs republished commercial surveys; a federal compiler does not make it Tier A. The 1960 and 1965 figures were revised between editions (the 1970 edition prints 60,882 and 63,030 thousand; the 1985 edition prints 58.9 and 60.4 million); the revised prints are carried and the superseded ones recorded, not smoothed. Values the editions print in thousands keep their full precision; values printed in millions keep the source's 0.1 precision. Years an archived edition does not reprint are absent, not zero: 1951-1954, 1956-1959, 1961-1964, 1966-1971, 1989, 1991-1993 and 2001 among them. The series ends at 2009: the last Statistical Abstract (2012 edition) prints no later data and the Bureau discontinued the compilation; later trade figures use different definitions and were not fetched."

