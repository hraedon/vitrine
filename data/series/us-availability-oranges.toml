notes = "Fresh oranges per capita, farm weight, from the ERS Food Availability (Per Capita) Data System. Availability is a disappearance estimate — production plus imports, less exports and non-food use, over population — so it is what the food supply made available per person, not what was eaten; ERS publishes a separate loss-adjusted series for that and this is not it. The sheet also prints a retail-weight column derived by a conversion factor (CF = 0.97); the unadjusted farm-weight column is taken and the factor is disclosed rather than applied. Verified against the sheet's own availability and population columns for every year."

