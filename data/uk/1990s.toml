# UK, the 1990s. Early-decade snapshots for the descriptive panels: ONS weekly
# earnings (1990), ONS England & Wales tenure (1991), GHS durable-goods diffusion
# (1990). The affordability axis is anchored later in the decade, at 1997, because
# that is the first year with an hourly wage: ASHE begins in 1997, and the wage,
# the hours, the household income and the house price are all taken from that one
# year so the ratios divide like with like.
# Data year anchors: 1990 (earnings, diffusion), 1991 (tenure), 1997 (affordability).

[room]
country = "uk"
decade = "1990s"
wage_anchor = "uk-1990s-hourly-pay"
income_anchor = "uk-1990s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-weekly-earnings"
basis = "weekly"
amount_minor = 29560
currency = "GBP"
price_year = 1990
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 1990"
quantity = 295.6
value = "£295.60"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run earnings series. 1990 (April sample, NES): adult male full-time £295.60/week; adult female full-time £201.50/week. Great Britain. Individual earnings, not family income. The decade began in recession (1990–92) and saw the start of the long real-wage slowdown."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-1990s-household-income"
basis = "annual"
amount_minor = 2493400
currency = "GBP"
price_year = 1997
quantity = 24934
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 1997/98"
value = "£24,934"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, financial year 1997/98, non-retired households of two adults with two children. Original income £30,047; plus £2,018 of cash benefits, gross income £32,064; less £7,130 of direct tax and employees' National Insurance, disposable income £24,934. This is a mean across such households, not a median, and it is income after tax — the US rooms' anchor is gross money income, which is why the two are not chained. It is the income anchor for this room."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

[[fact]]
id = "uk-1990s-hourly-pay"
basis = "hourly"
amount_minor = 707
currency = "GBP"
price_year = 1997
quantity = 7.07
panel = "budget"
label = "Median gross hourly pay, all employee jobs, April 1997"
value = "£7.07"
unit = "GBP per hour, nominal (median gross hourly pay, all employee jobs)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.5a, all-employee sheet, 1997 — the first year of the survey. Median £7.07 across 20,858 thousand employee jobs; the mean was £8.90, and the full-time median £7.92. The all-jobs median is used as the wage anchor because it describes the hour of work actually on offer; the full-time figure sits about 12% above it. Great Britain-consistent back-series; the survey samples April pay for employees on adult rates whose pay was not affected by absence."
assumptions = ["nominal-values", "uk-wage-anchor-all-employees", "affordability-normalization"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-tenure"
quantity = 68
panel = "home"
label = "Tenure of households, England and Wales, 1991"
value = "Owned 68%, private rented 9%, socially rented 23%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation peaked in this decade (68% in 1991), the high-water mark of Right to Buy. Private renting had fallen to 9% — its low point — while the social sector continued shrinking. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The GHS recorded central-heating and appliance ownership through the 1990s, but the fuller GHS durable-goods table (central heating, refrigerator, washing machine, vacuum, dishwasher) is not in the archive for transcription."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-colour-tv"
quantity = 93
panel = "diffusion"
label = "Households with a colour television, 1990"
value = "93%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour TV reached 93% in 1990 (95% by 1993) — effectively universal, as black-and-white-only sets became rare."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-computer"
quantity = 21
panel = "diffusion"
label = "Households with a home computer, 1990"
value = "21%"
unit = "% of households with a home computer"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Home computers, first recorded by the GHS at 9% in 1984, reached 21% in 1990 (24% by 1993) as home PCs and early internet use spread."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-telephone"
quantity = 88
panel = "diffusion"
label = "Households with a telephone, 1990"
value = "88%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Fixed-line telephone neared universality (88% in 1990, 90% by 1993) after BT privatisation and network expansion; mobile phones were just beginning (this GHS series counts the fixed line)."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-car"
quantity = 67
panel = "diffusion"
label = "Households with a car or van, 1990"
value = "67%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 67% in 1990 (68% by 1993), approaching the levels of the denser US suburbs but still well below US national family ownership."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-paid-hours"
quantity = 37
panel = "day"
label = "Paid hours worked in a week, all employee jobs, April 1997"
value = "37.0 hours (median)"
unit = "total paid hours per week, all employee jobs (median)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.9a, all-employee sheet, 1997. The median employee job was paid for 37.0 hours; the mean was 35.1, pulled below the median by part-time jobs. Full-time jobs alone: median 37.9, mean 40.0. Total paid hours includes paid overtime."
assumptions = ["composite-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-food-basket-gap"
panel = "table"
label = "The food basket, 1990s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The National Food Survey (NFS) ran continuously 1940–2000; the 1990s NFS data is not in the archive. (Archive holds NFS 1940–49 and 2023–24, but not the 1990s.)"

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-house-price"
basis = "total"
amount_minor = 7610300
currency = "GBP"
price_year = 1997
quantity = 76103
panel = "work-buys"
label = "Simple average house price, United Kingdom, 1997"
value = "£76,103"
unit = "GBP, nominal (simple average price of a mortgaged dwelling)"
source = "ons-hpi-annual-tables"
tier = "A"
notes = "From ONS house price annual tables, Table 31 (unadjusted), 1997. The same figure appears in Table 28's all-dwellings column, where the average recorded income of the borrowers that year was £26,086 — a mortgage-market population, not the whole country, and higher than the household anchor above. Cash purchases are not in this survey, so the average is of dwellings bought with a mortgage."
assumptions = ["nominal-values", "affordability-normalization"]
