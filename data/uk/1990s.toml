# UK, the 1990s. Early-decade snapshots for the descriptive panels: ONS weekly
# earnings (1990), ONS England & Wales tenure (1991), GHS durable-goods diffusion
# (1990). The affordability axis is anchored later in the decade, at 1997, because
# that is the first year with an hourly wage: ASHE begins in 1997, and the wage,
# the hours, the household income and the house price are all taken from that one
# year so the ratios divide like with like.
# Data year anchors: 1990 (earnings, diffusion), 1991 (tenure), 1997 (affordability).

[room]
country = "uk"
decade = "1990s"
wage_anchor = "uk-1990s-hourly-pay"
income_anchor = "uk-1990s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-weekly-earnings"
audit = { file = "30-uk-income/ons-earnings-1938-2025.xlsx", extractor = "xlsx-cell", locator = "Average Gross Weekly Earnings!I71", scale = "100", target = "amount_minor", guards = [{ locator = "Average Gross Weekly Earnings!E4", value = "Mean gross weekly earnings for Adult Full-Time Employees in Great Britain whose pay for the survey period was not affected by absence" }, { locator = "Average Gross Weekly Earnings!G7", value = "Adult Male" }, { locator = "Average Gross Weekly Earnings!I9", value = "\"All\"" }, { locator = "Average Gross Weekly Earnings!I11", value = "\u00a3" }, { locator = "Average Gross Weekly Earnings!B71", value = "1990" }] }
basis = "weekly"
amount_minor = 29560
currency = "GBP"
price_year = 1990
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 1990"
quantity = 295.6
value = "£295.60"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run mean gross weekly earnings table, April 1990, adult male full-time employees, Great Britain. The table excludes employees whose pay was affected by absence. This is individual employee pay, not a household income or a real-wage comparison; the nominal series alone cannot establish an inflation-adjusted historical ranking."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-1990s-household-income"
audit = { file = "30-uk-income/etb-hhldtype.xlsx", extractor = "xlsx-cell", locator = "1997-98!I33", scale = "100", guards = [{ locator = "1997-98!A1", value = "Summary of the effects of taxes and benefits, by household type,1 1997/98" }, { locator = "1997-98!B22", value = "Non-Retired households" }, { locator = "1997-98!I24", value = "2 adults" }, { locator = "1997-98!I25", value = "with 2" }, { locator = "1997-98!I26", value = "children" }, { locator = "1997-98!A33", value = "Disposable income" }], target = "amount_minor" }
basis = "annual"
amount_minor = 2493400
currency = "GBP"
price_year = 1997
quantity = 24934
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 1997/98"
value = "£24,934"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, financial year 1997/98, non-retired households of two adults with two children. Original income £30,047; plus £2,018 of cash benefits, gross income £32,064; less £7,130 of direct tax and employees' National Insurance, disposable income £24,934. This is a mean across such households, not a median, and it is income after tax — the US rooms' anchor is gross money income, which is why the two are not chained. It is the income anchor for this room."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

[[fact]]
id = "uk-1990s-hourly-pay"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/ashe/1997/hourly/value", scale = "100", target = "amount_minor", guards = [{ locator = "/ashe/1997/hourly/year", value = "1997" }, { locator = "/ashe/1997/hourly/title", value = "Table 1.5a Hourly pay - Gross (\u00a3) - For all employee jobsa: United Kingdom, 1997" }, { locator = "/ashe/1997/hourly/heading", value = "Median" }, { locator = "/ashe/1997/hourly/population", value = "All Employees" }, { locator = "/ashe/1997/hourly/sheet", value = "All" }, { locator = "/ashe/1997/hourly/archive_sha256", value = "69a084baf07231e3da3afd369068e651abb8df3ed444680111765ddf43d967c8" }, { locator = "/ashe/1997/hourly/member", value = "Total Table 1.5a   Hourly pay - Gross 1997.xls" }, { locator = "/ashe/1997/hourly/member_sha256", value = "a0226f29eb26c2e74330dc87df01fb6125080b069b63020b8836ffb1136a2a5b" }, { locator = "/ashe/1997/hourly/cell", value = "All!R6C4" }] }
basis = "hourly"
amount_minor = 707
currency = "GBP"
price_year = 1997
quantity = 7.07
panel = "budget"
label = "Median gross hourly pay, all employee jobs, April 1997"
value = "£7.07"
unit = "GBP per hour, nominal (median gross hourly pay, all employee jobs)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.5a, all-employee sheet, 1997 — the first year of the survey. Median £7.07 across 20,858 thousand employee jobs; the mean was £8.90, and the full-time median £7.92. The all-jobs median is used as the wage anchor because it describes the hour of work actually on offer; the full-time figure sits about 12% above it. Great Britain-consistent back-series; the survey samples April pay for employees on adult rates whose pay was not affected by absence."
assumptions = ["nominal-values", "uk-wage-anchor-all-employees", "affordability-normalization"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-tenure"
audit = { file = "32-uk-housing/ons-century-homeownership.csv", extractor = "csv-cell", locator = "R8:C2", guards = [{ locator = "R1:C1", value = "group" }, { locator = "R1:C2", value = "Owned" }, { locator = "R1:C3", value = "Private rented" }, { locator = "R1:C4", value = "Socially rented" }, { locator = "R8:C1", value = "1991" }, { locator = "R8:C3", value = "9" }, { locator = "R8:C4", value = "23" }], target = "quantity" }
quantity = 68
panel = "home"
label = "Tenure of households, England and Wales, 1991"
value = "Owned 68%, private rented 9%, socially rented 23%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation peaked in this decade (68% in 1991), the high-water mark of Right to Buy. Private renting had fallen to 9% — its low point — while the social sector continued shrinking. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record curated for this measure"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "A compatible observation has not yet been transcribed and qualified for this measure."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-colour-tv"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R14:C2", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C2", value = "Colour television" }, { locator = "R14:C1", value = "1990" }], target = "quantity" }
quantity = 93
panel = "diffusion"
label = "Households with a colour television, 1990"
value = "93%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour TV reached 93% in 1990 (95% by 1993) — effectively universal, as black-and-white-only sets became rare."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-computer"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R14:C3", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C3", value = "Home computer" }, { locator = "R14:C1", value = "1990" }], target = "quantity" }
quantity = 21
panel = "diffusion"
label = "Households with a home computer, 1990"
value = "21%"
unit = "% of households with a home computer"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Home computers, first recorded by the GHS at 9% in 1984, reached 21% in 1990 (24% by 1993) as home PCs and early internet use spread."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-telephone"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R14:C4", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C4", value = "Telephone" }, { locator = "R14:C1", value = "1990" }], target = "quantity" }
quantity = 88
panel = "diffusion"
label = "Households with a telephone, 1990"
value = "88%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Fixed-line telephone neared universality (88% in 1990, 90% by 1993) after BT privatisation and network expansion; mobile phones were just beginning (this GHS series counts the fixed line)."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1990s-car"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R14:C5", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C5", value = "Car or van" }, { locator = "R14:C1", value = "1990" }], target = "quantity" }
quantity = 67
panel = "diffusion"
label = "Households with a car or van, 1990"
value = "67%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 67% in 1990 (68% by 1993), approaching the levels of the denser US suburbs but still well below US national family ownership."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-paid-hours"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/ashe/1997/hours/value", target = "quantity", guards = [{ locator = "/ashe/1997/hours/year", value = "1997" }, { locator = "/ashe/1997/hours/title", value = "Table 1.9a Hours worked - Total - For all employee jobsa: United Kingdom, 1997" }, { locator = "/ashe/1997/hours/heading", value = "Median" }, { locator = "/ashe/1997/hours/population", value = "All Employees" }, { locator = "/ashe/1997/hours/sheet", value = "All" }, { locator = "/ashe/1997/hours/archive_sha256", value = "69a084baf07231e3da3afd369068e651abb8df3ed444680111765ddf43d967c8" }, { locator = "/ashe/1997/hours/member", value = "Total Table 1.9a   Hours worked - Total 1997.xls" }, { locator = "/ashe/1997/hours/member_sha256", value = "f80ec2d4092aeb331b086ebf81a2111b23a657941510a9721aa8006f43e2ed94" }, { locator = "/ashe/1997/hours/cell", value = "All!R6C4" }] }
quantity = 37
panel = "day"
label = "Paid hours worked in a week, all employee jobs, April 1997"
value = "37.0 hours (median)"
unit = "total paid hours per week, all employee jobs (median)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.9a, all-employee sheet, 1997. The median employee job was paid for 37.0 hours; the mean was 35.1, pulled below the median by part-time jobs. Full-time jobs alone: median 37.9, mean 40.0. Total paid hours includes paid overtime."
assumptions = ["composite-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-food-basket-gap"
panel = "table"
label = "The food basket, 1990s"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The original 1997 National Food Survey annual report is now in the archive. Its national food observations have not yet been transcribed and qualified for this room. The survey expanded to Northern Ireland in 1996, and the report distinguishes UK and Great Britain results."

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1990s-house-price"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/housing/1997/value", scale = "100", target = "amount_minor", guards = [{ locator = "/housing/1997/year", value = "1997" }, { locator = "/housing/1997/title", value = "Table 31 Housing market: simple average house prices, United Kingdom (chart) 1, 2, 3 Previously DLUHC Table 571" }, { locator = "/housing/1997/heading", value = "Unadjusted" }, { locator = "/housing/1997/sha256", value = "73d680bc718472953d7e09a0b6e4640777e70981aa6dbca7293ecabb499d1c9d" }, { locator = "/housing/1997/cell", value = "Table 31!R10C2" }] }
basis = "total"
amount_minor = 7610300
currency = "GBP"
price_year = 1997
quantity = 76103
panel = "work-buys"
label = "Simple average house price, United Kingdom, 1997"
value = "£76,103"
unit = "GBP, nominal (simple average price of a mortgaged dwelling)"
source = "ons-hpi-annual-tables"
tier = "A"
notes = "From ONS house price annual tables, Table 31 (unadjusted), 1997. The same figure appears in Table 28's all-dwellings column, where the average recorded income of the borrowers that year was £26,086 — a mortgage-market population, not the whole country, and higher than the household anchor above. Cash purchases are not in this survey, so the average is of dwellings bought with a mortgage."
assumptions = ["nominal-values", "affordability-normalization"]
