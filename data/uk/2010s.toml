# UK, the 2010s. Three verified sources, early-decade snapshots: ONS weekly
# earnings (2010), ONS England & Wales tenure (2011), GHS durable-goods diffusion
# (2011 — the final GHS year before the survey was discontinued in 2012). The
# affordability axis is anchored at 2010: the wage, the hours, the household
# income and the house price are all taken from that one year so the ratios
# divide like with like.
# Data year anchors: 2010 (earnings), 2011 (tenure, diffusion).

[room]
country = "uk"
decade = "2010s"
wage_anchor = "uk-2010s-hourly-pay"
income_anchor = "uk-2010s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-2010s-weekly-earnings"
basis = "weekly"
amount_minor = 65700
currency = "GBP"
price_year = 2010
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 2010"
quantity = 657.0
value = "£657.00"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run earnings series. 2010 (April sample, ASHE): adult male full-time £657.00/week; adult female full-time £514.70/week. Great Britain. Individual earnings, not family income. The decade saw the longest real-wage squeeze since the 1860s (the post-2008 'wage stagnation'), with nominal growth barely outpacing prices."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-2010s-household-income"
basis = "annual"
amount_minor = 4612900
currency = "GBP"
price_year = 2010
quantity = 46129
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 2010/11"
value = "£46,129"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, financial year 2010/11, non-retired households of two adults with two children. Original income £55,409; plus £4,863 of cash benefits, gross income £60,272; less £14,144 of direct tax and employees' National Insurance, disposable income £46,129. A mean across such households, not a median, and income after tax rather than the gross money income the US rooms anchor on. It is the income anchor for this room."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

[[fact]]
id = "uk-2010s-hourly-pay"
basis = "hourly"
amount_minor = 1114
currency = "GBP"
price_year = 2010
quantity = 11.14
panel = "budget"
label = "Median gross hourly pay, all employee jobs, April 2010"
value = "£11.14"
unit = "GBP per hour, nominal (median gross hourly pay, all employee jobs)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.5a, all-employee sheet, 2010. Median £11.14 across 24,263 thousand employee jobs; the mean was £14.60, and the full-time median £12.57. The all-jobs median is the wage anchor because it describes the hour of work actually on offer; the full-time figure sits above it. April pay, employees on adult rates whose pay was not affected by absence."
assumptions = ["nominal-values", "uk-wage-anchor-all-employees", "affordability-normalization"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-2010s-tenure"
quantity = 64
panel = "home"
label = "Tenure of households, England and Wales, 2011"
value = "Owned 64%, private rented 18%, socially rented 18%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation had begun its decline (64% in 2011, down from the 69% peak) as house prices outpaced wages; private renting rose sharply (18%, double its 1991 low). Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2010s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The GHS was discontinued after 2012; its central-heating and appliance tables for the early 2010s are not in the archive. The English Housing Survey (EHS) is the successor for housing amenity data but is not transcribed here."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-2010s-colour-tv"
quantity = 99
panel = "diffusion"
label = "Households with a colour television, 2011"
value = "99%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour TV was universal (99% in 2011, the GHS's final year). The figure counts any colour set; multi-screen and on-demand viewing are beyond this series."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2010s-computer"
quantity = 80
panel = "diffusion"
label = "Households with a home computer, 2011"
value = "80%"
unit = "% of households with a home computer"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Home computers reached 80% in 2011 (from 54% in 2002), though the smartphone was beginning to displace the household computer as the primary connected device."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2010s-telephone"
quantity = 100
panel = "diffusion"
label = "Households with a telephone, 2011"
value = "100%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). The GHS recorded 100% telephone coverage in 2011 — near-universal, combining residual fixed lines with mobile phones. The GHS was discontinued after 2012; later diffusion (smartphones, broadband) is tracked by Ofcom and the ONS Internet Access survey, not transcribed here."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2010s-car"
quantity = 76
panel = "diffusion"
label = "Households with a car or van, 2011"
value = "76%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 76% in 2011 (slightly below the 78% peak of 2008, reflecting the post-2008 downturn) — the GHS's final reading."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-2010s-paid-hours"
quantity = 37
panel = "day"
label = "Paid hours worked in a week, all employee jobs, April 2010"
value = "37.0 hours (median)"
unit = "total paid hours per week, all employee jobs (median)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.9a, all-employee sheet, 2010. The median employee job was paid for 37.0 hours — unmoved from 1997 and 2000 — while the mean fell to 33.4, the part-time share having grown. Full-time jobs alone: median 37.5, mean 39.2. Total paid hours includes paid overtime."
assumptions = ["composite-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-2010s-food-basket-gap"
panel = "table"
label = "The food basket, 2010s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "Defra's Family Food module (LCFS) covers the 2010s, but that data is not in the archive. (Archive holds NFS 1940–49 and Family Food 2023–24, but not the 2010s.)"

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-2010s-house-price"
basis = "total"
amount_minor = 25117400
currency = "GBP"
price_year = 2010
quantity = 251174
panel = "work-buys"
label = "Simple average house price, United Kingdom, 2010"
value = "£251,174"
unit = "GBP, nominal (simple average price of a mortgaged dwelling)"
source = "ons-hpi-annual-tables"
tier = "A"
notes = "From ONS house price annual tables, Table 31 (unadjusted), 2010. The same figure appears in Table 28's all-dwellings column, where the average recorded income of the borrowers was £57,973 — more than double the borrower income of 1997 against a price more than three times as high. Cash purchases are not in this survey, so the average is of dwellings bought with a mortgage."
assumptions = ["nominal-values", "affordability-normalization"]
