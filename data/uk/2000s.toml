# UK, the 2000s. Three verified sources, early-decade snapshots: ONS weekly
# earnings (2000), ONS England & Wales tenure (2001), GHS durable-goods diffusion
# (2002). The affordability axis is anchored at 2000: the wage, the hours, the
# household income and the house price are all taken from that one year so the
# ratios divide like with like.
# Data year anchors: 2000 (earnings), 2001 (tenure), 2002 (diffusion).

[room]
country = "uk"
decade = "2000s"
wage_anchor = "uk-2000s-hourly-pay"
income_anchor = "uk-2000s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-weekly-earnings"
basis = "weekly"
amount_minor = 47360
currency = "GBP"
price_year = 2000
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 2000"
quantity = 473.6
value = "£473.60"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run earnings series. 2000 (April sample, ASHE from 2004 back-cast; 2000 reported under NES methodology): adult male full-time £473.60/week; adult female full-time £345.80/week. Great Britain. Individual earnings, not family income."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-2000s-household-income"
basis = "annual"
amount_minor = 3018100
currency = "GBP"
price_year = 2000
quantity = 30181
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 2000/01"
value = "£30,181"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, financial year 2000/01, non-retired households of two adults with two children. Original income £36,241; plus £2,629 of cash benefits, gross income £38,870; less £8,690 of direct tax and employees' National Insurance, disposable income £30,181. A mean across such households, not a median, and income after tax rather than the gross money income the US rooms anchor on. It is the income anchor for this room."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

[[fact]]
id = "uk-2000s-hourly-pay"
basis = "hourly"
amount_minor = 793
currency = "GBP"
price_year = 2000
quantity = 7.93
panel = "budget"
label = "Median gross hourly pay, all employee jobs, April 2000"
value = "£7.93"
unit = "GBP per hour, nominal (median gross hourly pay, all employee jobs)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.5a, all-employee sheet, 2000. Median £7.93 across 21,721 thousand employee jobs; the mean was £10.22, and the full-time median £8.91. The all-jobs median is the wage anchor because it describes the hour of work actually on offer; the full-time figure sits above it. April pay, employees on adult rates whose pay was not affected by absence."
assumptions = ["nominal-values", "uk-wage-anchor-all-employees", "affordability-normalization"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-tenure"
quantity = 69
panel = "home"
label = "Tenure of households, England and Wales, 2001"
value = "Owned 69%, private rented 12%, socially rented 19%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation at 69% in 2001 — the peak decade before the long decline. Private renting had begun its recovery (12%, up from 9% in 1991) as buy-to-let mortgages expanded; the social sector continued to shrink. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The GHS recorded central-heating and appliance ownership into the 2000s, but the fuller GHS durable-goods table (central heating, refrigerator, washing machine, vacuum, dishwasher) is not in the archive for transcription."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-colour-tv"
quantity = 99
panel = "diffusion"
label = "Households with a colour television, 2002"
value = "99%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour TV was effectively universal by 2002 (99%), as it would remain through the survey's end."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-computer"
quantity = 54
panel = "diffusion"
label = "Households with a home computer, 2002"
value = "54%"
unit = "% of households with a home computer"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Home computers crossed half of households in 2002 (54%, from 27% in 1996) as broadband began to spread. (Internet take-up is tracked separately by the ONS Internet Access survey from 1998, not transcribed here.)"
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-telephone"
quantity = 99
panel = "diffusion"
label = "Households with a telephone, 2002"
value = "99%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Fixed-line telephone reached near-universality (99% in 2002); the GHS series counts the fixed line, while mobile-only households were just beginning to appear."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-car"
quantity = 73
panel = "diffusion"
label = "Households with a car or van, 2002"
value = "73%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 73% in 2002 (75% by 2005), with a rising share of two-car households."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-paid-hours"
quantity = 37
panel = "day"
label = "Paid hours worked in a week, all employee jobs, April 2000"
value = "37.0 hours (median)"
unit = "total paid hours per week, all employee jobs (median)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.9a, all-employee sheet, 2000. The median employee job was paid for 37.0 hours; the mean was 34.7. Full-time jobs alone: median 37.5, mean 39.7. Total paid hours includes paid overtime."
assumptions = ["composite-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-food-basket-gap"
panel = "table"
label = "The food basket, 2000s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The National Food Survey (NFS) ran to 2000 and was succeeded by Defra's Family Food module of the Living Costs and Food Survey; the 2000s data is not in the archive. (Archive holds NFS 1940–49 and 2023–24 Family Food, but not the 2000s.)"

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-house-price"
basis = "total"
amount_minor = 10155000
currency = "GBP"
price_year = 2000
quantity = 101550
panel = "work-buys"
label = "Simple average house price, United Kingdom, 2000"
value = "£101,550"
unit = "GBP, nominal (simple average price of a mortgaged dwelling)"
source = "ons-hpi-annual-tables"
tier = "A"
notes = "From ONS house price annual tables, Table 31 (unadjusted), 2000 — the year the long climb steepened. The same figure appears in Table 28's all-dwellings column, where the average recorded income of the borrowers was £31,193. Cash purchases are not in this survey, so the average is of dwellings bought with a mortgage."
assumptions = ["nominal-values", "affordability-normalization"]
