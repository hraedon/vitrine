# UK, the 2000s. Three verified sources, early-decade snapshots: ONS weekly
# earnings (2000), ONS England & Wales tenure (2001), GHS durable-goods diffusion
# (2002). The affordability axis is anchored at 2000: the wage, the hours, the
# household income and the house price are all taken from that one year so the
# ratios divide like with like.
# Data year anchors: 2000 (earnings), 2001 (tenure), 2002 (diffusion).

[room]
country = "uk"
decade = "2000s"
wage_anchor = "uk-2000s-hourly-pay"
income_anchor = "uk-2000s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-weekly-earnings"
audit = { file = "30-uk-income/ons-earnings-1938-2025.xlsx", extractor = "xlsx-cell", locator = "Average Gross Weekly Earnings!I83", scale = "100", target = "amount_minor", guards = [{ locator = "Average Gross Weekly Earnings!E4", value = "Mean gross weekly earnings for Adult Full-Time Employees in Great Britain whose pay for the survey period was not affected by absence" }, { locator = "Average Gross Weekly Earnings!G7", value = "Adult Male" }, { locator = "Average Gross Weekly Earnings!I9", value = "\"All\"" }, { locator = "Average Gross Weekly Earnings!I11", value = "\u00a3" }, { locator = "Average Gross Weekly Earnings!B83", value = "2000" }] }
basis = "weekly"
amount_minor = 47360
currency = "GBP"
price_year = 2000
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 2000"
quantity = 473.6
value = "£473.60"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run mean gross weekly earnings table, April 2000, adult male full-time employees, Great Britain. The table excludes employees whose pay was affected by absence. This is individual employee pay, not a household income or a real-wage comparison; the nominal series alone cannot establish an inflation-adjusted historical ranking."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-2000s-household-income"
audit = { file = "30-uk-income/etb-hhldtype.xlsx", extractor = "xlsx-cell", locator = "2000-01!I33", scale = "100", guards = [{ locator = "2000-01!A1", value = "Summary of the effects of taxes and benefits, by household type,1 2000/01" }, { locator = "2000-01!B22", value = "Non-Retired households" }, { locator = "2000-01!I24", value = "2 adults" }, { locator = "2000-01!I25", value = "with 2" }, { locator = "2000-01!I26", value = "children" }, { locator = "2000-01!A33", value = "Disposable income" }], target = "amount_minor" }
basis = "annual"
amount_minor = 3018100
currency = "GBP"
price_year = 2000
quantity = 30181
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 2000/01"
value = "£30,181"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, financial year 2000/01, non-retired households of two adults with two children. Original income £36,241; plus £2,629 of cash benefits, gross income £38,870; less £8,690 of direct tax and employees' National Insurance, disposable income £30,181. A mean across such households, not a median, and income after tax rather than the gross money income the US rooms anchor on. It is the income anchor for this room."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

[[fact]]
id = "uk-2000s-hourly-pay"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/ashe/2000/hourly/value", scale = "100", target = "amount_minor", guards = [{ locator = "/ashe/2000/hourly/year", value = "2000" }, { locator = "/ashe/2000/hourly/title", value = "Table 1.5a Hourly pay - Gross (\u00a3) - For all employee jobsa: United Kingdom, 2000" }, { locator = "/ashe/2000/hourly/heading", value = "Median" }, { locator = "/ashe/2000/hourly/population", value = "All Employees" }, { locator = "/ashe/2000/hourly/sheet", value = "All" }, { locator = "/ashe/2000/hourly/archive_sha256", value = "0b393f2c122068240fa40cc58629eb87ca7814f86047ae8ca8d70c505795f7c7" }, { locator = "/ashe/2000/hourly/member", value = "All Employees 1.5a   Hourly pay - Gross 2000.xls" }, { locator = "/ashe/2000/hourly/member_sha256", value = "ca701523ce2a13ce3fb9ad29b65a10a8e02e7ce731ab50827f5da57a7994ada4" }, { locator = "/ashe/2000/hourly/cell", value = "All!R6C4" }] }
basis = "hourly"
amount_minor = 793
currency = "GBP"
price_year = 2000
quantity = 7.93
panel = "budget"
label = "Median gross hourly pay, all employee jobs, April 2000"
value = "£7.93"
unit = "GBP per hour, nominal (median gross hourly pay, all employee jobs)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.5a, all-employee sheet, 2000. Median £7.93 across 21,721 thousand employee jobs; the mean was £10.22, and the full-time median £8.91. The all-jobs median is the wage anchor because it describes the hour of work actually on offer; the full-time figure sits above it. April pay, employees on adult rates whose pay was not affected by absence."
assumptions = ["nominal-values", "uk-wage-anchor-all-employees", "affordability-normalization"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-tenure"
audit = { file = "32-uk-housing/ons-century-homeownership.csv", extractor = "csv-cell", locator = "R9:C2", guards = [{ locator = "R1:C1", value = "group" }, { locator = "R1:C2", value = "Owned" }, { locator = "R1:C3", value = "Private rented" }, { locator = "R1:C4", value = "Socially rented" }, { locator = "R9:C1", value = "2001" }, { locator = "R9:C3", value = "12" }, { locator = "R9:C4", value = "19" }], target = "quantity" }
quantity = 69
panel = "home"
label = "Tenure of households, England and Wales, 2001"
value = "Owned 69%, private rented 12%, socially rented 19%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation at 69% in 2001 — the peak decade before the long decline. Private renting had begun its recovery (12%, up from 9% in 1991) as buy-to-let mortgages expanded; the social sector continued to shrink. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The General Household Survey recorded household central heating and other amenities, and an ONS historical summary contains selected heating observations. Relevant measures have not yet been transcribed and qualified for this room."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-colour-tv"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R18:C2", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C2", value = "Colour television" }, { locator = "R18:C1", value = "2002" }], target = "quantity" }
quantity = 99
panel = "diffusion"
label = "Households with a colour television, 2002"
value = "99%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour TV was effectively universal by 2002 (99%), as it would remain through the survey's end."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-computer"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R18:C3", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C3", value = "Home computer" }, { locator = "R18:C1", value = "2002" }], target = "quantity" }
quantity = 54
panel = "diffusion"
label = "Households with a home computer, 2002"
value = "54%"
unit = "% of households with a home computer"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Home computers crossed half of households in 2002 (54%, from 27% in 1996) as broadband began to spread. (Internet take-up is tracked separately by the ONS Internet Access survey from 1998, not transcribed here.)"
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-telephone"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R18:C4", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C4", value = "Telephone" }, { locator = "R18:C1", value = "2002" }], target = "quantity" }
quantity = 99
panel = "diffusion"
label = "Households with a telephone, 2002"
value = "99%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Fixed-line telephone reached near-universality (99% in 2002); the GHS series counts the fixed line, while mobile-only households were just beginning to appear."
assumptions = ["composite-family"]

[[fact]]
id = "uk-2000s-car"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R18:C5", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C5", value = "Car or van" }, { locator = "R18:C1", value = "2002" }], target = "quantity" }
quantity = 73
panel = "diffusion"
label = "Households with a car or van, 2002"
value = "73%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 73% in 2002 (75% by 2005), with a rising share of two-car households."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-paid-hours"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/ashe/2000/hours/value", target = "quantity", guards = [{ locator = "/ashe/2000/hours/year", value = "2000" }, { locator = "/ashe/2000/hours/title", value = "Table 1.9a Hours worked - Total - For all employee jobsa: United Kingdom, 2000" }, { locator = "/ashe/2000/hours/heading", value = "Median" }, { locator = "/ashe/2000/hours/population", value = "All Employees" }, { locator = "/ashe/2000/hours/sheet", value = "All" }, { locator = "/ashe/2000/hours/archive_sha256", value = "0b393f2c122068240fa40cc58629eb87ca7814f86047ae8ca8d70c505795f7c7" }, { locator = "/ashe/2000/hours/member", value = "All Employees 1.9a   Hours worked - Total 2000.xls" }, { locator = "/ashe/2000/hours/member_sha256", value = "e915c9823686af5415d4493f880dc87f0ae811fc3b7938d6a438728f05c3426c" }, { locator = "/ashe/2000/hours/cell", value = "All!R6C4" }] }
quantity = 37
panel = "day"
label = "Paid hours worked in a week, all employee jobs, April 2000"
value = "37.0 hours (median)"
unit = "total paid hours per week, all employee jobs (median)"
source = "ons-ashe-table1"
tier = "A"
notes = "From ASHE Table 1.9a, all-employee sheet, 2000. The median employee job was paid for 37.0 hours; the mean was 34.7. Full-time jobs alone: median 37.5, mean 39.7. Total paid hours includes paid overtime."
assumptions = ["composite-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-food-basket-gap"
panel = "table"
label = "The food basket, 2000s"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The National Food Survey was succeeded by the Expenditure and Food Survey and later the Family Food module. An archived Family Food report includes some 2000s estimates, but a suitable food basket has not yet been transcribed and qualified for this room."

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-2000s-house-price"
audit = { file = "59-workbook-review/observations.json", extractor = "json-pointer", locator = "/housing/2000/value", scale = "100", target = "amount_minor", guards = [{ locator = "/housing/2000/year", value = "2000" }, { locator = "/housing/2000/title", value = "Table 31 Housing market: simple average house prices, United Kingdom (chart) 1, 2, 3 Previously DLUHC Table 571" }, { locator = "/housing/2000/heading", value = "Unadjusted" }, { locator = "/housing/2000/sha256", value = "73d680bc718472953d7e09a0b6e4640777e70981aa6dbca7293ecabb499d1c9d" }, { locator = "/housing/2000/cell", value = "Table 31!R13C2" }] }
basis = "total"
amount_minor = 10155000
currency = "GBP"
price_year = 2000
quantity = 101550
panel = "work-buys"
label = "Simple average house price, United Kingdom, 2000"
value = "£101,550"
unit = "GBP, nominal (simple average price of a mortgaged dwelling)"
source = "ons-hpi-annual-tables"
tier = "A"
notes = "From ONS house price annual tables, Table 31 (unadjusted), 2000 — the year the long climb steepened. The same figure appears in Table 28's all-dwellings column, where the average recorded income of the borrowers was £31,193. Cash purchases are not in this survey, so the average is of dwellings bought with a mortgage."
assumptions = ["nominal-values", "affordability-normalization"]
