# UK, the 1970s. The decade UK official-statistics coverage "begins in earnest":
# the General Household Survey (GHS, from 1971) gives durable-goods diffusion from
# 1972; ONS holds a continuous weekly-earnings series from 1938; ONS analysis gives
# England & Wales tenure from 1918. No affordability anchors are set for this room:
# only weekly (not hourly) earnings are in hand and no median household-income series
# is in the archive, so the affordability axis is not computed.
# Data year anchors: 1970 (earnings), 1971 (tenure), 1972 (diffusion).
# Country caveat: the UK official series measure households (not the four-person
# family); the composite-family disclaimer applies.

[room]
country = "uk"
decade = "1970s"
income_anchor = "uk-1970s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1970s-weekly-earnings"
audit = { file = "30-uk-income/ons-earnings-1938-2025.xlsx", extractor = "xlsx-cell", locator = "Average Gross Weekly Earnings!I49", scale = "100", target = "amount_minor", guards = [{ locator = "Average Gross Weekly Earnings!E4", value = "Mean gross weekly earnings for Adult Full-Time Employees in Great Britain whose pay for the survey period was not affected by absence" }, { locator = "Average Gross Weekly Earnings!G7", value = "Adult Male" }, { locator = "Average Gross Weekly Earnings!I9", value = "\"All\"" }, { locator = "Average Gross Weekly Earnings!I11", value = "\u00a3" }, { locator = "Average Gross Weekly Earnings!B49", value = "1970" }] }
basis = "weekly"
amount_minor = 3000
currency = "GBP"
price_year = 1970
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 1970"
quantity = 30.0
value = "£30.00"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run mean gross weekly earnings table, April 1970, adult male full-time employees, Great Britain. The table excludes employees whose pay was affected by absence. This is individual employee pay, not a household income or a real-wage comparison; the nominal series alone cannot establish an inflation-adjusted historical ranking."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-1970s-household-income"
audit = { file = "30-uk-income/etb-hhldtype.xlsx", extractor = "xlsx-cell", locator = "1977!G38", scale = "100", guards = [{ locator = "1977!A1", value = "Summary of the effects of taxes and benefits, by household type,1 1977" }, { locator = "1977!B27", value = "Non-Retired households" }, { locator = "1977!G29", value = "2 adults" }, { locator = "1977!G30", value = "with 2" }, { locator = "1977!G31", value = "children" }, { locator = "1977!A38", value = "Disposable income" }], target = "amount_minor" }
basis = "annual"
amount_minor = 411600
currency = "GBP"
price_year = 1977
quantity = 4116
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 1977"
value = "£4,116"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, 1977 — the first year of the series, and the earliest UK household-income figure in the archive. Non-retired households of two adults with two children: original income £5,073; plus £257 of cash benefits, gross income £5,330; less £1,214 of direct tax and employees' National Insurance, disposable income £4,116. A mean across such households, not a median. It is the income anchor for this room; nothing is yet priced against it, because no official UK house-price series in the archive reaches back before 1986."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1970s-tenure"
audit = { file = "32-uk-housing/ons-century-homeownership.csv", extractor = "csv-cell", locator = "R6:C2", guards = [{ locator = "R1:C1", value = "group" }, { locator = "R1:C2", value = "Owned" }, { locator = "R1:C3", value = "Private rented" }, { locator = "R1:C4", value = "Socially rented" }, { locator = "R6:C1", value = "1971" }, { locator = "R6:C3", value = "20" }, { locator = "R6:C4", value = "29" }], target = "quantity" }
quantity = 51
panel = "home"
label = "Tenure of households, England and Wales, 1971"
value = "Owned 51%, private rented 20%, socially rented 29%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. 1971: owner-occupation had reached half of households (51%), up from 43% in 1961; the social-rented sector (largely council housing) stood at 29% and would hold near that level through the decade. Private renting continued its long decline (76% in 1918 → 20% in 1971). Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1970s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The General Household Survey recorded household central heating and other amenities, and an ONS historical summary contains selected heating observations. Relevant measures have not yet been transcribed and qualified for this room."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1970s-telephone"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R8:C4", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C4", value = "Telephone" }, { locator = "R8:C1", value = "1972" }], target = "quantity" }
quantity = 42
panel = "diffusion"
label = "Households with a telephone, 1972"
value = "42%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). The telephone was still a minority good in 1972 (42%), under the nationalised Post Office monopoly; new-line waiting lists ran years. Rose to 54% by 1975."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1970s-car"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R8:C5", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C5", value = "Car or van" }, { locator = "R8:C1", value = "1972" }], target = "quantity" }
quantity = 52
panel = "diffusion"
label = "Households with a car or van, 1972"
value = "52%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership crossed half of households around 1970 — far behind the US (which passed 60% of families by 1929) but rising fast (56% by 1978). UK ownership was held back until the 1970s by lower incomes and denser cities; the majority of car-owning households had one car."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1970s-colour-tv"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R10:C2", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C2", value = "Colour television" }, { locator = "R10:C1", value = "1978" }], target = "quantity" }
quantity = 61
panel = "diffusion"
label = "Households with a colour television, 1978"
value = "61%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). In 1978, 61% of households had a colour set. This measures colour-set ownership, not ownership of any television. The overview's colour-TV series begins with 1978."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1970s-paid-hours"
quantity = 42.7
panel = "day"
label = "Average weekly hours worked, full-time men aged 21 and over, April 1976"
value = "42.7 hours"
unit = "average weekly hours worked, all industries (excluding those whose pay was affected by absence)"
source = "dep-labour-year-book-1976"
tier = "A"
notes = "From the New Earnings Survey results republished in the Year Book, Great Britain, all industries, April 1976. Full-time manual men aged 21 and over worked 45.3 hours and non-manual men 38.5. Full-time women aged 18 and over averaged 37.3 hours. The same table reports 41.1 hours for full-time adult men and women combined. The 1965 manual-hours observation covers the United Kingdom, a different geographic population."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1970s-hourly-earnings"
quantity = 166.6
panel = "day"
label = "Average hourly earnings, full-time men aged 21 and over, April 1976"
value = "166.6p an hour, excluding overtime"
unit = "pence per hour, nominal (all industries; excluding overtime pay and overtime hours)"
source = "dep-labour-year-book-1976"
tier = "A"
notes = "From the same Year Book table, all industries in Great Britain, April 1976: 166.6p an hour excluding overtime pay and hours, 166.8p including them. Full-time manual men earned 141.0p and 143.7p on the same two bases. This is not set as the room wage anchor: a tenth of a penny cannot be held in whole pence, and rounding to £1.67 would change the printed value."
assumptions = ["nominal-values"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1970s-food-basket-gap"
panel = "table"
label = "The food basket, 1970s"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The National Food Survey reports for 1974 and 1979 are in the archive, including national consumption, expenditure and price tables for food obtained for consumption at home. Those tables have not yet been transcribed and qualified for this room. This is a curation gap, not evidence that the reports or the underlying record are unavailable."

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1970s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 1970s"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-hpi-annual-tables"
tier = "D"
notes = "An hourly earnings observation and household-income observation are available. Food price tables also exist in archived National Food Survey reports, but no compatible item price has been transcribed and qualified for this comparison. The hourly earnings observation cannot currently be held as a whole-penny wage anchor."
