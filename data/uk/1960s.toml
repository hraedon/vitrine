# UK, the 1960s. Pre-1970, only MANUAL-worker earnings exist in the ONS series,
# so the wage anchor is adult male manual workers. TV diffusion is taken from
# receiving-licence counts (near-universal by mid-decade); colour from 1968.
# No affordability anchors (weekly manual earnings only; no household-income
# series in archive).
# Data year anchors: 1961 (tenure), 1965 (earnings, TV licences).

[room]
country = "uk"
decade = "1960s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-weekly-earnings"
basis = "weekly"
amount_minor = 1891
currency = "GBP"
price_year = 1965
panel = "budget"
label = "Average gross weekly earnings, adult male manual workers, 1965"
quantity = 18.91
value = "£18.91"
unit = "GBP per week, nominal (mean gross weekly earnings, male manual, full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run earnings series. 1965 (April sample, pre-NES): adult male manual workers £18.91/week; adult female manual workers £9.21/week. Great Britain. Pre-1970 the series reports manual and non-manual workers separately, not a combined all-employee figure. Individual earnings, not family income."
assumptions = ["composite-family", "nominal-values", "manufacturing-wage-proxy"]

[[fact]]
id = "uk-1960s-household-income-gap"
panel = "budget"
label = "Median household income, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-earnings-1938-2025"
tier = "D"
notes = "No median household-income series is transcribed for the 1960s. The FES collected household income through the decade but is not in the archive. The manual-earnings figure above is the available wage anchor, not a household-income median."

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-tenure"
quantity = 43
panel = "home"
label = "Tenure of households, England and Wales, 1961"
value = "Owned 43%, private rented 34%, socially rented 23%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. 1961: owner-occupation had risen to 43% (from 32% in 1953) as mortgage access widened; private renting continued its long decline (34%). The social-rented sector more than doubled over the decade (10% → 23%) on the postwar council-house building drive. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1960s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The 1961 Census asked about piped water, WC, fixed bath, and piped hot water, but those amenity tables are not in the archive. The GHS (central heating, appliances) did not begin until 1971. Slum clearance and new council estates were rapidly extending inside bathrooms and hot water through the decade."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-television"
panel = "diffusion"
label = "Television receiving licences, 1965"
value = "13,253,045 licences (1965)"
unit = "television receiving licences at 31 March (≈ TV-owning households)"
source = "terramedia-tv-licences"
tier = "A"
notes = "From BBC / TV Licensing receiving-licence counts. Television reached near-universality through the 1960s: 10,469,753 licences (1960) → 13,253,045 (1965), covering the great majority of households. BBC2 and colour television began in 1968. One licence was required per household with a set, so the count approximates TV-owning households (slight evasion undercount). This licence count is not directly comparable to the post-1972 GHS household-percentage series."

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-work-hours-gap"
panel = "day"
label = "Weekly work hours, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-earnings-1938-2025"
tier = "D"
notes = "No continuous hours-worked survey exists before the Labour Force Survey (1973). Without hours, weekly earnings cannot be converted to an hourly wage, so no affordability anchor is set."

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-food-basket-gap"
panel = "table"
label = "The food basket, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The National Food Survey (NFS) ran continuously 1940–2000, but the 1960s NFS data is not in the archive. (Archive holds NFS 1940–49 and 2023–24, but not the 1960s.)"

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 1960s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-earnings-1938-2025"
tier = "D"
notes = "Without an hourly wage (no hours data) or item prices in the archive, hours-of-work-to-afford comparisons cannot be computed for the 1960s. The weekly manual-earnings figure (£18.91 male manual, 1965) is the available wage reference."
