# UK, the 1960s. Pre-1970, only MANUAL-worker earnings exist in the ONS series,
# so the wage anchor is adult male manual workers. TV diffusion is taken from
# receiving-licence counts; these are not household penetration rates.
# No affordability anchors: the household-income series begins only in 1977, and
# the decade's hourly earnings are printed in shillings and pence, which the money
# layer cannot hold. Hours, which the same table prints in decimals, are recorded.
# Data year anchors: 1961 (tenure), 1965 (earnings, hours, TV licences).

[room]
country = "uk"
decade = "1960s"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-weekly-earnings"
audit = { file = "30-uk-income/ons-earnings-1938-2025.xlsx", extractor = "xlsx-cell", locator = "Average Gross Weekly Earnings!E42", scale = "100", target = "amount_minor", guards = [{ locator = "Average Gross Weekly Earnings!E4", value = "Mean gross weekly earnings for Adult Full-Time Employees in Great Britain whose pay for the survey period was not affected by absence" }, { locator = "Average Gross Weekly Earnings!G7", value = "Adult Male" }, { locator = "Average Gross Weekly Earnings!E9", value = "Manual" }, { locator = "Average Gross Weekly Earnings!E11", value = "\u00a3" }, { locator = "Average Gross Weekly Earnings!B42", value = "1965" }] }
basis = "weekly"
amount_minor = 1891
currency = "GBP"
price_year = 1965
panel = "budget"
label = "Average gross weekly earnings, adult male manual workers, 1965"
quantity = 18.91
value = "£18.91"
unit = "GBP per week, nominal (mean gross weekly earnings, male manual, full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run mean gross weekly earnings table, April 1965, adult male manual full-time employees, Great Britain. The table excludes employees whose pay was affected by absence. This is individual employee pay, not a household income or a real-wage comparison; the nominal series alone cannot establish an inflation-adjusted historical ranking."
assumptions = ["composite-family", "nominal-values", "manufacturing-wage-proxy"]

[[fact]]
id = "uk-1960s-household-income-gap"
panel = "budget"
label = "Median household income, 1960s"
value = "no reliable record curated for this measure"
unit = "n/a"
source = "ons-earnings-1938-2025"
tier = "D"
notes = "A compatible observation has not yet been transcribed and qualified for this measure."

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-tenure"
audit = { file = "32-uk-housing/ons-century-homeownership.csv", extractor = "csv-cell", locator = "R5:C2", guards = [{ locator = "R1:C1", value = "group" }, { locator = "R1:C2", value = "Owned" }, { locator = "R1:C3", value = "Private rented" }, { locator = "R1:C4", value = "Socially rented" }, { locator = "R5:C1", value = "1961" }, { locator = "R5:C3", value = "34" }, { locator = "R5:C4", value = "23" }], target = "quantity" }
quantity = 43
panel = "home"
label = "Tenure of households, England and Wales, 1961"
value = "Owned 43%, private rented 34%, socially rented 23%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. 1961: owner-occupation had risen to 43% (from 32% in 1953) as mortgage access widened; private renting continued its long decline (34%). The social-rented share was 23%, compared with 18% in 1953. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1960s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record curated for this measure"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "A compatible observation has not yet been transcribed and qualified for this measure."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-television"
panel = "diffusion"
label = "Television receiving licences, 1965"
value = "13,253,045 licences (1965)"
unit = "television receiving licences at 31 March"
source = "hansard-tv-licences-1986"
tier = "A"
notes = "From television licence counts reported by the Government to Parliament. The register reports 10,469,753 licences in 1960 and 13,253,045 in 1965. These are administrative counts without a household denominator; they do not establish a household ownership percentage or near-universal access. This licence count is not directly comparable to the post-1972 GHS household-percentage series."

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-work-hours"
quantity = 47.5
panel = "day"
label = "Average weekly hours worked, full-time manual men aged 21 and over, April 1965"
value = "47.5 hours"
unit = "average weekly hours worked, all industries covered (men aged 21 and over, manual, full-time)"
source = "dep-labour-year-book-1969"
tier = "A"
notes = "From the Department of Employment earnings enquiry, republished in the Year Book, all industries covered, April 1965. Hours fell overall from 47.5 in April 1965 to 46.4 in April 1969, with increases in some years. The same table gives weekly earnings of £18 18s 2d for this group and month; the ONS long-run series gives £18.91."
assumptions = ["composite-family"]

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-food-basket-gap"
panel = "table"
label = "The food basket, 1960s"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "An original food survey report for this decade is available in the source archive. Its food-at-home observations have not yet been transcribed and qualified for this room; the gap is a curation boundary."

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1960s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 1960s"
value = "no reliable record curated for this measure"
unit = "n/a"
source = "dep-labour-year-book-1969"
tier = "D"
notes = "A compatible observation has not yet been transcribed and qualified for this measure."
