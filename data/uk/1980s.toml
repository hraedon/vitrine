# UK, the 1980s. Same three verified sources as the 1970s room, aligned to early-
# decade snapshots: ONS weekly earnings (1980), ONS England & Wales tenure (1981),
# GHS durable-goods diffusion (1981). No affordability anchors (weekly, not hourly,
# earnings only; no household-income series in the archive).
# Data year anchors: 1980 (earnings), 1981 (tenure, diffusion).

[room]
country = "uk"
decade = "1980s"
income_anchor = "uk-1980s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-weekly-earnings"
basis = "weekly"
amount_minor = 12450
currency = "GBP"
price_year = 1980
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 1980"
quantity = 124.5
value = "£124.50"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run earnings series. 1980 (April sample, NES): adult male full-time £124.50/week; adult female full-time £78.80/week. Great Britain. Individual earnings, not family income. High inflation through the decade (RPI roughly doubled 1980→1990) drove rapid nominal growth — male full-time reached £192.40 by 1985."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-1980s-household-income"
basis = "annual"
amount_minor = 688800
currency = "GBP"
price_year = 1980
quantity = 6888
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 1980"
value = "£6,888"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, 1980. Non-retired households of two adults with two children: original income £8,218; plus £569 of cash benefits, gross income £8,787; less £1,899 of direct tax and employees' National Insurance, disposable income £6,888. A mean across such households, not a median. It is the income anchor for this room; nothing is yet priced against it, because the official UK house-price series in the archive begins in 1986."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-tenure"
quantity = 58
panel = "home"
label = "Tenure of households, England and Wales, 1981"
value = "Owned 58%, private rented 11%, socially rented 31%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation was now the majority (58%, up from 51% in 1971), fuelled by Right to Buy (the 1980 Housing Act let council tenants purchase their homes at discount). The social-rented sector peaked near 31% and would shrink through the decade as Right to Buy moved stock into ownership. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1980s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The GHS recorded central-heating and appliance ownership through the 1980s, and the 1981 Census asked about hot water, fixed bath, and inside WC, but neither the census amenity tables nor the fuller GHS durable-goods table (central heating, refrigerator, washing machine, vacuum, dishwasher) is in the archive for transcription."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-colour-tv"
quantity = 74
panel = "diffusion"
label = "Households with a colour television, 1981"
value = "74%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour TV spread quickly after its 1968 launch: 61% in 1978, 74% in 1981, 83% by 1984. Total TV access (black-and-white plus colour) was near-universal."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1980s-telephone"
quantity = 75
panel = "diffusion"
label = "Households with a telephone, 1981"
value = "75%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Telephone jumped from 42% (1972) to 75% (1981) as the nationalised BT network expanded; BT was privatised in 1984. New-line waiting lists, chronic in the 1970s, eased."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1980s-car"
quantity = 59
panel = "diffusion"
label = "Households with a car or van, 1981"
value = "59%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 59% in 1981 (from 52% in 1972), still well below the US but climbing steadily; 61% by 1984. The home computer first appears in the GHS in 1984 (9%)."
assumptions = ["composite-family"]

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-work-hours-gap"
panel = "day"
label = "Weekly work hours, 1980s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-earnings-1938-2025"
tier = "D"
notes = "The 1980s fall in a gap between two sources that do carry UK hours. The British Labour Statistics Year Books, which republished the New Earnings Survey's hours tables, end with the 1976 volume; ASHE's hours tables begin in 1997. The LFS ran through the decade but its per-worker averages start only in 1992. Without hours, weekly earnings cannot be converted to an hourly wage, so no wage anchor is set for this room — the income anchor is."

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-food-basket-gap"
panel = "table"
label = "The food basket, 1980s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The National Food Survey (NFS) ran continuously 1940–2000; the 1980s NFS data is not in the archive. (Archive holds NFS 1940–49 and 2023–24, but not the 1980s.)"

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-work-buys-gap"
panel = "work-buys"
label = "Affordability comparisons, 1980s"
value = "no reliable record accessible online"
unit = "n/a"
source = "ons-hpi-annual-tables"
tier = "D"
notes = "A household income is now in hand (£6,888, 1980) but nothing to divide by it: the official ONS house-price series begins in 1986, and the only UK series reaching 1980 is the Nationwide lender index, which is not an official statistic and is not transcribed here. No hourly wage exists for the decade either, so the hours axis is doubly blocked."