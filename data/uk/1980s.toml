# UK, the 1980s. Same three verified sources as the 1970s room, aligned to early-
# decade snapshots: ONS weekly earnings (1980), ONS England & Wales tenure (1981),
# GHS durable-goods diffusion (1981). No affordability anchors (weekly, not hourly,
# earnings only; no household-income series in the archive).
# Data year anchors: 1980 (earnings), 1981 (tenure, diffusion).

[room]
country = "uk"
decade = "1980s"
income_anchor = "uk-1980s-household-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-weekly-earnings"
audit = { file = "30-uk-income/ons-earnings-1938-2025.xlsx", extractor = "xlsx-cell", locator = "Average Gross Weekly Earnings!I59", scale = "100", target = "amount_minor", guards = [{ locator = "Average Gross Weekly Earnings!E4", value = "Mean gross weekly earnings for Adult Full-Time Employees in Great Britain whose pay for the survey period was not affected by absence" }, { locator = "Average Gross Weekly Earnings!G7", value = "Adult Male" }, { locator = "Average Gross Weekly Earnings!I9", value = "\"All\"" }, { locator = "Average Gross Weekly Earnings!I11", value = "\u00a3" }, { locator = "Average Gross Weekly Earnings!B59", value = "1980" }] }
basis = "weekly"
amount_minor = 12450
currency = "GBP"
price_year = 1980
panel = "budget"
label = "Average gross weekly earnings, adult male full-time employees, 1980"
quantity = 124.5
value = "£124.50"
unit = "GBP per week, nominal (mean gross weekly earnings, male full-time)"
source = "ons-earnings-1938-2025"
tier = "A"
notes = "From the ONS long-run mean gross weekly earnings table, April 1980, adult male full-time employees, Great Britain. The table excludes employees whose pay was affected by absence. This is individual employee pay, not a household income or a real-wage comparison; the nominal series alone cannot establish an inflation-adjusted historical ranking."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "uk-1980s-household-income"
audit = { file = "30-uk-income/etb-hhldtype.xlsx", extractor = "xlsx-cell", locator = "1980!G38", scale = "100", guards = [{ locator = "1980!A1", value = "Summary of the effects of taxes and benefits, by household type,1 1980" }, { locator = "1980!B27", value = "Non-Retired households" }, { locator = "1980!G29", value = "2 adults" }, { locator = "1980!G30", value = "with 2" }, { locator = "1980!G31", value = "children" }, { locator = "1980!A38", value = "Disposable income" }], target = "amount_minor" }
basis = "annual"
amount_minor = 688800
currency = "GBP"
price_year = 1980
quantity = 6888
panel = "budget"
label = "Disposable income of a two-adult, two-child household, 1980"
value = "£6,888"
unit = "GBP per year, nominal (mean disposable income per household)"
source = "ons-etb-household-type"
tier = "A"
notes = "From the ONS effects-of-taxes-and-benefits historical dataset, 1980. Non-retired households of two adults with two children: original income £8,218; plus £569 of cash benefits, gross income £8,787; less £1,899 of direct tax and employees' National Insurance, disposable income £6,888. A mean across such households, not a median. It is the income anchor for this room; nothing is yet priced against it, because the official UK house-price series in the archive begins in 1986."
assumptions = ["composite-family", "four-person-normalization", "nominal-values", "uk-household-not-family"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-tenure"
audit = { file = "32-uk-housing/ons-century-homeownership.csv", extractor = "csv-cell", locator = "R7:C2", guards = [{ locator = "R1:C1", value = "group" }, { locator = "R1:C2", value = "Owned" }, { locator = "R1:C3", value = "Private rented" }, { locator = "R1:C4", value = "Socially rented" }, { locator = "R7:C1", value = "1981" }, { locator = "R7:C3", value = "11" }, { locator = "R7:C4", value = "31" }], target = "quantity" }
quantity = 58
panel = "home"
label = "Tenure of households, England and Wales, 1981"
value = "Owned 58%, private rented 11%, socially rented 31%"
unit = "% of households"
source = "ons-century-homeownership"
tier = "A"
notes = "From ONS analysis of Census of England and Wales tenure. Owner-occupation was now the majority (58%, up from 51% in 1971), fuelled by Right to Buy (the 1980 Housing Act let council tenants purchase their homes at discount). The social-rented sector peaked near 31% and would shrink through the decade as Right to Buy moved stock into ownership. Households, not families."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1980s-housing-amenities-gap"
panel = "home"
label = "Rooms, floor area, amenities (bath, WC, central heating)"
value = "no reliable record transcribed here"
unit = "n/a"
source = "ons-ghs-40yr"
tier = "D"
notes = "The General Household Survey recorded household central heating and other amenities, and an ONS historical summary contains selected heating observations. Relevant measures have not yet been transcribed and qualified for this room."

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-colour-tv"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R11:C2", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C2", value = "Colour television" }, { locator = "R11:C1", value = "1981" }], target = "quantity" }
quantity = 74
panel = "diffusion"
label = "Households with a colour television, 1981"
value = "74%"
unit = "% of households with a colour television"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Colour-TV ownership was 61% in 1978, 74% in 1981 and 83% in 1984. These figures measure colour-set ownership, not ownership of any television."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1980s-telephone"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R11:C4", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C4", value = "Telephone" }, { locator = "R11:C1", value = "1981" }], target = "quantity" }
quantity = 75
panel = "diffusion"
label = "Households with a telephone, 1981"
value = "75%"
unit = "% of households with a telephone"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Telephone jumped from 42% (1972) to 75% (1981) as the nationalised BT network expanded; BT was privatised in 1984. New-line waiting lists, chronic in the 1970s, eased."
assumptions = ["composite-family"]

[[fact]]
id = "uk-1980s-car"
audit = { file = "33-uk-diffusion/ghs-data-chart3.csv", extractor = "csv-cell", locator = "R11:C5", guards = [{ locator = "R1:C1", value = "Figure 40.2: Percentage of consumer durables and cars, 1972 to 2011" }, { locator = "R4:C2", value = "1. Unweighted data" }, { locator = "R5:C2", value = "Percentage" }, { locator = "R7:C5", value = "Car or van" }, { locator = "R11:C1", value = "1981" }], target = "quantity" }
quantity = 59
panel = "diffusion"
label = "Households with a car or van, 1981"
value = "59%"
unit = "% of households with a car or van"
source = "ons-ghs-40yr"
tier = "A"
notes = "From GHS 40-year overview, Figure 40.2 (unweighted). Car ownership reached 59% in 1981 (from 52% in 1972), still well below the US but climbing steadily; 61% by 1984. The home computer first appears in the GHS in 1984 (9%)."
assumptions = ["composite-family"]

