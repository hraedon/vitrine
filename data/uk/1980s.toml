# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "uk-1980s-food-basket-gap"
panel = "table"
label = "Complete food basket and expenditure breakdown, 1980s"
value = "no reliable record transcribed here"
unit = "n/a"
source = "maff-nfs-1984"
tier = "D"
notes = "The archived National Food Survey report for 1984 now supports separate milk and egg observations below. A complete basket, food expenditure amounts and household-type breakdowns have not been transcribed and qualified for this room. The two selected food-at-home acquisition measures do not describe total diet or a four-person household."

[[fact]]
id = "uk-1980s-full-price-whole-milk"
panel = "table"
label = "Full-price liquid whole milk entering homes, Great Britain, 1984"
quantity = 3.53
value = "3.53 pints per person per week"
unit = "pints per person per week, annual average household food acquisitions"
source = "maff-nfs-1984"
tier = "A"
notes = "From NFS 1984, Table 8, printed page 28 (PDF page 40), Consumption: Yearly average column. The report calls this consumption, but Appendix A, page 145, defines records as food entering the household, not amounts actually eaten. The sample covers private households in mainland Great Britain and the Isle of Wight, excluding the Scilly Isles and Scottish islands, with one-week diaries; quantities are annual averages per person. Meals out, pet food, confectionery and alcoholic drinks are outside the main food record; soft drinks were recorded separately and excluded from these main tables. This is liquid whole milk at full price, not all milk or all dairy products. Pints retain the source's British imperial unit; no conversion or four-person scaling is applied."
assumptions = ["composite-family"]
audit = { file = "59-workbook-review/nfs-1984-observations.json", extractor = "json-pointer", locator = "/milk/value", target = "quantity", guards = [{ locator = "/source_sha256", value = "b462e25868b77ba74e17eabeac4679837d5b0fe4382a977861886bbba04a72b2" }, { locator = "/year", value = "1984" }, { locator = "/table", value = "8" }, { locator = "/printed_page", value = "28" }, { locator = "/pdf_page", value = "40" }, { locator = "/column", value = "Consumption: Yearly average" }, { locator = "/population", value = "Private households in mainland Great Britain and Isle of Wight; excludes Scilly Isles and Scottish islands; one-week food diaries" }, { locator = "/definition", value = "Food entering the household, not amounts actually eaten" }, { locator = "/milk/unit", value = "pints per person per week" }, { locator = "/milk/item", value = "Liquid whole milk, full price" }, { locator = "/milk/source_row", value = "Liquid wholemilk,full price (pt) 3-73 3-53 3-46 3-41 3-53 3-<7" }] }

[[fact]]
id = "uk-1980s-eggs-at-home"
panel = "table"
label = "Eggs entering homes, Great Britain, 1984"
quantity = 3.21
value = "3.21 eggs per person per week"
unit = "eggs per person per week, annual average household food acquisitions"
source = "maff-nfs-1984"
tier = "A"
notes = "From NFS 1984, Table 8, printed page 28 (PDF page 40), Consumption: Yearly average column. The report calls this consumption, but Appendix A, page 145, defines records as food entering the household, not amounts actually eaten. The sample covers private households in mainland Great Britain and the Isle of Wight, excluding the Scilly Isles and Scottish islands, with one-week diaries; quantities are annual averages per person. Meals out, pet food, confectionery and alcoholic drinks are outside the main food record; soft drinks were recorded separately and excluded from these main tables. The number of eggs retains the source's unit; no four-person scaling is applied."
assumptions = ["composite-family"]
audit = { file = "59-workbook-review/nfs-1984-observations.json", extractor = "json-pointer", locator = "/eggs/value", target = "quantity", guards = [{ locator = "/source_sha256", value = "b462e25868b77ba74e17eabeac4679837d5b0fe4382a977861886bbba04a72b2" }, { locator = "/year", value = "1984" }, { locator = "/table", value = "8" }, { locator = "/printed_page", value = "28" }, { locator = "/pdf_page", value = "40" }, { locator = "/column", value = "Consumption: Yearly average" }, { locator = "/population", value = "Private households in mainland Great Britain and Isle of Wight; excludes Scilly Isles and Scottish islands; one-week food diaries" }, { locator = "/definition", value = "Food entering the household, not amounts actually eaten" }, { locator = "/eggs/unit", value = "number per person per week" }, { locator = "/eggs/item", value = "Eggs" }, { locator = "/eggs/source_row", value = "EGGS (no) 3-30 3-22 3 25 307 3-21 310" }] }

