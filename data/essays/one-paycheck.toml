# Docent tour 1 — "One paycheck" (plan 016, WI-3)
# Every figure below is bound to a curated exhibit by {fact:<id>}; the
# numeral gate fails the build on any bare number in this prose.

[essay]
slug = "one-paycheck"
title = "One paycheck"
standfirst = "Put an average production wage beside median family income. The comparison is revealing, but it does not tell us how many earners a family needed."

[[block]]
kind = "prose"
text = '''
In 1950 median money income for four-person families was {fact:us-1950s-median-income-four-person} a year; the median for families of every size was {fact:us-1950s-median-income-all-families}. Manufacturing production workers had average hourly earnings of {fact:us-1950s-hourly-earnings-manufacturing} and an average working week of {fact:us-1950s-weekly-hours-manufacturing} hours. Multiplying those rounded averages gives {fact:us-1950s-weekly-earnings} a week.

These are different statistical populations. The wage is an average across workers; the family median includes money income from the family's earners and other sources. Neither describes a particular household's paycheck or expenses.
'''

[[block]]
kind = "chart"
metric = "single-earner-wage-coverage"

[[block]]
kind = "prose"
text = '''
The chart uses the published manufacturing weekly-earnings series, multiplied by fifty-two and divided by median all-family money income. That is a benchmark assuming a full year at the average weekly earnings, not observed annual earnings. Changes in the ratio can come from either the wage or the family-income denominator.

The 2024 room also contains {fact:us-2020s-weekly-earnings}, a separate calculation using total-private production and nonsupervisory workers' hourly earnings and weekly hours, beside median all-family income of {fact:us-2020s-median-income-all-families}. That broader-sector calculation is not the manufacturing series plotted above and should not be read as its endpoint.
'''

[[block]]
kind = "prose"
text = '''
Manufacturing production workers are not all workers, and average earnings are not median earnings. Median family income is not a measure of the cost of an ordinary life. This chart cannot establish whether one earner could support a family, or how common single-earner families were.
'''

[[block]]
kind = "prose"
text = '''
Another exhibit records married women's labor force participation: {fact:us-1950s-married-women-lfpr} in 1950 and {fact:us-2020s-married-women-lfpr} in 2021. The source cards specify their populations. Participation includes both people working and people seeking work; it does not count dual-earner families.

These exhibits place changes in earnings and participation alongside each other. They do not establish that a shortfall in one caused the other. The companion tour considers unpaid work, with its own population and measurement limits.
'''
