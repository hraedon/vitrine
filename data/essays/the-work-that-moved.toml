# Docent tour 2 — "The work that moved" (plan 016, WI-4)
# Every figure below is bound to a curated exhibit by {fact:<id>}; the
# numeral gate fails the build on any bare number in this prose.

[essay]
slug = "the-work-that-moved"
title = "The work that moved"
standfirst = "A reconstruction of unpaid work shows changing hours for women and men. Whose time is counted matters as much as the direction of the lines."

[[block]]
kind = "prose"
text = '''
The reconstruction estimates average weekly home-production time for prime-age women at {fact:us-1900s-home-production-women} hours in 1900 and {fact:us-1950s-home-production-women} in 1950. It combines historical studies with later time-use surveys. These are population averages across employed and nonemployed women, not the diary of a woman in a median-income household.
'''

[[block]]
kind = "chart"
group = "home-production-by-sex"

[[block]]
kind = "prose"
text = '''
The equipment exhibits offer a separate view: in 1950, {fact:us-1950s-electricity-diffusion} of households had electric light and {fact:us-1950s-refrigerator-diffusion} had mechanical refrigeration. These household adoption figures are not linked to the people in the time-use reconstruction. Putting them alongside the hours does not measure how much work an appliance saved.
'''

[[block]]
kind = "prose"
text = '''
By 1975 the women's estimate was {fact:us-1970s-home-production-women} hours per week. Read it beside the men's series, including the {fact:us-1950s-home-production-men:label} exhibit, on the same scale. The reconstruction describes a changing division of unpaid work. These averages do not show hours being transferred between the same spouses, or establish whether time went into paid work, leisure, or other activities.
'''

[[block]]
kind = "prose"
text = '''
After the two-thousands this chart stops. The later room exhibits use a narrower activity category and a different age population (see the {fact:us-2020s-home-production-splice:label} exhibit). Those observations remain available in the rooms, but they cannot continue this line unchanged. Its ending records a measurement boundary, not the disappearance of unpaid work.
'''
