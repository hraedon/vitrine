# Docent tour 2 — "The work that moved" (plan 016, WI-4)
# Every figure below is bound to a curated exhibit by {fact:<id>}; the
# numeral gate fails the build on any bare number in this prose.

[essay]
slug = "the-work-that-moved"
title = "The work that moved"
standfirst = "For most of the century the week's biggest job paid nothing at all. Then the hours fell — and the pay envelope, the appliances, and the second job moved to fill the space."

[[block]]
kind = "prose"
text = '''
In 1900 the prime-age woman of the median household worked {fact:us-1900s-home-production-women} a week in the home, unpaid. Here is the first surprise of the record: it barely moved for two-thirds of a century. The 1950 room still has her at {fact:us-1950s-home-production-women} — a decline so slow it looks like a law of nature.
'''

[[block]]
kind = "chart"
group = "home-production-by-sex"

[[block]]
kind = "prose"
text = '''
The machines had arrived long before the hours moved. By 1950, {fact:us-1950s-electricity-diffusion} of households had electric light and {fact:us-1950s-refrigerator-diffusion} had mechanical refrigeration. The equipped home and the working week coexisted for a full generation — the appliances were already ordinary while the routine around them was not yet different.
'''

[[block]]
kind = "prose"
text = '''
Then the cliff. By 1975 the figure was {fact:us-1970s-home-production-women} — the steepest decade on this chart. The {fact:us-1950s-home-production-men:label} line rises gently across the same decades, but nowhere near enough to absorb what moved. Where did the hours go? Partly into the paid second earner, partly into standards: the freezer kept, the laundry shrank, and the dividend was spent on a bigger, better-served house rather than on leisure.
'''

[[block]]
kind = "prose"
text = '''
One honesty note at the end of the line. After the two-thousands the museum stops the series on purpose: the survey concept changes there (see the room's {fact:us-2020s-home-production-splice:label} exhibit), and plotting the new narrower measure would fake a further fall. The gap drawn at the end of the chart is not missing data. It is the museum declining to publish a spliced number.
'''
