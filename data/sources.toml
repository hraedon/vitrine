notes = "The whole 1900-2023 span in one FHWA table, so the fatality-rate series needs no splice between estimate and registration eras. Four rate columns are published side by side (per 1,000 miles of road, per 100 million annual VMT, per 100,000 registered motor vehicles, per 100,000 licensed drivers); the museum takes the per-100-million-VMT column, and the extraction script recomputes it from the table's own fatality and VMT columns for every year rather than trusting its position. FHWA footnote (3) records a definitional change: beginning in 1976 the count includes only people who died within 30 days of the crash, so the earlier years are counted on a wider window and the two halves are not the same measurement. The 1900-1995 rows were cross-checked against FHWA's separately-published Highway Statistics Summary to 1995 (April 1997): 95 of 96 years reproduce exactly, the exception being 1995, that publication's terminal provisional year, since revised from 41,770 deaths to 41,817 (see docs/verification-log.md)."

