notes = "Transcribed from the nineteen per-year workbooks this page links (fatal-occupational-injuries-hours-based-rates-YYYY.xlsx, 2006-2024), Total row, 'Fatal injury rate' column. The workbooks' column layout changes three times across the span, so the extraction locates that column by header text; a fixed index silently reads total hours as the rate for 2017 and 2018. Values cross-checked against the data labels on the rate chart in the archived CFOI charts package (1992-2017): all twelve overlapping years reproduce exactly. Rate = (fatal work injuries / total hours worked) x 200,000,000, the base for 100,000 full-time equivalents. Two limits are structural, not archival: CFOI has covered all 50 states and DC only since 1992, so no federal census of workplace deaths exists before then; and BLS moved the rate from an employment basis to an hours basis in 2006, so earlier rates measure something else and are not chained here. NOTE ON THE LINK CHECK: bls.gov returns 403 to clients whose User-Agent carries no contact address, so CI reports this source as bot-blocked and its expect-markers are NOT verified there — they were verified locally on 2026-09-01 against the served page."

