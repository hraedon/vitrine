url = "https://fraser.stlouisfed.org/title/comparative-occupation-statistics-united-states-1870-1940-5896"
population = "Children 10 to 15 years old enumerated by the decennial census of the United States (continental United States; 1890 excludes Indian Territory and Indian reservations); the denominator is every child 10-15, not only those available for nonagricultural work"
notes = "The Census Bureau's own comparability-adjusted reconstruction of the decennial occupation statistics, published with its adjustment footnotes. The child-labor series transcribes the Total block of Table XVIII (printed p. 97): the share of children 10-15 engaged in gainful occupations at each census 1870-1930. Per the table's footnotes, the 1910 counts deduct an overcount (165,557 males and 202,942 females) that the 1910 volume itself flagged; the 1920 counts add an undercount (343,825 males and 12,001 females) and carry an estimated agricultural component (1,000,000 children assumed, 800,000 boys and 200,000 girls); 1900, 1890 and 1880 carry transfers of farm laborers classified as 'Laborers (not specified)' between agricultural and nonagricultural pursuits, which leave the all-occupations totals untouched; 1890 is exclusive of Indian Territory and Indian reservations (corrected figures per the 1900 Occupation Report, pp. lxvi-lxxii). The 1930 row is as enumerated, no adjustment. The monograph's chapter III ('The Gainful Worker Concept of 1930 and the Labor Force Concept of 1940') states the 1930 gainful-worker statistics are not exactly comparable with the 1940 labor-force statistics, so the series ends at 1930; the same chapter attributes the 1930-1940 decline in young workers' employment partly to the collapse of job opportunities, and no causal effect of any statute is estimated from timing. The FRASER record digitizes the volume; the archived scan (samples/49-child-labor/census-1940-comparative-occupation-statistics-ch2.pdf, sha256 pinned in the audit dump header) is the transcription document. The scan's OCR text layer is defective for most table cells; values were transcribed from page renders and closed against the table's own arithmetic — see scripts/census_child_labor_extract.py and the verification log, Plan 027 WI-8."

# ── Plan 027 WI-9: smoking restrictions (primary legal records) ──────────

[[source]]
id = "us-public-law-100-202-sec-328"
title = "Department of Transportation and Related Agencies Appropriations Act, 1988, § 328 (carried in Pub. L. 100-202)"
short_cite = "Pub. L. 100-202, § 328, 101 Stat. 1329-382"
publisher = "U.S. Government Publishing Office (Statutes at Large, vol. 101)"
year = 1987
url = "https://www.govinfo.gov/app/details/STATUTE-101"
population = "Scheduled airline flights in intrastate, interstate, or overseas air transportation scheduled for two hours or less (United States)"
notes = "§ 328 amends Federal Aviation Act § 404 (49 U.S.C. App. 1374) with subsection (d), 'Prohibition against smoking on scheduled flights and tampering with smoke alarm devices': (d)(1)(A) makes it unlawful to smoke in the passenger cabin or lavatory on any scheduled airline flight scheduled for 2 hours or less, on and after the expiration of the 4-month period following enactment (approved Dec. 22, 1987 — effective from April 1988); (d)(1)(C) repeals the ban effective on the expiration of the 28-month period following enactment — the first ban was temporary by its own terms; (d)(2) sets a civil penalty of up to $2,000 for tampering with lavatory smoke alarms. Printed at 101 Stat. 1329-382/383. govinfo presents this volume only as an SPA details page and a 17.5 MB volume XML, so no expect markers are set here; the volume's USLM XML carrying the provision is pinned in the samples archive (51-smoking-legal/STATUTE-101-uslm.xml, sha256 in samples/MANIFEST.md)."

[[source]]
id = "us-public-law-101-164-sec-335"
title = "§ 335, Pub. L. 101-164 (Department of Transportation and related agencies appropriations for fiscal year 1990)"
short_cite = "Pub. L. 101-164, § 335, 103 Stat. 1098-1099"
publisher = "U.S. Government Publishing Office (Statutes at Large, vol. 103)"
year = 1989
url = "https://www.govinfo.gov/app/details/STATUTE-103"
population = "Scheduled airline flight segments in air transportation or intrastate air transportation between or within the jurisdictions named in § 335's clauses (i)-(iii) (United States)"
notes = "§ 335, 'Permanent Prohibition Against Smoking on Scheduled Airline Flights', amends 49 U.S.C. App. 1374(d)(1)(A): after 'any scheduled airline flight' it substitutes 'segment in air transportation or intrastate air transportation, which is— (i) between any two points within Puerto Rico, the United States Virgin Islands, the District of Columbia, or any State of the United States (other than Alaska and Hawaii) ...; (ii) within the State of Alaska or within the State of Hawaii; or (iii) scheduled for 6 hours or less in duration, and between any point described in clause (i) and any point in Alaska or Hawaii, or between any point in Alaska and any point in Hawaii', and strikes subparagraph (C) — the 28-month sunset the 1987 ban carried. By its terms it takes effect upon the commencement of the 96th day following enactment (approved Nov. 21, 1989; Feb. 25, 1990). Segments of more than six hours between the contiguous states and Alaska or Hawaii fall outside clauses (i)-(iii). DOT's implementing interim final rule is 55 FR 4991 (Feb. 13, 1990), which also codified the single-entity-charter blanket waiver applied since 1982. Printed at 103 Stat. 1098-1099. govinfo serves this volume as an SPA details page, so no expect markers are set; the volume's USLM XML carrying the provision is pinned in the samples archive (51-smoking-legal/STATUTE-103-uslm.xml)."

[[source]]
id = "dot-ost-2000-smoking-aboard-aircraft"
title = "Smoking Aboard Aircraft (final rule, Docket No. DOT-OST-2000-7473)"
short_cite = "DOT OST final rule, 65 FR 36772 (June 9, 2000)"
publisher = "U.S. Department of Transportation, Office of the Secretary (Federal Register)"
year = 2000
url = "https://www.govinfo.gov/content/pkg/FR-2000-06-09/html/00-14480.htm"
expect = ["55 FR 4991", "unlawful to smoke in the passenger cabin", "single-entity charters"]
population = "Scheduled passenger flights of U.S. air carriers and foreign air carriers in interstate, intrastate, and foreign air transportation"
notes = "Implements § 708 of Pub. L. 106-181 (Wendell H. Ford Aviation Investment and Reform Act for the 21st Century, approved Apr. 5, 2000), which recodified the smoking prohibition at 49 U.S.C. 41706: subsection (a) prohibits smoking in scheduled passenger interstate and intrastate air transportation with no duration limit, subsection (b) extends the prohibition to scheduled passenger foreign air transportation, subsection (c) directs the Secretary to waive (b) for a foreign carrier when its government objects on extraterritoriality grounds and an alternative prohibition negotiated under (c)(2) takes effect — effective 60 days after enactment (June 4, 2000). The rule's background recites CAB ER-800 (38 FR 12207, May 10, 1973), the first federal smoking rule, which 'required the separation of smoking passengers from no-smoking passengers'; quotes the Pub. L. 101-164 § 335 scope verbatim; cites the Feb. 13, 1990 interim final rule (55 FR 4991) and the single-entity-charter blanket waiver in effect since 1982. The companion FAA rule (65 FR 36776) states that the former Department provisions allowing smoking on flights over 6 hours in duration are superseded by the new legislation. Both rules are pinned in the samples archive (51-smoking-legal/)."

[[source]]
id = "california-labor-code-6404-5"
title = "California Labor Code § 6404.5 (added by AB 13, Chapter 310, Statutes of 1994)"
short_cite = "Cal. Lab. Code § 6404.5 (Stats. 1994, ch. 310)"
publisher = "California Legislative Counsel (chaptered bill text, archived by the Wayback Machine)"
year = 1994
url = "https://web.archive.org/web/20090809204601id_/http://www.leginfo.ca.gov/pub/93-94/bill/asm/ab_0001-0050/ab_13_bill_940721_chaptered"
expect = ["Section 6404.5 is added to the Labor Code", "bars and taverns", "January 1, 1997"]
population = "Enclosed spaces at places of employment in California; employer and employee conduct within the meaning of § 6404.5(b)-(f)"
notes = "AB 13 (T. Friedman), approved July 21, 1994, adds Labor Code § 6404.5. Subdivision (b): 'No employer shall knowingly or intentionally permit, and no person shall engage in, the smoking of tobacco products in an enclosed space at a place of employment.' Subdivision (a) declares a uniform statewide standard; subdivision (d) excepts from 'place of employment', among others, 65 percent of hotel and motel guest rooms and designated lobby areas, meeting and banquet rooms outside food or beverage functions, retail or wholesale tobacco shops and private smokers' lounges, truck cabs where no nonsmoking employee is present, warehouses over 100,000 square feet with twenty or fewer full-time employees, gaming clubs, bars and taverns (permitted by subdivision (f) until the earlier of January 1, 1997 or an adopted ETS exposure regulation), theatrical production sites, medical research or treatment sites, private residences (family day care hours excepted), patient smoking areas in long-term health care facilities, and employer smoking breakrooms exhausted directly to the outside. SEC. 2 defers the operative date to the act's constitutional effective date (the California Constitution's January 1 rule; the section operated statewide from January 1, 1995). The old leginfo.ca.gov host is retired and leginfo.legislature.ca.gov 403s scripted clients, so the archived official chaptered text is the citation; the section's later amendment history (including the bar/tavern extension) is visible in the archived official section display pinned in the samples archive (51-smoking-legal/)."

