# The assumption ledger: every methodological choice that would mislead if
# left implicit, written once, referenced by every fact it touches.
# The `composite-family` entry is special: it renders on every room page.

[[assumption]]
id = "composite-family"
title = "The composite family"
statement = "Each room is a statistical composite, assembled from separate distributions with separate sources. The family at the median income did not also have the median house, the median car, and the median diet. No single family described here ever existed; each fact tells you, in its provenance drawer, which real population it was measured from."

[[assumption]]
id = "four-person-normalization"
title = "Getting to a family of four"
statement = "Most sources publish medians for all families or all households, not for four-person families. Where a by-size series exists (e.g. US Census Historical Income Tables, Table F-8) it is used directly; otherwise the all-family median is shown and labeled as such, or equivalized using the OECD-modified scale with the arithmetic shown. The fact's label always states which population the number describes."

[[assumption]]
id = "income-vs-consumption"
title = "Income vs consumption"
statement = "Some countries and eras measure household consumption, not income (India's National Sample Survey; the pre-1940 US cost-of-living surveys). Rooms built on consumption data say so; consumption and income medians are never mixed in one comparison without a note."

[[assumption]]
id = "nominal-values"
title = "Values are shown in period money"
statement = "Values display in nominal, contemporaneous local units — what the family actually saw. Any inflation adjustment is computed by code in this repository with the price index series named, never applied by hand in the data files."

[[assumption]]
id = "shortage-economy"
title = "Shortage economies"
statement = "In rationed or shortage economies (the USSR, PRL-era Poland), money income overstates lifestyle: the binding constraint was availability, not price. Rooms for these eras pair income facts with availability facts (rationing, queue time, waiting lists) so the income number cannot be read as if it bought a Western basket."

[[assumption]]
id = "urban-rural-split"
title = "Urban/rural splits"
statement = "Where the urban/rural divide dominates the distribution (China, India), a single national median is misleading; rooms carry separate urban and rural facts instead of a blended number. Early US sources have the opposite bias: the 1890s-1930s surveys measured urban wage-earner families specifically, and their facts are tiered and labeled accordingly."

[[assumption]]
id = "metropolitan-definition"
title = "Metropolitan geography and unresolved income estimates"
statement = "The recovered extract 00001 DDI defines METRO as nonmetropolitan (1), indeterminable (2), metropolitan outside principal city (3), metropolitan principal-city status indeterminate (4), and metropolitan in principal city (5). A 3+4 selection does not represent all metropolitan households, and unknown central-city status is not evidence of suburban location. Availability and comparability vary by census/sample. The 1950 locale family-income medians are withdrawn until a valid family unit, income construction, universe, missing-value treatment and weights are specified and reproduced from an authorized extract. Do not infer total family income by summing sample-line personal income observations."

[[assumption]]
id = "affordability-normalization"
title = "The affordability axis"
statement = "\"Hours to afford\" = item price ÷ that decade's representative hourly wage. \"% of income\" = item price ÷ median annual family income. Both are computed by repo code (affordability.py), never hand-authored in data files. The named wage and income anchors are shown in each fact's provenance drawer so the visitor can see which population the denominator was drawn from."

[[assumption]]
id = "hours-vs-income-denominator"
title = "Why hours, not budget share"
statement = "The affordability axis divides a period price by the room's stated wage anchor. It measures hours at that average or proxy wage, not hours for a known median worker. Using nominal prices and wages from the same period avoids an inflation conversion but does not remove differences in populations, products or years. The income axis is a share of annual income, not a budget share. A budget share requires a compatible expenditure denominator; where one is unavailable the museum does not substitute income and call it a budget."

[[assumption]]
id = "wage-anchor-consistency"
title = "The wage anchor changes across the span"
statement = "Wage anchors are averages or historical wage proxies, not a continuous median-worker series. Early rooms use historical reconstructions; the 1947, 1960 and 1970 anchors use the published total-private production/nonsupervisory predecessor series, while the 1950 anchor is manufacturing-only. From 1980 the room anchors use total-private production/nonsupervisory earnings. Read each room source and year: manufacturing and total-private observations cannot be treated as one population, and a change in source or tier is not a measured change in worker composition."

[[assumption]]
id = "dwelling-size-metric"
title = "Rooms, not square feet"
statement = "The durable cross-decade dwelling-size axis is number of rooms (Census of Housing 1940→, IPUMS, and the pre-1940 cost-of-living surveys all recorded it). Square footage exists only for new construction from 1973 (Census SOC / Characteristics of New Housing) and for existing stock from roughly 1985 (AHS unit square footage). The home panel uses rooms as the comparable size metric across the whole span and shows square footage only where the record has it — never back-filled."

[[assumption]]
id = "manufacturing-wage-proxy"
title = "Manufacturing wages as the early-era worker proxy"
statement = "Before 1964 no broad, all-sector hourly earnings series exists. The wage anchor for 1900s–1930s (and the manufacturing series 1939–1963) is average hourly earnings of manufacturing production workers — a population that skews urban, industrial, and male. It stands in for 'the worker' where no broader series exists, the same proxy the 1950s room already uses. Cross-decade comparisons that chain manufacturing wages to total-private earnings (1964→) carry the weaker tier and flag the splice; the source's verbatim population string rides in the anchor note so the visitor sees who was actually measured."

[[assumption]]
id = "cpi-inflation-of-base-price"
title = "CPI inflation of a base-year price"
statement = "When a price series ends before the room's data year, the latest base price is inflated to the current year using the CPI for that item (e.g. new-vehicles CPI for a car). The computation is code (base × CPI_target / CPI_base), not a hand-quoted number; the result is an estimate, not a transcription, and carries the weakest input tier. The item-specific CPI (not the all-items CPI) is used so the inflation reflects the item's actual price change, not general inflation."

[[assumption]]
id = "jp-household-not-family"
title = "Japanese surveys measure households, not four-person families"
statement = "Japan's Family Income and Expenditure Survey (FIES) publishes by household type (two-or-more-person, one-person) and by household composition, not by a 'four-person family' median. The four-person-normalization assumption applies: where a by-household-size table exists, a four-person figure may be derivable, but it is not as cleanly published as the US Census F-8 table. All Japan room facts measure households and carry the composite-family disclaimer."

[[assumption]]
id = "jp-kakei-1962-seam"
title = "FIES was urban-only before 1962"
statement = "The archived early FIES income table covers workers' households in all cities. The later tables extend geographical coverage nationally from 1963 but explicitly exclude agricultural, forestry and fisheries households throughout their 1963–2017 span. National geographical coverage does not mean every household type is represented. Pre-1962 income facts retain the urban-rural-split caveat; chaining across the geographical seam must preserve the population difference."

[[assumption]]
id = "jp-deflation-lost-decades"
title = "Japan's lost decades: nominal stagnation amid real gains"
statement = "From the 1990s onward Japan experienced persistent deflation: nominal wages and prices stagnated or declined while real (CPI-adjusted) values rose. This is the opposite of the US/UK inflation pattern. Cross-decade comparisons of nominal values understated real change; the affordability axis (hours-to-afford) is inflation-free and therefore the more reliable comparator for Japan's post-1990 decades."

[[assumption]]
id = "uk-household-not-family"
title = "UK income statistics measure households by type, not a four-person family"
statement = "The UK has no published counterpart to the US Census four-person-family income median. The closest is the ONS 'Effects of taxes and benefits' series, which reports averages by household type; the museum's UK income anchor is its non-retired 'two adults with two children' household. Three consequences ride with it and are stated on every fact that uses it: it is a mean, not a median; the two adults are not necessarily the children's parents; and it is disposable income — after cash benefits and direct tax — where the US rooms' anchor is gross money income. The two are therefore not the same measure and the comparator will not chain them (see the Measure enum in model.py). The four-person-normalization and composite-family assumptions apply as they do elsewhere."

[[assumption]]
id = "uk-wage-anchor-all-employees"
title = "The UK wage anchor is the median over all employee jobs"
statement = "The UK hourly-wage anchor is ASHE's median gross hourly pay across all employee jobs, full- and part-time, both sexes. It is not a full-time-only median, a wage offered to people outside sampled jobs, or a household income. Full-time figures cited as context retain their own source population. The US anchor is a mean for a different worker population; the two are different measures and are not chained."

[[assumption]]
id = "produce-variety-rule"
title = "The produce-variety count and its published one-pound threshold"
statement = "For the stated source year, count the selected fresh commodity series whose published per-person farm-weight availability estimate is at least one pound, at the precision printed in that source cell. The inclusive threshold is applied by the existing build calculation to source-formatted estimates, not to hidden cached digits. Near-threshold estimates can round to one pound; this count does not establish an unrounded minimum physical supply. The candidate series are enumerated explicitly. A series outside its selected year window contributes to neither the count nor the displayed tracked total; those windows are curation choices rather than proof of publisher absence. Source years can follow commodity-specific marketing periods, and population reference dates differ. This is a count over the selected source estimates, not market assortment, a diet, or a matched household. Availability includes resident population and Armed Forces overseas and is not intake."

[[assumption]]
id = "food-price-display-rounding"
title = "Average food prices display at the nearest cent"
statement = "The selected BLS APU compound placards retain original December API observations in the research archive. scripts/food_price_review.py uses exact decimal half-up rounding to two decimal places for display in dollars. Values are price levels for the stated month, not a fixed-quality inflation index or a family food budget; item identities and original package units remain explicit."

[[assumption]]
id = "jp-fies-food-share"
title = "FIES food shares use same-row expenditure operands"
statement = "Food shares divide the archived FIES Food expenditure by total Consumption expenditures in the same annual-average row and household population, multiply by one hundred, and round once to one decimal place using decimal half-up rounding. The audit stores the raw source operands and replays the operation. The source tables exclude agricultural, forestry and fisheries households; income observations use a different workers-household population."

[[assumption]]
id = "cex-ratios-of-means"
title = "CEX budget shares are ratios of published means"
statement = "The selected compound food records divide the published food-expenditure mean by the published total-expenditure mean for the same four-person consumer-unit population and year, multiply by one hundred and round once to one decimal place, half up. This is not the mean of individual units' budget shares. Independently rounded published components may not add to totals; missing cells are not reconstructed by subtraction."

[[assumption]]
id = "cms-nhe-shares"
title = "Shares of national health expenditure totals"
statement = "Companion shares divide an aggregate service/funding amount by total national health expenditures for the same source year and multiply by one hundred, rounded once to one decimal place, half up. These are shares of national spending, not average household budget shares. The pinned CMS source files and compound qualifier retain all operands. Publisher dashes are not converted to zero."

[[assumption]]
id = "ers-availability-source-formulas"
title = "ERS supply formulas and displayed precision"
statement = "Farm-weight per-capita availability replays the selected publisher workbook formulas from literal supply/use and population inputs, checks the cached result, and rounds once to the publisher cell format: one decimal for the selected fruit sheets and two for vegetables. The source numerator and denominator both use millions, so their ratio is pounds per person. Excel SUM ignores the source text NA only where that exact source formula uses SUM; NA is never generally imputed as zero. Population includes Armed Forces overseas, and fruit marketing-year definitions differ by commodity and period. This is food availability, not food eaten, and the retail-weight factor is not applied."

[[assumption]]
id = "census-housing-source-count-shares"
title = "Census housing percentages from reporting-unit counts"
statement = "Calculate the share as 100 times the published category count divided by the published reporting-unit count; round once to one decimal using half-up rounding. The 1940 private-bath/private-toilet definition differs from later complete plumbing definitions."

[[assumption]]
id = "housing-median-income-ratio"
title = "Comparing housing value and annual family income"
statement = "Divide the published median value of specified owner-occupied homes by the published median annual family income, and round the ratio once to two decimal places. The medians come from different populations; the 1940 home value is compared with 1947 family income."

[[assumption]]
id = "recent-published-count-share"
title = "Recent published count share"
statement = "Divide specified source counts or survey-weight sums by the stated source population, multiply by 100, and round once using decimal half-up to the displayed precision. Each derived value must name its operands and source vintage."

[[assumption]]
id = "recent-vehicle-complement"
title = "Recent vehicle complement"
statement = "Subtract the published no-vehicle percentage from 100 to express the corresponding percentage with at least one vehicle; both measures retain the published precision and occupied-unit population."

[[assumption]]
id = "source-rate-cent-rounding"
title = "Explicit cent rounding for a subcent wage anchor"
statement = "The displayed 1947 BLS hourly rate retains its source precision of three decimals. The integer-minor-unit affordability anchor is rounded once to cents, half up, by an audit round operation, then scaled to cents. This explicitly describes the existing storage approximation, not a changed observation or a replacement for precise annual monetary-rate series. Wage ratios using the anchor inherit it."

[[assumption]]
id = "imls-state-reference-sum"
title = "Imls state reference sum"
statement = "Sum FY2020 Public Libraries Survey state-summary reference-transaction totals for the 50 states and District of Columbia, including flagged imputed values, then divide by one million and round once to one decimal using half-up."

[[assumption]]
id = "ipums-1950-primary-family-median"
title = "Primary-family income from the 1950 sample"
statement = "A distinct 1949-income estimate from the 1950 1% sample. Select a unique household head (RELATE=1), FAMUNIT=1, head FAMSIZE=4 and exactly four primary-unit person records, in GQ=1 households. Use positive SLWT and valid FTOTINC, not summed personal incomes or HHWT. The median is the smallest coded income whose cumulative weight reaches half; no interpolation. FTOTINC uses income-category midpoints and excludes income below age fourteen; its primary-family universe differs from all CPS families. The net-loss code is categorical, missing codes are excluded, and the upper category is top-coded. METRO 3, 4 and 5 form metro, 1 is nonmetro; 2 is excluded. Only code 3 identifies residence outside the central city; it cannot represent every suburban family. These observations are separate from the room’s 1950 CPS income anchor. The project requires thirty records per released median; rare ancillary diagnostics receive complementary suppression, which is a project release choice, not an asserted IPUMS rule."
