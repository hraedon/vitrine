# US, the 1910s. Primary sources: Census historical homeownership, Historical
# Statistics Vol 1 (life expectancy, manufacturing wages). No income survey
# exists (CPS/F-8 begins 1947). No Census of Housing until 1940.
# Data year anchors: 1910 (Census), 1909-11 (life expectancy).

[room]
country = "us"
decade = "1910s"
wage_anchor = "us-1910s-manufacturing-wages"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-1910s-income-gap"
panel = "budget"
label = "Median family income, 1910s"
value = "no reliable record accessible online"
unit = "n/a"
source = "census-hist-income-families"
tier = "D"
notes = "A suitable decade-specific national median family income has not been verified for this room."

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "us-1910s-homeownership"
quantity = 45.9
panel = "home"
label = "Homeownership rate, 1910"
value = "45.9%"
unit = "% of occupied dwelling units (owner-occupied)"
source = "census-homeownership-historical"
tier = "A"
notes = "The Census historical homeownership series reports 45.9% of occupied housing units owner-occupied in 1910."
assumptions = ["composite-family"]

[[fact]]
id = "us-1910s-housing-gap"
panel = "home"
label = "Home value, rooms, plumbing, electricity"
value = "no reliable record accessible online"
unit = "n/a"
source = "census-decennial-pubs"
tier = "D"
notes = "Suitable decade-specific measures of rooms, plumbing, and heating have not been transcribed for this room."

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "us-1910s-life-expectancy"
panel = "day"
label = "Life expectancy at birth, 1909-11"
value = "50.2 male, 53.6 female (white)"
unit = "years"
source = "hist-stats-life-expectancy-white"
tier = "A"
notes = "Period life expectancy at birth for the white population, by sex, 1909–11. Coverage: the 1900 death-registration area: 20 states and the District of Columbia."

[[fact]]
id = "us-1910s-manufacturing-wages"
panel = "day"
label = "Manufacturing wages and hours, 1910"
value = "$0.260/hr, 56.6 hours/week"
unit = "USD per hour and hours per week, nominal earnings"
source = "hist-stats-manufacturing-d765-d766"
tier = "D"
amount_minor = 26
currency = "USD"
price_year = 1910
basis = "hourly"
notes = "Historical Statistics Series D 765–766 republishes a historical reconstruction for total manufacturing industries from Paul H. Douglas, Real Wages in the United States, 1890–1926. It combines union scales with payroll-industry estimates. The compiler warns that the weighting makes the total average too high. The payroll component through 1913 uses selected occupations, omits most laborers and some other unskilled workers, and is extrapolated backward from 1914. It is not a complete observation of all manufacturing workers. "
assumptions = ["nominal-values", "manufacturing-wage-proxy"]

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "us-1910s-telephone"
panel = "diffusion"
label = "Telephone diffusion, 1910s"
value = "103.9 per 1,000 population (1915)"
unit = "telephones per 1,000 population"
source = "hist-stats-telephones-r1-r3"
tier = "A"
quantity = 103.9
audit = { file = "remaining-audit-20261028/early_us-telephone-extract.json", extractor = "json-pointer", locator = "/rows/1915/per_1000_population", target = "quantity", guards = [{ locator = "/source_sha256", value = "0e209a421af0cf48af7261f6fbd7a599c27a0afce5b7523f2bc89a7d18647fa5" }, { locator = "/series", value = "R 1–12" }, { locator = "/population", value = "Telephone instruments and extensions per total population" }] }
notes = "Historical Statistics Series R 2, 1915. Telephones are instruments and extensions per 1,000 people, including business instruments; through 1930 the count also includes telegraph and teletypewriter stations, and through 1934 private-line telephones."

[[fact]]
id = "us-1910s-electricity-gap"
panel = "diffusion"
label = "Electricity, radio, automobile"
value = "no reliable record"
unit = "n/a"
source = "hist-stats-colonial-1970"
tier = "C"
notes = "A comparable household electricity, radio or automobile ownership estimate has not been verified for this room."

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "us-1910s-food-basket-gap"
panel = "table"
label = "The food basket, 1910s"
value = "no reliable record accessible online"
unit = "n/a"
source = "bls-bulletin-49-1903"
tier = "D"
notes = "A suitable food basket for this decade remains untranscribed; the 1918–19 survey is available for further review."

[[fact]]
id = "us-1910s-cigarette-consumption"
quantity = 151
panel = "table"
label = "Adult per capita cigarette consumption, 1910"
value = "151 cigarettes per adult per year"
unit = "cigarettes per adult (≥18 years) per year"
price_year = 1910
source = "cdc-mmwr-tobacco-surveillance"
tier = "A"
notes = "Estimated manufactured cigarette consumption per person aged 18 or older, from CDC MMWR Table 1. Total and per-capita measures have different overseas-military coverage in some years. The numerator is total manufactured-cigarette consumption; dividing by the population aged eighteen and older does not restrict the numerator to cigarettes smoked by adults."
assumptions = ["composite-family"]

[[fact]]
id = "us-1910s-ethanol-per-capita"
quantity = 2.56
panel = "table"
label = "Alcohol consumed per person, 1911-1915"
value = "2.56 gallons of pure ethanol per person per year (1911-1915 average)"
unit = "gallons of pure ethanol per person per year"
source = "niaaa-surveillance-122"
tier = "A"
notes = "NIAAA Table 1 reports apparent ethanol consumption for 1911–1915. The pre-1970 denominator is people aged 15 and older; the estimate is not limited to drinkers."
assumptions = ["composite-family"]

[[fact]]
id = "us-1910s-traffic-death-rate"
quantity = 44.66
panel = "day"
label = "Road deaths per 100 million vehicle-miles, 1910"
value = "44.66 deaths per 100 million vehicle-miles travelled"
unit = "deaths per 100 million vehicle-miles travelled"
price_year = 1910
source = "fhwa-fi200-2023"
tier = "A"
notes = "FHWA FI-200 reports motor-vehicle traffic fatalities per 100 million vehicle-miles in 1910. The table is a historical series and its earlier estimates have limitations."
assumptions = ["composite-family"]

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "us-1910s-work-buys-gap"
panel = "work-buys"
label = "Share-of-family-income comparison, 1910s"
value = "no reliable record accessible online"
unit = "n/a"
source = "hist-stats-colonial-1970"
tier = "D"
notes = "A suitable decade-specific median family income has not been verified for a share-of-income comparison."

[[fact]]
id = "us-1910s-car-price"
panel = "work-buys"
label = "Passenger-car factory sales, 1910"
value = "181,000 passenger cars; wholesale value $215 million"
unit = "factory sales and wholesale value, nominal"
source = "hist-stats-auto-factory-q148"
tier = "A"
notes = "Historical Statistics Series Q 148–149 reports passenger cars sold by factories and their wholesale value in 1910; the figures are not retail prices."
assumptions = ["nominal-values"]


# ── Home production hours (Ramey 2009) ─────────────────────────────────────
# Plan 005 WI-2: women's + men's weekly unpaid home-production hours.
# Source: Ramey (2009), Table 6A (women) & Table 7 (men), "All Prime-Age" cols.
# Population: ages 18–64, weighted by employment-population ratio.
# Tier C: reconstruction from period time-diary studies linked to modern surveys.
# Note: actor/hours_kind fields pending Plan 005 WI-1 model changes.

[[fact]]
id = "us-1910s-home-production-women"
quantity = 45.6
panel = "day"
label = "Women's weekly unpaid home-production hours, 1910"
value = "45.6"
unit = "hours per week, prime-age women (ages 18–64)"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 6 estimates average weekly home-production hours for all women aged 18–64 in 1910. Some estimates are partly extrapolated."
assumptions = ["composite-family"]

[[fact]]
id = "us-1910s-home-production-men"
quantity = 4
panel = "day"
label = "Men's weekly unpaid home-production hours, 1910"
value = "4.0"
unit = "hours per week, prime-age men (ages 18–64)"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 7 estimates average weekly home-production hours for all men aged 18–64 in 1910. Some estimates are partly extrapolated."
assumptions = ["composite-family"]

# ── Married women's labor force participation ─────────────────────────────

[[fact]]
id = "us-1910s-married-women-lfpr"
quantity = 10.7
panel = "day"
label = "Married women in the labor force"
value = "~10.7%"
unit = "% of married women aged 15 and older"
source = "hist-stats-married-women-lfpr-early"
tier = "A"
notes = "Historical Statistics Series D 60 reports married women total in the civilian labor force as a percentage of married women aged 15 and older. The 1910 census used different enumeration instructions and is not directly comparable to the other censuses."
assumptions = ["composite-family"]

# ── Median age at first marriage ──────────────────────────────────────────

[[fact]]
id = "us-1910s-median-age-first-marriage"
quantity = 25.1
panel = "day"
label = "Median age at first marriage, 1910"
value = "Men: 25.1, Women: 21.6"
unit = "years (median age at first marriage)"
source = "census-table-ms2"
tier = "A"
notes = "Estimated median age at first marriage, separately for men and women, from Census Table MS-2. The table identifies the historical figures as decennial-census estimates."

# ── Price components: what eating, shelter and clothing cost ───────────────
# BLS has published food, rent and apparel indexes continuously since 1913.
# These are price indexes, not a household basket: they show how the cost of
# each moved, never what the family bought. The food-basket gap above stands.

[[fact]]
id = "us-1910s-food-price-index"
quantity = 18.6
panel = "table"
label = "Food prices, 1919 (index, 1982-84=100)"
value = "18.6 in 1919, up from 10.0 in 1913"
unit = "CPI-U food index (1982-84=100), annual average"
source = "bls-api"
tier = "A"
audit = { file = "remaining-audit-20261028/early_us-cpi-annual-extract.json", extractor = "json-pointer", locator = "/values/CUUR0000SAF1/1919", target = "quantity", guards = [{ locator = "/values/CUUR0000SAF1/1913", value = "10.0" }, { locator = "/period", value = "M13" }, { locator = "/population", value = "CPI-U U.S. city average" }, { locator = "/seasonality", value = "Not Seasonally Adjusted" }, { locator = "/original_sha256/bls-cpi-annual-1913-1929.json", value = "68290db70bebfdc3d071602f8d2d4c947aa6377e9ef3a310fedd1e1fbc597715" }, { locator = "/original_sha256/bls-cpi-annual-1930-1939.json", value = "fd3f869ca3b15fc26d236d4830065a4defed004fb6c049abb56af094eb2ba8a7" }] }
notes = "BLS CUUR0000SAF1 annual averages for food in the U.S. city average. The index measures price change, not household expenditure or affordability."
assumptions = ["composite-family"]

