id = "us-1910s-rent-index"
quantity = 23.3
panel = "home"
label = "Rent, 1919 (index, 1982-84=100)"
value = "23.3 in 1919, up from 21.0 in 1913"
unit = "CPI-U rent-of-primary-residence index (1982-84=100), annual average"
source = "bls-api"
tier = "A"
audit = { file = "remaining-audit-20261028/early_us-cpi-annual-extract.json", extractor = "json-pointer", locator = "/values/CUUR0000SEHA/1919", target = "quantity", guards = [{ locator = "/values/CUUR0000SEHA/1913", value = "21.0" }, { locator = "/period", value = "M13" }, { locator = "/population", value = "CPI-U U.S. city average" }, { locator = "/seasonality", value = "Not Seasonally Adjusted" }, { locator = "/original_sha256/bls-cpi-annual-1913-1929.json", value = "68290db70bebfdc3d071602f8d2d4c947aa6377e9ef3a310fedd1e1fbc597715" }, { locator = "/original_sha256/bls-cpi-annual-1930-1939.json", value = "fd3f869ca3b15fc26d236d4830065a4defed004fb6c049abb56af094eb2ba8a7" }] }
notes = "BLS CUUR0000SEHA annual averages for rent of primary residence in the U.S. city average. The index measures price change, not household expenditure or affordability."
