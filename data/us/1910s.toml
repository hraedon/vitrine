# ── Plan 027 WI-8: children and work ──────────────────────────────────────

[[fact]]
id = "us-1910s-child-labor-share"
quantity = 15.0
panel = "day"
label = "Children 10-15 gainfully occupied, 1910"
value = "15.0% of children 10-15 were gainfully occupied"
unit = "percent of children 10-15 years old gainfully occupied"
price_year = 1910
source = "census-1943-comparative-occupations"
tier = "A"
notes = "Census Table XVIII, Total block, 1910 row — the adjusted count. The raw 1910 enumeration printed 1,990,225 child workers (Vol IV, Table 28, printed p. 70); the monograph deducts 368,499 (165,557 males, 202,942 females) for an overcount that the 1910 volume itself flagged, its footnote citing a possible excess among children reported in agricultural pursuits. The adjusted cells reconcile exactly against the raw counts, by sex as well as in total."
assumptions = ["composite-family"]
[fact.audit]
file = "49-child-labor/census-1943-ch2-p97.txt"
extractor = "text-regex"
target = "quantity"
locator = '^1910 10828365 1621726 (15\.0) \S+ \S+ \S+ \S+$'
guards = [
    { locator = '^# source pdf sha256: ([0-9a-f]{64})$', value = "41d578b768f6b2a72c0697aa2af85b110653e719885141c8ef8fe40b2a59efb2" },
    { locator = '^(# page: printed 97 \(chapter XI\), block Total)$', value = "# page: printed 97 (chapter XI), block Total" },
]

[[fact]]
id = "us-1910s-mail-pieces-handled"
quantity = 14850
panel = "table"
label = "Pieces of mail handled, 1910"
value = "14,850 million pieces of mail were handled in fiscal 1910 — about 14.9 billion"
unit = "pieces of mail handled, millions per fiscal year"
price_year = 1910
source = "us-postal-mail-volume"
tier = "A"
notes = "The volume roughly doubled across the first decade of the century (7.1 to 14.9 billion, both pre-1930 estimates by the source's own flag). The archived editions print no pieces figure at all for 1915 or 1920 — dashes and (NA) — so those years are absent from the arc, not zero."
assumptions = ["composite-family"]
[fact.audit]
file = "54-mail/mail-pieces-dump.txt"
extractor = "text-regex"
target = "quantity"
locator = '^1910 (14850) sa1960-no654'
guards = [
    { locator = '^# source zip sa1960 sha256: ([0-9a-f]{64})$', value = "deee4a1189272ea442247024c6517647f26eef664c7ccb454e4542b37bec5109" },
]
