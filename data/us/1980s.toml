notes = "From Census F-8. Down from 3.57 in 1970. By 1990: 3.18."

[[fact]]
id = "us-1980s-expenditure-shares"
audit = { file = "59-workbook-review/cex-food-observations.json", extractor = "json-pointer", locator = "/1985/values/housing", target = "quantity", guards = [{ locator = "/1985/year", value = "1985" }, { locator = "/1985/source_sha256", value = "5d5375b8b207572d9fa5caded4a6ebaad9e0c2b966dcb7bad9534d70143fb82c" }, { locator = "/1985/file", value = "02-cex/cusize-1985.pdf" }, { locator = "/1985/population", value = "Four-person consumer units" }, { locator = "/1985/statistic", value = "Annual expenditure means" }, { locator = "/1985/source_header", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics,\nConsumer Expenditure Survey, 1985\nItem\nAll\nconsumer\nunits\nOne\nperson\nTwo\npersons\nThree\npersons\nFour\npersons\nFive\npersons\nSix or\nmore\npersons\nSee footnotes at end of table.     1" }, { locator = "/1985/budget_placard", value = "Housing 29.5%, transportation 20.6%, food 15.0%, insurance/pensions 9.8%, entertainment 5.3%, healthcare 4.1%, apparel 6.0%, cash contributions 2.6%, education 1.5%" }], calculation = { op = "pct_of", operands = ["/1985/values/total"], precision = 1, rounding = "half_up", method = "Housing mean divided by total annual expenditure mean for four-person consumer units; times one hundred, rounded once half up to one decimal place. Companion category shares are reproduced by the same source extractor and full-value guard." } }
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 1985"
quantity = 29.5
value = "Housing 29.5%, transportation 20.6%, food 15.0%, insurance/pensions 9.8%, entertainment 5.3%, healthcare 4.1%, apparel 6.0%, cash contributions 2.6%, education 1.5%"
unit = "% of total annual expenditure"
source = "bls-cex-four-person-1985"
tier = "A"
notes = "Ratios of published annual category expenditure means to the total-expenditure mean for four-person consumer units, rounded once half up to one decimal place by scripts/cex_food_review.py. These are not published individual budget distributions or the mean of unit-level budget shares. The archived table provides expenditure means; the audit checks the housing ratio and the full reproduced category-share string."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values", "cex-ratios-of-means"]

[[fact]]
id = "us-1980s-poverty-rate"
audit = { file = "remaining-audit-20261028/census-poverty-1980.json", extractor = "json-pointer", locator = "/1/1", target = "quantity", guards = [{ locator = "/0/0", value = "NAME" }, { locator = "/0/1", value = "PCTPOV" }, { locator = "/0/2", value = "POV" }, { locator = "/0/3", value = "POP" }, { locator = "/0/4", value = "PCTFAMPOV" }, { locator = "/0/5", value = "FAMPOV" }, { locator = "/0/6", value = "FAM" }, { locator = "/0/7", value = "YEAR" }, { locator = "/0/8", value = "RACE" }, { locator = "/0/9", value = "RACE" }, { locator = "/0/10", value = "time" }, { locator = "/0/11", value = "us" }, { locator = "/1/0", value = "United States" }, { locator = "/1/7", value = "1980" }, { locator = "/1/8", value = "1" }, { locator = "/1/9", value = "1" }, { locator = "/1/10", value = "1980" }, { locator = "/1/11", value = "1" }, { locator = "/1/2", value = "29270000" }] }
quantity = 13
panel = "budget"
label = "Official poverty rate, 1980"
value = "13.0% (29.3 million people in poverty)"
unit = "percent of people in the Census official-poverty universe"
source = "census-poverty-historical"
tier = "A"
notes = "Census histpov2 all-race national row, retrieved for this source review. The people count is rounded once to one decimal million by the source qualifier. The API PCTFAMPOV is a percentage of people in families, not a percentage of family units. These descriptive rates do not identify causes; no family-unit rate is inferred from them."

[[fact]]
id = "us-1980s-cex-total-expenditures"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^Average annual expenditures:\\s+(\\$[\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }] }
panel = "budget"
label = "Average annual consumer-unit expenditures, 1985"
quantity = 23490
value = "$23,490"
unit = "USD per consumer unit, nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1985.pdf). All consumer units. Income before taxes: $25,127. Expenditure/income ratio: 93.5%. Consumer units averaged 2.6 persons; 62% were homeowners."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-cex-expenditure-income-ratio"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^Average annual expenditures:\\s+(\\$[\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }], calculation = { op = "pct_of", operands = ["^ ?Income before taxes 1\\s+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1985: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Expenditure-to-income ratio, 1985"
quantity = 93.5
value = "93.5% — expenditures $23,490 vs income $25,127"
unit = "% (total expenditures ÷ income before taxes)"
source = "bls-cex"
tier = "A"
notes = "Ratio of mean annual expenditures to mean before-tax income for all consumer units in 1985. This ratio of survey means is not an individual household budget and does not establish how spending was financed."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-cex-food-share"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^ Food\\s+([\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }], calculation = { op = "pct_of", operands = ["^Average annual expenditures:\\s+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1985: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Food share of consumer-unit expenditure, 1985"
quantity = 14.8
value = "14.8% of total expenditures"
unit = "% of total annual expenditures"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1985.pdf). All consumer units. Food: $3,477 of $23,490 total. Food at home: $2,037 (8.7%). Food away from home: $1,441 (6.1%)."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
