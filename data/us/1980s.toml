tier = "C"
notes = "The 1985 edition (No. 938) and the 1990 edition (No. 928) agree to 0.1 million on every year they both print, including 1980. Total circulation held near its peak through the 1980s while per capita circulation fell (0.27 in 1980, 0.25 in 1990, per the 2012 edition, Table 1135) — the population grew and the copies did not follow it."
