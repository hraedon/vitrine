# US, the 1980s. Primary sources: Census F-8 (income), Census historical housing
# (homeownership, home value, plumbing), CEX (expenditure, continuous from 1980).
# RECS began 1978. FRED data available. No Historical Statistics (ends 1970).
# Data year anchors: 1980 (Census), 1980 (F-8).

[room]
country = "us"
decade = "1980s"
wage_anchor = "us-1980s-wages"
income_anchor = "us-1980s-median-income-four-person"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-1980s-median-family-income"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C56", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A56", value = "1980" }, { locator = "f08ar!C8", value = "Median income" }, { locator = "f08ar!C9", value = "Current\ndollars" }] }
panel = "budget"
label = "Median family income, all families, 1980"
quantity = 21020
value = "$21,020"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. All families: 60,310 thousand, median $21,020 ($71,470 in 2024 dollars). The stagflation of the 1970s had eroded real wages; the 1980s would see recovery in nominal terms but rising inequality."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-median-income-four-person"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C305", scale = "1", guards = [{ locator = "f08ar!A256", value = "Families with Four People" }, { locator = "f08ar!A305", value = "1980" }, { locator = "f08ar!C257", value = "Median income" }, { locator = "f08ar!C258", value = "Current\ndollars" }] }
basis = "annual"
amount_minor = 2433000
currency = "USD"
price_year = 1980
panel = "budget"
label = "Median family income, four-person families, 1980"
quantity = 24330
value = "$24,330"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. 4-person families: median $24,330 ($82,720 in 2024 dollars). Average family size: 3.27."
assumptions = ["composite-family", "four-person-normalization", "nominal-values"]

[[fact]]
id = "us-1980s-number-of-families"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!B56", scale = "1000", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A56", value = "1980" }, { locator = "f08ar!B8", value = "Number (thousands)" }] }
panel = "budget"
label = "Number of families in the United States, 1980"
quantity = 60310000
value = "60,310,000"
unit = "families"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8."

[[fact]]
id = "us-1980s-average-family-size"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!G56", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A56", value = "1980" }, { locator = "f08ar!G8", value = "Average size of family" }] }
panel = "budget"
label = "Average family size, 1980"
quantity = 3.27
value = "3.27"
unit = "persons per family"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. Down from 3.57 in 1970. By 1990: 3.18."

[[fact]]
id = "us-1980s-expenditure-shares"
panel = "budget"
label = "Expenditure breakdown, 4-person families, 1985"
quantity = 29.5
value = "Housing 29.5%, transportation 20.6%, food 15.0%, insurance/pensions 9.8%, entertainment 5.3%, healthcare 4.1%, apparel 6.0%, cash contributions 2.6%, education 1.5%"
unit = "% of total annual expenditure"
source = "bls-cex"
tier = "A"
notes = "From the 1985 Consumer Expenditure Survey, Table 4 (Size of consumer unit). 13,671 thousand 4-person CUs. Total expenditures: $31,408. Income before taxes: $34,414. Expenditure = 91% of gross income. Transportation share peaked in the 1980s at 20.6%. Source: BLS CEX Table 4, 1985 (cusize.pdf via Wayback Machine, web.archive.org)."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values"]

[[fact]]
id = "us-1980s-poverty-rate"
quantity = 13
panel = "budget"
label = "Official poverty rate, 1980"
value = "13.0% (29.3 million people in poverty)"
unit = "% of all people below official poverty level"
source = "census-poverty-historical"
tier = "A"
notes = "From Census Historical Poverty Tables (API: histpov2). Official poverty rate: 13.0%. Family poverty: 11.5%. Poverty rose from 12.6% (1970) due to stagflation and the early 1980s recessions. By 1985: 14.0%."

[[fact]]
id = "us-1980s-cex-total-expenditures"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^Average annual expenditures:\\s+(\\$[\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }] }
panel = "budget"
label = "Average annual household expenditures, 1985"
quantity = 23490
value = "$23,490"
unit = "USD per consumer unit, nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1985.pdf). All consumer units. Income before taxes: $25,127. Expenditure/income ratio: 93.5%. Consumer units averaged 2.6 persons; 62% were homeowners."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-cex-expenditure-income-ratio"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^Average annual expenditures:\\s+(\\$[\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }], calculation = { op = "pct_of", operands = ["^ ?Income before taxes 1\\s+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1985: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Expenditure-to-income ratio, 1985"
quantity = 93.5
value = "93.5% — expenditures $23,490 vs income $25,127"
unit = "% (total expenditures ÷ income before taxes)"
source = "bls-cex"
tier = "A"
notes = "Ratio of mean annual expenditures to mean before-tax income for all consumer units in 1985. This ratio of survey means is not an individual household budget and does not establish how spending was financed."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-cex-food-share"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^ Food\\s+([\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }], calculation = { op = "pct_of", operands = ["^Average annual expenditures:\\s+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1985: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Food share of household budget, 1985"
quantity = 14.8
value = "14.8% of total expenditures"
unit = "% of total annual expenditures"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1985.pdf). All consumer units. Food: $3,477 of $23,490 total. Food at home: $2,037 (8.7%). Food away from home: $1,441 (6.1%)."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-cex-healthcare-share"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^ Health care\\s+([\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }], calculation = { op = "pct_of", operands = ["^Average annual expenditures:\\s+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1985: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Healthcare share of household budget, 1985"
quantity = 4.7
value = "4.7% of total expenditures ($1,108)"
unit = "% of total annual expenditures; USD nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1985.pdf). All consumer units. Healthcare: $1,108 of $23,490. Health insurance: $375. Medical services: $496. Drugs: $178. Medical supplies: $60."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1980s-cex-apparel-share"
audit = { file = "02-cex/cusize-1985.txt", extractor = "text-regex", locator = "^ Apparel and services\\s+(?:\\$?[\\d,]+\\s+){4}(\\$?[\\d,]+)", guards = [{ locator = "^(Consumer Expenditure Survey, 1985)$", value = "Consumer Expenditure Survey, 1985" }], calculation = { op = "pct_of", operands = ["^Average annual expenditures:\\s+(?:\\$?[\\d,]+\\s+){4}(\\$?[\\d,]+)"], precision = 1, rounding = "half_up", method = "Four-person consumer units, 1985: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Apparel share of expenditure, four-person consumer units, 1985"
quantity = 6.0
value = "6.0% of total expenditures"
unit = "% of total annual expenditures"
source = "bls-cex-four-person-1985"
tier = "A"
notes = "Four-person consumer units: apparel and services of $1,871 divided by total annual expenditures of $31,408, rounded to one decimal place. The previous note transcribed the apparel operand incorrectly; the corrected percentage is unchanged. These are not all-consumer-unit estimates."
assumptions = ["composite-family", "nominal-values"]

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
