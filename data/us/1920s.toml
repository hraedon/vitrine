# US, the 1920s. Primary sources: Census historical homeownership, Historical
# Statistics Vol 1 (life expectancy, manufacturing wages), Historical Statistics
# Vol 2 (telephone, motor vehicles). No income survey. Roaring twenties.
# Data year anchors: 1920 (Census), 1919-21 (life expectancy).

[room]
country = "us"
decade = "1920s"
wage_anchor = "us-1920s-manufacturing-wages"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-1920s-income-gap"
panel = "budget"
label = "Median family income, 1920s"
value = "no reliable record accessible online"
unit = "n/a"
source = "census-hist-income-families"
tier = "D"
notes = "A suitable decade-specific national median family income has not been verified for this room."

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "us-1920s-homeownership"
quantity = 45.6
panel = "home"
label = "Homeownership rate, 1920"
value = "45.6%"
unit = "% of occupied dwelling units (owner-occupied)"
source = "census-homeownership-historical"
tier = "A"
notes = "The Census historical homeownership series reports 45.6% of occupied housing units owner-occupied in 1920."
assumptions = ["composite-family"]

[[fact]]
id = "us-1920s-housing-gap"
panel = "home"
label = "Home value, rooms, plumbing, electricity"
value = "no reliable record accessible online"
unit = "n/a"
source = "census-decennial-pubs"
tier = "D"
notes = "Suitable decade-specific measures of rooms, plumbing, and heating have not been transcribed for this room."

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "us-1920s-life-expectancy"
panel = "day"
label = "Life expectancy at birth, 1919-21"
value = "56.3 male, 58.5 female (white)"
unit = "years"
source = "hist-stats-life-expectancy-white"
tier = "A"
notes = "Period life expectancy at birth for the white population, by sex, 1919–21. Coverage: the 1920 death-registration area: 34 states and the District of Columbia."

[[fact]]
id = "us-1920s-manufacturing-wages"
panel = "day"
label = "Manufacturing production worker wages, 1920"
value = "$0.55/hr, 47.4 hrs/week, $26.02/wk"
unit = "USD, nominal (hourly earnings, weekly hours, weekly earnings)"
source = "hist-stats-wages-manufacturing"
tier = "A"
amount_minor = 55
currency = "USD"
price_year = 1920
basis = "hourly"
notes = "Historical Statistics Series D 802–804 reports average hourly earnings, weekly hours, and weekly earnings of manufacturing production workers in 1920."
assumptions = ["nominal-values", "manufacturing-wage-proxy"]

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "us-1920s-telephone"
panel = "diffusion"
label = "Telephone diffusion, 1920s"
value = "144.6 per 1,000 population (1925)"
unit = "telephones per 1,000 population"
source = "hist-stats-telephones-r1-r3"
tier = "A"
quantity = 144.6
audit = { file = "remaining-audit-20261028/early_us-telephone-extract.json", extractor = "json-pointer", locator = "/rows/1925/per_1000_population", target = "quantity", guards = [{ locator = "/source_sha256", value = "0e209a421af0cf48af7261f6fbd7a599c27a0afce5b7523f2bc89a7d18647fa5" }, { locator = "/series", value = "R 1–12" }, { locator = "/population", value = "Telephone instruments and extensions per total population" }] }
notes = "Historical Statistics Series R 2, 1925. Telephones are instruments and extensions per 1,000 people, including business instruments; through 1930 the count also includes telegraph and teletypewriter stations, and through 1934 private-line telephones."

[[fact]]
id = "us-1920s-radio-automobile"
panel = "diffusion"
label = "Motor vehicle registrations, 1930"
value = "26,749.8 thousand motor vehicles; 23,034.7 thousand automobiles"
unit = "thousands of registered vehicles"
source = "hist-stats-auto-factory-q148"
tier = "A"
notes = "Historical Statistics Series Q 152–155 reports total motor vehicles and the automobile component in 1930."

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "us-1920s-food-basket-gap"
panel = "table"
label = "The food basket, 1920s"
value = "no reliable record accessible online"
unit = "n/a"
source = "bls-bulletin-49-1903"
tier = "D"
notes = "A suitable food basket for this decade remains untranscribed."

[[fact]]
id = "us-1920s-cigarette-consumption"
quantity = 665
panel = "table"
label = "Adult per capita cigarette consumption, 1920"
value = "665 cigarettes per adult per year"
unit = "cigarettes per adult (≥18 years) per year"
price_year = 1920
source = "cdc-mmwr-tobacco-surveillance"
tier = "A"
notes = "Estimated manufactured cigarette consumption per person aged 18 or older, from CDC MMWR Table 1. Total and per-capita measures have different overseas-military coverage in some years. The numerator is total manufactured-cigarette consumption; dividing by the population aged eighteen and older does not restrict the numerator to cigarettes smoked by adults."
assumptions = ["composite-family"]

[[fact]]
id = "us-1920s-ethanol-per-capita"
panel = "table"
label = "Alcohol consumed per person, 1920s"
value = "no reliable record — national Prohibition, 1920-1933: legal sales ended and the series ended with them"
unit = "gallons of pure ethanol per person per year"
source = "niaaa-surveillance-122"
tier = "A"
notes = "National Prohibition ran from January 1920 to December 1933, and the source table prints the single word '(Prohibition)' where fourteen years of numbers would be. The series is built from legal sales, so when legal sales ended the measurement ended with them. Drinking did not stop; the state's ability to count it did. The gap is not an archive limitation and is not interpolated: no consumption estimate for these years appears in this table, and any that were entered would be a different kind of evidence."
assumptions = ["composite-family"]

[[fact]]
id = "us-1920s-traffic-death-rate"
quantity = 25.54
panel = "day"
label = "Road deaths per 100 million vehicle-miles, 1920"
value = "25.54 deaths per 100 million vehicle-miles travelled"
unit = "deaths per 100 million vehicle-miles travelled"
price_year = 1920
source = "fhwa-fi200-2023"
tier = "A"
notes = "FHWA FI-200 reports motor-vehicle traffic fatalities per 100 million vehicle-miles in 1920. The table is a historical series and its earlier estimates have limitations."
assumptions = ["composite-family"]

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "us-1920s-work-buys-gap"
panel = "work-buys"
label = "Share-of-family-income comparison, 1920s"
value = "no reliable record accessible online"
unit = "n/a"
source = "hist-stats-colonial-1970"
tier = "D"
notes = "A suitable decade-specific median family income has not been verified for a share-of-income comparison."

[[fact]]
id = "us-1920s-car-price"
panel = "work-buys"
label = "Passenger-car factory sales, 1920"
value = "1,905,500 passenger cars; wholesale value $1,809 million"
unit = "factory sales and wholesale value, nominal"
source = "hist-stats-auto-factory-q148"
tier = "A"
notes = "Historical Statistics Series Q 148–149 reports passenger cars sold by factories and their wholesale value in 1920; the figures are not retail prices."
assumptions = ["nominal-values"]


# ── Home production hours (Ramey 2009) ─────────────────────────────────────
# Plan 005 WI-2: women's + men's weekly unpaid home-production hours.
# Source: Ramey (2009), Table 6A (women) & Table 7 (men), "All Prime-Age" cols.
# Population: ages 18–64, weighted by employment-population ratio.
# Tier C: reconstruction from period time-diary studies linked to modern surveys.
# Note: actor/hours_kind fields pending Plan 005 WI-1 model changes.

[[fact]]
id = "us-1920s-home-production-women"
quantity = 44.5
panel = "day"
label = "Women's weekly unpaid home-production hours, 1920"
value = "44.5"
unit = "hours per week, prime-age women (ages 18–64)"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 6A estimates average weekly home-production hours for all women aged 18–64 in 1920. Some estimates are partly extrapolated."
assumptions = ["composite-family"]

[[fact]]
id = "us-1920s-home-production-men"
quantity = 3.9
panel = "day"
label = "Men's weekly unpaid home-production hours, 1920"
value = "3.9"
unit = "hours per week, prime-age men (ages 18–64)"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 7 estimates average weekly home-production hours for all men aged 18–64 in 1920. Some estimates are partly extrapolated."
assumptions = ["composite-family"]

[[fact]]
id = "us-1920s-home-production-components"
panel = "day"
label = "Home-production hours among town housewives"
value = "Food preparation 19.9, care and cleaning of house and grounds 9.3, care of clothing 11.5, care of children and adults 7.2, purchasing, management, travel and other 4.4 hours/week"
unit = "hours per week by activity category, town housewives"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 3 reports the Wilson study’s 1920s town-housewife estimates; categories have the source definitions shown."
assumptions = ["composite-family"]

# ── Married women's labor force participation ─────────────────────────────

[[fact]]
id = "us-1920s-married-women-lfpr"
quantity = 9.0
panel = "day"
label = "Married women in the labor force"
value = "~9.0%"
unit = "% of married women aged 15 and older"
source = "hist-stats-married-women-lfpr-early"
tier = "A"
notes = "Historical Statistics Series D 60 reports married women total in the civilian labor force as a percentage of married women aged 15 and older. The historical gainful-worker and modern labor-force measures are not identical."
assumptions = ["composite-family"]

# ── Median age at first marriage ──────────────────────────────────────────

[[fact]]
id = "us-1920s-median-age-first-marriage"
quantity = 24.6
panel = "day"
label = "Median age at first marriage, 1920"
value = "Men: 24.6, Women: 21.2"
unit = "years (median age at first marriage)"
source = "census-table-ms2"
tier = "A"
notes = "Estimated median age at first marriage, separately for men and women, from Census Table MS-2. The table identifies the historical figures as decennial-census estimates."

# ── Net worth (aggregate household sector) ────────────────────────────────

[[fact]]
id = "us-1920s-household-net-worth"
quantity = 406
panel = "day"
label = "Nonfarm household net worth, 1929"
value = "$406 billion"
unit = "aggregate net worth of nonfarm household sector, current dollars"
source = "goldsmith-balance-sheet"
tier = "D"
notes = "Goldsmith Table 1 estimates the aggregate net worth of nonfarm households in 1929. This is not a household median."

