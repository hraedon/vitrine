# US, the 2010s. Primary sources: Census F-8 (income), ACS (home value, housing),
# CEX (expenditure), Pew (internet/broadband/smartphone). The decade: smartphone
# ubiquity, streaming, gig economy, opioid crisis, COVID-19 at the end (2020).
# Data year anchors: 2010 (F-8), 2019 (pre-COVID).

[room]
country = "us"
decade = "2010s"
wage_anchor = "us-2010s-wages"
income_anchor = "us-2010s-median-income-four-person"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-2010s-median-family-income"
amount_minor = 6024000
currency = "USD"
price_year = 2010
basis = "annual"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C26", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A26", value = "2010 (37)" }, { locator = "f08ar!C8", value = "Median income" }, { locator = "f08ar!C9", value = "Current\ndollars" }] }
quantity = 60240
panel = "budget"
label = "Median family income, all families, 2010"
value = "$60,240"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. All families: 79,560 thousand, median $60,240 ($83,640 in 2024 dollars). The Great Recession had reduced real median income from the 2007 peak. Recovery was slow — by 2019, median family income reached ~$86,000 (nominal)."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2010s-median-income-four-person"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C275", scale = "1", guards = [{ locator = "f08ar!A256", value = "Families with Four People" }, { locator = "f08ar!A275", value = "2010 (37)" }, { locator = "f08ar!C257", value = "Median income" }, { locator = "f08ar!C258", value = "Current\ndollars" }] }
quantity = 74750
basis = "annual"
amount_minor = 7475000
currency = "USD"
price_year = 2010
panel = "budget"
label = "Median family income, four-person families, 2010"
value = "$74,750"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. 4-person families: median $74,750 ($103,800 in 2024 dollars). Average family size: 3.14."
assumptions = ["composite-family", "four-person-normalization", "nominal-values"]

[[fact]]
id = "us-2010s-number-of-families"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!B26", scale = "1000", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A26", value = "2010 (37)" }, { locator = "f08ar!B8", value = "Number (thousands)" }] }
quantity = 79560000
panel = "budget"
label = "Number of families in the United States, 2010"
value = "79,560,000"
unit = "families"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. Up from 73,780,000 in 2000."

[[fact]]
id = "us-2010s-average-family-size"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!G26", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A26", value = "2010 (37)" }, { locator = "f08ar!G8", value = "Average size of family" }] }
quantity = 3.14
panel = "budget"
label = "Average family size, 2010"
value = "3.14"
unit = "persons per family"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. Flat from 3.14 in 2000."

[[fact]]
id = "us-2010s-expenditure-shares"
audit = { file = "19-cpi-tables/cu-size-2013.xlsx", extractor = "xlsx-cell", locator = "Table 1400!G204", target = "quantity", guards = [{ locator = "Table 1400!A1", value = "Table 1400. Size of consumer unit: Annual expenditure means, shares, standard errors, and coefficient of variation, Consumer Expenditure Survey, 2013" }, { locator = "Table 1400!G4", value = "Four\npeople" }, { locator = "Table 1400!A202", value = "Housing" }, { locator = "Table 1400!A204", value = "Share" }] }
quantity = 33.0
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 2013"
value = "Housing 33.0%, transportation 18.3%, food 14.0%, insurance/pensions 11.6%, healthcare 5.8%, entertainment 5.1%, apparel 3.6%, cash contributions 2.6%, education 2.4%"
unit = "% of total annual expenditure"
source = "bls-cex-four-person-2013"
tier = "A"
notes = "Published percentage shares from the 2013 annual-means Table 1400, Four people column G, Share rows. The expenditure amounts and percentages refer to four-person consumer units, not a median-income Census family. scripts/cex_food_review.py checks every displayed category against its original literal Share cell."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values", "cex-ratios-of-means"]

[[fact]]
id = "us-2010s-poverty-rate"
quantity = 15.1
panel = "budget"
label = "Official poverty rate, 2010"
value = "15.1% (46.3 million people in poverty)"
unit = "% of all people below official poverty level"
source = "census-poverty-historical"
tier = "A"
notes = "Historical Poverty Tables (Census API histpov2), all-races U.S. population. In 2010, 15.1% of all people were below the official poverty threshold; family poverty rate was 13.2%. This is the accessed API vintage. No recession/recovery causal attribution or unverified trend values."

[[fact]]
id = "us-2010s-cex-total-expenditures"
audit = { file = "19-cpi-tables/cu-all-multi-year-2006-2012.xlsx", extractor = "xlsx-cell", locator = "Table!H48", guards = [{ locator = "Table!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Survey, 2006-2012" }, { locator = "Table!A48", value = "Average annual expenditures" }, { locator = "Table!H3", value = "2012" }] }
panel = "budget"
label = "Average annual consumer-unit expenditures, 2012"
quantity = 51442
value = "$51,442"
unit = "USD per consumer unit, nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX multi-year table (cu-all-multi-year-2006-2012.xlsx). All consumer units. Income before taxes: $65,596. Expenditure/income ratio: 78.4%. 124,416 thousand consumer units; 64% homeowners."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2010s-cex-expenditure-income-ratio"
audit = { file = "19-cpi-tables/cu-all-multi-year-2006-2012.xlsx", extractor = "xlsx-cell", locator = "Table!H48", guards = [{ locator = "Table!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Survey, 2006-2012" }, { locator = "Table!H3", value = "2012" }, { locator = "Table!A48", value = "Average annual expenditures" }, { locator = "Table!A8", value = "Income before taxes a/" }], calculation = { op = "pct_of", operands = ["Table!H8"], precision = 1, rounding = "half_up", method = "All consumer units, 2012: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Expenditure-to-income ratio, 2012"
quantity = 78.4
value = "78.4% — expenditures $51,442 vs income $65,596"
unit = "% (total expenditures ÷ income before taxes)"
source = "bls-cex"
tier = "A"
notes = "Ratio of average annual expenditures to average income before taxes for all consumer units in 2012. It is not the average household expenditure-to-income ratio and does not identify how any particular family financed spending. The audit reproduces the percentage from both source means."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2010s-cex-healthcare-share"
audit = { file = "19-cpi-tables/cu-all-multi-year-2006-2012.xlsx", extractor = "xlsx-cell", locator = "Table!H133", guards = [{ locator = "Table!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Survey, 2006-2012" }, { locator = "Table!H3", value = "2012" }, { locator = "Table!A133", value = "Health care" }, { locator = "Table!A48", value = "Average annual expenditures" }], calculation = { op = "pct_of", operands = ["Table!H48"], precision = 1, rounding = "half_up", method = "All consumer units, 2012: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Healthcare share of consumer-unit expenditure, 2012"
quantity = 6.9
value = "6.9% of total expenditures ($3,556)"
unit = "% of total annual expenditures; USD nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX multi-year table (cu-all-multi-year-2006-2012.xlsx). All consumer units. Healthcare: $3,556 of $51,442. Health insurance: $2,061. Medical services: $839. Drugs: $515. Healthcare share rose from 4.7% (1985) to 6.9% (2012). Note: health insurance estimates beginning in 2014 are not strictly comparable to prior years due to questionnaire changes (ACA)."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2010s-cex-apparel-share"
audit = { file = "19-cpi-tables/cu-all-multi-year-2006-2012.xlsx", extractor = "xlsx-cell", locator = "Table!H109", guards = [{ locator = "Table!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Survey, 2006-2012" }, { locator = "Table!H3", value = "2012" }, { locator = "Table!A109", value = "Apparel and services" }, { locator = "Table!A48", value = "Average annual expenditures" }], calculation = { op = "pct_of", operands = ["Table!H48"], precision = 1, rounding = "half_up", method = "All consumer units, 2012: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Apparel share of consumer-unit expenditure, 2012"
quantity = 3.4
value = "3.4% of total expenditures ($1,736)"
unit = "% of total annual expenditures"
source = "bls-cex"
tier = "A"
notes = "Apparel and services divided by total annual expenditures, all consumer units, 2012. Earlier apparel records for the 1970s-1990s describe four-person units and are not the same population."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2010s-cex-quintile-q1-ratio"
audit = { file = "19-cpi-tables/cu-income-quintiles-before-taxes-2012.xlsx", extractor = "xlsx-cell", locator = "Table 1101!C56", guards = [{ locator = "Table 1101!A1", value = "Table 1101. Quintiles of income before taxes: Annual expenditure means, shares, standard errors, and coefficient of variation, Consumer Expenditure Survey, 2012" }, { locator = "Table 1101!C3", value = "Lowest\n20\npercent" }, { locator = "Table 1101!A55", value = "Average annual expenditures" }, { locator = "Table 1101!A56", value = "Mean" }, { locator = "Table 1101!A9", value = "Income before taxes" }, { locator = "Table 1101!A10", value = "Mean" }], calculation = { op = "pct_of", operands = ["Table 1101!C10"], precision = 1, rounding = "half_up", method = "Lowest before-tax-income quintile of consumer units, 2012: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Ratio of mean expenditure to mean income, lowest income quintile, 2012"
quantity = 221.8
value = "221.8%"
unit = "% (expenditures ÷ income before taxes)"
source = "bls-cex-lowest-quintile-2012"
tier = "A"
notes = "Ratio of the lowest before-tax-income quintile's mean expenditures ($22,154) to mean before-tax income ($9,988). This ratio of means does not imply that every low-income household spends more than twice its income. These data alone do not decompose the sources financing the difference."
assumptions = ["composite-family", "nominal-values"]

