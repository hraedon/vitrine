# US, the 1960s. Primary sources: Census F-8 (income), CEX 1960-61 (expenditure),
# Historical Statistics Vol 2 (telephone/diffusion), Census homeownership series.
# Data years: 1960-61. Urban families surveyed by CEX; all families by CPS/F-8.

[room]
country = "us"
decade = "1960s"
wage_anchor = "us-1960s-hourly-earnings"
income_anchor = "us-1960s-median-family-income"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-1960s-median-family-income"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C76", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A76", value = "1960" }, { locator = "f08ar!C8", value = "Median income" }, { locator = "f08ar!C9", value = "Current\ndollars" }] }
basis = "annual"
amount_minor = 629500
currency = "USD"
price_year = 1960
panel = "budget"
label = "Median family income, 1960"
quantity = 5620
value = "$5,620 (all families), $6,295 (4-person families)"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8 (Table F-8, Size of Family--All Families by Median Income). All families: 45,540 thousand, median $5,620 ($48,760 in 2024 dollars). 4-person families: 9,288 thousand, median $6,295 ($54,620 in 2024 dollars). Average family size: 3.7. By 1969: all-family median $9,433, 4-person median $10,620."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1960s-total-expenditure"
panel = "budget"
label = "Average annual expenditure, 1960-61"
quantity = 5393
value = "$5,393"
unit = "USD per urban consumer unit per year, nominal (urban consumer units)"
source = "bls-cex-urban-1960-61"
tier = "A"
notes = "BLS reports mean annual current-consumption expenditures of U.S. urban consumer units in 1960–61."
assumptions = ["composite-family", "nominal-values", "income-vs-consumption"]

[[fact]]
id = "us-1960s-expenditure-breakdown"
panel = "budget"
label = "Expenditure breakdown, 1960-61"
value = "Food $1,309; housing $1,594; food away from home $274; local telephone $69; total current consumption $5,393 per year"
