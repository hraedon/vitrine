value = "45,540,000"
unit = "families"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8 (Table F-8). Up from 39,930,000 in 1950. By 1970: 52,230,000."

[[fact]]
id = "us-1960s-average-family-size"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!G76", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A76", value = "1960" }, { locator = "f08ar!G8", value = "Average size of family" }] }
panel = "budget"
