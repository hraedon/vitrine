source = "bls-cex-urban-1960-61"
tier = "A"
notes = "BLS 1960–61 Consumer Expenditure Survey Table B-11 reports mean annual current-consumption expenditures of U.S. urban consumer units. Food away from home is part of the food amount."
assumptions = ["composite-family", "nominal-values", "income-vs-consumption"]

[[fact]]
