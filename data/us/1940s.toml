panel = "budget"
label = "Average income of nonfarm families, 1946"
value = "~$3,000"
unit = "USD per year, nominal (urban and rural-nonfarm families)"
source = "census-p60-001"
tier = "A"
notes = "From P-60 No. 1 revised (1948): 'The average income of nonfarm families in 1946 was about $3,000.' Median total money income of urban and rural-nonfarm families and individuals: $2,410 (1944), $2,595 (1945), $2,659 (1946). This predates the CPS F-8 series (begins 1947) and covers nonfarm families only."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1940s-expenditure-gap"
panel = "budget"
label = "Expenditure shares, 1940s"
value = "no reliable record verified for this comparison"
unit = "n/a"
source = "bls-cex"
tier = "D"
notes = "No full expenditure-share table has been verified for this room. BLS Bulletin 1055 covers retail food prices during 1939-50, not full expenditure shares. The source registry identifies later Consumer Expenditure Surveys in 1960-61 and 1972-73, followed by continuous surveys from 1980; those later observations do not fill this decade's gap. This is a verification gap, not a claim that no historical household-budget evidence exists."

