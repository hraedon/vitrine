quantity = 1389
panel = "budget"
label = "Median civilian money wages and salaries, primary families, 1939"
value = "$1,389"
unit = "USD per year, nominal (wages and salaries only)"
source = "census-p60-001"
tier = "A"
notes = "From P-60 No. 1 revised (1948), reporting 1940 Census data. Median civilian money wages and salaries of primary families: $1,389 in 1939, rising to $2,697 by 1944 — nearly doubling during wartime. This is wages/salaries only, not total money income. The P-60 notes: 'The comparison of 1946, 1944, and 1939 income data is restricted to civilian money wages or salaries of primary families and individuals in private households because these were the family and income concepts used in the 1940 census.'"
assumptions = ["composite-family", "nominal-values"]

