# US, the 1970s. Primary sources: Census F-8 (income), Historical Statistics
# Vol 1 (life expectancy, manufacturing earnings), Historical Statistics Vol 2
# (telephone), Census historical housing (homeownership, home value, plumbing).
# Data year anchors: 1970 (Census), 1970 (F-8).

[room]
country = "us"
decade = "1970s"
wage_anchor = "us-1970s-hourly-earnings"
income_anchor = "us-1970s-median-income-four-person"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-1970s-median-family-income"
basis = "annual"
price_year = 1970
currency = "USD"
amount_minor = 986700
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C66", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A66", value = "1970" }, { locator = "f08ar!C8", value = "Median income" }, { locator = "f08ar!C9", value = "Current\ndollars" }] }
panel = "budget"
label = "Median family income, all families, 1970"
quantity = 9867
value = "$9,867"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. All families: 52,230 thousand, median $9,867 ($66,700 in 2024 dollars). The 1970s would see stagflation: nominal incomes rose but real purchasing power stagnated."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1970s-median-income-four-person"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!C315", scale = "1", guards = [{ locator = "f08ar!A256", value = "Families with Four People" }, { locator = "f08ar!A315", value = "1970" }, { locator = "f08ar!C257", value = "Median income" }, { locator = "f08ar!C258", value = "Current\ndollars" }] }
basis = "annual"
amount_minor = 1117000
currency = "USD"
price_year = 1970
panel = "budget"
label = "Median family income, four-person families, 1970"
quantity = 11170
value = "$11,170"
unit = "USD per year, nominal"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. 4-person families: median $11,170 ($75,490 in 2024 dollars). Average family size: 3.57."
assumptions = ["composite-family", "four-person-normalization", "nominal-values"]

[[fact]]
id = "us-1970s-number-of-families"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!B66", scale = "1000", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A66", value = "1970" }, { locator = "f08ar!B8", value = "Number (thousands)" }] }
panel = "budget"
label = "Number of families in the United States, 1970"
quantity = 52230000
value = "52,230,000"
unit = "families"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8."

[[fact]]
id = "us-1970s-average-family-size"
audit = { file = "06-acs-csv/f08ar.xlsx", extractor = "xlsx-cell", locator = "f08ar!G66", scale = "1", guards = [{ locator = "f08ar!A7", value = "All Families" }, { locator = "f08ar!A66", value = "1970" }, { locator = "f08ar!G8", value = "Average size of family" }] }
panel = "budget"
label = "Average family size, 1970"
quantity = 3.57
value = "3.57"
unit = "persons per family"
source = "census-f08-allraces"
tier = "A"
notes = "From Census F-8. Declining from 3.64 in 1947. By 1980: 3.27."

[[fact]]
id = "us-1970s-expenditure-shares"
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 1972-73"
value = "no reliable record verified for this comparison"
unit = "% of total annual expenditure"
source = "bls-cex-four-person-1972-73"
tier = "D"
notes = "The cited Bulletin 1992 Table 2 prints current consumption expenses separately from personal insurance/retirement/pensions and gifts/contributions. The previously displayed percentages used an undocumented constructed total rather than a publisher-printed total with a verified comparable definition. Those shares have been withdrawn pending an explicitly justified denominator. Literal food-category means remain available in us-1970s-food-basket. This is a verification gap, not proof that no expenditure data exist."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values"]

[[fact]]
id = "us-1970s-cex-apparel-share"
panel = "budget"
label = "Apparel share of expenditure, four-person consumer units, 1972-73"
value = "no reliable record verified for this comparison"
unit = "% of total annual expenditures"
source = "bls-cex-four-person-1972-73"
tier = "D"
notes = "The cited Bulletin 1992 Table 2 prints current consumption expenses separately from personal insurance/retirement/pensions and gifts/contributions. The previously displayed percentages used an undocumented constructed total rather than a publisher-printed total with a verified comparable definition. Those shares have been withdrawn pending an explicitly justified denominator. Literal food-category means remain available in us-1970s-food-basket. This is a verification gap, not proof that no expenditure data exist."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1970s-poverty-rate"
audit = { file = "remaining-audit-20261028/census-poverty-1970.json", extractor = "json-pointer", locator = "/1/1", target = "quantity", guards = [{ locator = "/0/0", value = "NAME" }, { locator = "/0/1", value = "PCTPOV" }, { locator = "/0/2", value = "POV" }, { locator = "/0/3", value = "POP" }, { locator = "/0/4", value = "PCTFAMPOV" }, { locator = "/0/5", value = "FAMPOV" }, { locator = "/0/6", value = "FAM" }, { locator = "/0/7", value = "YEAR" }, { locator = "/0/8", value = "RACE" }, { locator = "/0/9", value = "RACE" }, { locator = "/0/10", value = "time" }, { locator = "/0/11", value = "us" }, { locator = "/1/0", value = "United States" }, { locator = "/1/7", value = "1970" }, { locator = "/1/8", value = "1" }, { locator = "/1/9", value = "1" }, { locator = "/1/10", value = "1970" }, { locator = "/1/11", value = "1" }, { locator = "/1/2", value = "25420000" }] }
quantity = 12.6
panel = "budget"
label = "Official poverty rate, 1970"
value = "12.6% (25.4 million people in poverty)"
unit = "percent of people in the Census official-poverty universe"
source = "census-poverty-historical"
tier = "A"
notes = "Census histpov2 all-race national row, retrieved for this source review. The people count is rounded once to one decimal million by the source qualifier. The API PCTFAMPOV is a percentage of people in families, not a percentage of family units. These descriptive rates do not identify causes; no family-unit rate is inferred from them."

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "us-1970s-homeownership"
quantity = 62.9
panel = "home"
label = "Homeownership rate, 1970"
value = "62.9%"
unit = "% of occupied dwelling units (owner-occupied)"
source = "census-homeownership-historical"
tier = "A"
notes = "Census historical homeownership rate for 1970. The rate describes owner-occupied housing among occupied units."
assumptions = ["composite-family"]

[[fact]]
id = "us-1970s-median-home-value"
audit = { file = "05-census-housing/values-unadj.txt", extractor = "text-regex", locator = "^United States\\s+(?:\\$[\\d,]+\\s+)(?:\\$[\\d,]+\\s+)(?:\\$[\\d,]+\\s+)(\\$[\\d,]+)", target = "amount_minor", scale = "100", guards = [{ locator = "^\\s+(2000\\s+1990\\s+1980\\s+1970\\s+1960\\s+1950\\s+1940)\\s*$", value = "2000      1990      1980      1970     1960     1950    1940" }] }
basis = "total"
amount_minor = 1700000
currency = "USD"
price_year = 1970
panel = "home"
label = "Median value of owner-occupied homes, 1970"
value = "$17,000"
unit = "USD, nominal"
source = "census-historical-housing-values"
tier = "A"
notes = "From Census Historical Housing Tables (values-unadj.txt). Up from $11,900 in 1960. By 1980: $47,200 — the inflation of the 1970s hit housing hard."
assumptions = ["nominal-values"]

[[fact]]
id = "us-1970s-plumbing"
audit = { file = "remaining-audit-20261028/world-middle-housing-extract.json", extractor = "json-pointer", locator = "/years/1970/plumbing/complete_count", target = "quantity", guards = [{ locator = "/publisher_sha256/plumbing-tab.txt", value = "56dcbdabfcdb340ccf23b988779725a3165b0e150d62795848a9ddd4b767132b" }, { locator = "/years/1970/plumbing/population_basis", value = "all year-round housing units" }], calculation = { op = "pct_of", operands = ["/years/1970/plumbing/total_reporting"], precision = 1, rounding = "half_up", method = "1970 Census reporting dwelling units: published complete count divided by all reporting count, times 100, rounded once to one decimal." } }
assumptions = ["census-housing-source-count-shares"]
quantity = 93.1
panel = "home"
label = "Complete plumbing facilities, 1970"
value = "93.1% had complete plumbing facilities (6.9% lacked)"
unit = "% of all year-round housing units reporting plumbing status"
source = "census-hist-housing-plumbing-reporting"
tier = "A"
notes = "Census reported 67,656,566 year-round housing units. The complete share is computed from the printed complete and lacking counts, rounded once to one decimal. The source prints the lacking share separately."

[[fact]]
id = "us-1970s-heating-fuel"
panel = "home"
label = "House heating fuel, 1970"
value = "Utility gas 55.2%, bottled/LP gas 6.0%, electricity 7.7%, fuel oil/kerosene 26.0%, coal/coke 2.9%, wood 1.3%, other fuel 0.4%, no fuel 0.6%"
unit = "% of occupied housing units reporting heating fuel"
source = "census-hist-housing-fuels"
tier = "A"
notes = "Census historical housing table for 1970, occupied dwelling units reporting their main heating fuel. Percentages are as printed; categories may not sum to exactly 100% because of rounding."

[[fact]]
id = "us-1970s-median-home-size"
