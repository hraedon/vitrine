unit = "median square feet of floor area, new single-family houses completed"
source = "census-soc-new-housing"
tier = "A"
notes = "Census Survey of Construction reports the median floor area of new single-family houses completed in 1973. This is not a median for the existing housing stock."

[[fact]]
