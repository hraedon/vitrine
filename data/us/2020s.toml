[[fact]]
id = "us-2020s-housing-surge"
panel = "home"
label = "The pandemic housing surge: median home value 2019 vs 2024"
value = "$240,500 (2019) → $360,600 (2024)"
unit = "USD, nominal (ACS B25077 median value of owner-occupied units)"
source = "census-acs-homevalue"
tier = "A"
notes = "Both endpoints transcribed from Census ACS 1-Year Estimates, Table B25077 (Median value of owner-occupied housing units). 2019: $240,500 (±$1,034). 2024: $360,600 (±$618). The increase far exceeds the prior decade's rate ($179,900 in 2010 → $240,500 in 2019). The surge reflects pandemic-era demand, low mortgage rates (2020-21), and supply constraints. The percentage change is not stated here — it would be cross-fact arithmetic; the two endpoints speak for themselves."
assumptions = ["nominal-values"]

