notes = "From ACS Table B25064, 2024 1-year estimates (Census API). Up from $855 in 2010. The renter half of the housing story: rents rose faster than incomes in the 2020s. Arc: $602 (2000) → $855 (2010) → $1,097 (2019) → $1,487 (2024)."

