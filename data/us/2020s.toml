# US, the 2020s. Tier A room — the current-data era.
# Most recent available data (2024 for income, 2024 for wages/CPI).
# This decade is ongoing — each fact states its data year.

[room]
country = "us"
decade = "2020s"
wage_anchor = "us-2020s-hourly-earnings"
income_anchor = "us-2020s-median-income-four-person"
data_as_of = "2024"

# ── Budget panel ──────────────────────────────────────────────────────────
# National-median facts from Census F-8 (Tier A) + CEX expenditure shares (Tier A)

# The saved four-person table is the aggregate-share variant. Precise budget
# shares and dollar means previously asserted from it could not be verified.
# Retain the record IDs as explicit gaps pending the actual means table.

[[fact]]
id = "us-2020s-expenditure-breakdown-4p"
audit = { file = "02-cex/cu-size-2024-means-wayback.xlsx", extractor = "xlsx-cell", locator = "Table 1400!G52", scale = "1", guards = [{ locator = "Table 1400!G4", value = "Four\npeople" }, { locator = "Table 1400!A51", value = "Average annual expenditures" }, { locator = "Table 1400!A52", value = "Mean" }, { locator = "Table 1400!A56", value = "Food" }, { locator = "Table 1400!G57", value = "14543.0" }, { locator = "Table 1400!G58", value = "13.3" }, { locator = "Table 1400!A193", value = "Housing" }, { locator = "Table 1400!G194", value = "34389.0" }, { locator = "Table 1400!G195", value = "31.5" }] }
quantity = 109002
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 2024"
value = "Total $109,002; food $14,543 (13.3%); housing $34,389 (31.5%)"
unit = "2024 nominal USD; parenthetical values are shares of total annual expenditure"
source = "bls-cex-four-person-2024-mean"
tier = "A"
notes = "BLS Table 1400 reports annual mean expenditures for four-person consumer units. Food and housing amounts and shares are also table means; the historical comparisons use distinct populations and categories."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values"]

[[fact]]
id = "us-2020s-food-share-comparison"
