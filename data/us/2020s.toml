panel = "day"
label = "Median age at first marriage, 2023"
value = "Men: 30.2, Women: 28.4"
unit = "years (median age at first marriage)"
source = "census-table-ms2"
tier = "A"
notes = "From Census Table MS-2. CPS ASEC. Men crossed 30 for the first time in the series — up from 22.8 in 1950. Women at 28.4, up from 20.3. The composite four-person family now forms 8 years later than at mid-century. Same-sex marriages included starting 2019. This is why the 2020s room notes the median household is no longer this family — the four-person married-couple household with young children is no longer the statistical norm."

