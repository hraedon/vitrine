source = "bls-cex-four-person-2024-aggregate"
tier = "D"
notes = "The 2024 four-person consumer-unit mean food share is 13.3%. A compatible 1901 comparison has not been established."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values"]

[[fact]]
