[[fact]]
id = "us-2020s-cex-total-expenditures"
audit = { file = "19-cpi-tables/cu-all-multi-year-2021-2024.xlsx", extractor = "xlsx-cell", locator = "Table!E48", guards = [{ locator = "Table!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Surveys, 2021-2024" }, { locator = "Table!A48", value = "Average annual expenditures" }, { locator = "Table!E3", value = "2024.0" }] }
panel = "budget"
label = "Average annual household expenditures, 2024"
quantity = 78535
value = "$78,535"
unit = "USD per consumer unit, nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX multi-year table (cu-all-multi-year-2021-2024.xlsx). All consumer units. Income before taxes: $104,207. Expenditure/income ratio: 75.4%. 135,760 thousand consumer units; 65% homeowners. After-tax income not published for 2024 (TAXSIM models discontinued)."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2020s-cex-expenditure-income-ratio"
audit = { file = "19-cpi-tables/cu-all-multi-year-2021-2024.xlsx", extractor = "xlsx-cell", locator = "Table!E48", guards = [{ locator = "Table!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Surveys, 2021-2024" }, { locator = "Table!E3", value = "2024.0" }, { locator = "Table!A48", value = "Average annual expenditures" }, { locator = "Table!A8", value = "Income before taxes" }], calculation = { op = "pct_of", operands = ["Table!E8"], precision = 1, rounding = "half_up", method = "All consumer units, 2024: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Expenditure-to-income ratio, 2024"
quantity = 75.4
value = "75.4% — expenditures $78,535 vs income $104,207"
unit = "% (total expenditures ÷ income before taxes)"
source = "bls-cex"
tier = "A"
notes = "Ratio of average annual expenditures to average income before taxes for all consumer units in 2024. It is not the average household expenditure-to-income ratio and does not identify how any particular family financed spending. The audit reproduces the percentage from both source means."
assumptions = ["composite-family", "nominal-values"]

