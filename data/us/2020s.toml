[[fact]]
id = "us-2020s-cpi"
quantity = 313.7
price_year = 2024
panel = "work-buys"
label = "Consumer Price Index, 2024"
value = "313.7"
unit = "CPI-U, 1982-84=100, annual average"
source = "fred-cpiaucns"
tier = "A"
notes = "From FRED CPIAUCNS (not seasonally adjusted). Annual average of 12 monthly observations for 2024."
assumptions = ["nominal-values"]

[[derived]]
id = "us-2020s-purchasing-power-comparison"
panel = "work-buys"
label = "Purchasing power: 1950 vs 2024"
op = "quantity_ratio"
numerator = "us-2020s-cpi"
denominator = "us-1950s-cpi"
unit = "CPI-U ratio (313.7 / 24.1)"
precision = 2
notes = "Same computation as the 1950s room: 2024 CPI (313.7) / 1950 CPI (24.1) = 13.02. The median family income rose from $3,319 to $105,800 — a factor of 31.9, far exceeding inflation (13.0x). Real median family income approximately tripled. Cross-room derived fact: denominator is in the 1950s room."
assumptions = ["nominal-values"]

[[derived]]
id = "us-2020s-home-as-income-years"
panel = "work-buys"
label = "Median home value as years of median family income, 2024"
op = "ratio"
numerator = "us-2020s-median-home-value"
denominator = "us-2020s-median-income-four-person"
unit = "years of four-person median family income"
precision = 2
notes = "Both inputs Tier A (ACS B25077 home value; Census F-8 four-person income). Modestly above the 1950 ratio (see us-1950s-home-as-income-years) — but the composition shifted: mortgage rates, property taxes, and home size all changed, so 'years of income' understates the difference in monthly carrying cost. An earlier hand-authored version used a ~$420,000 home value from a secondary source; the ACS figure is lower."
assumptions = ["composite-family", "nominal-values", "affordability-normalization", "hours-vs-income-denominator"]

[[derived]]
id = "us-2020s-real-income-growth"
panel = "work-buys"
label = "Real median family income growth, 1950-2024"
op = "ratio"
numerator = "us-2020s-median-income-all-families"
denominator = "us-1950s-all-family-income-real-2024"
unit = "real (CPI-adjusted) median family income"
precision = 1
notes = "From Table F-8's own 2024-dollar column (C-CPI-U-RS adjusted): 1950 all-family median = $35,290 in 2024 dollars vs 2024 median = $105,800, a factor of 3.0. Alternative deflator: using raw CPI-U (CPIAUCNS, 13.02x per us-2020s-purchasing-power-comparison) gives $3,319 x 13.02 = $43,236, a factor of 2.4x — CPI-U-RS corrects known overstatement of early inflation, so the published 3.0x is primary. Cross-room derived fact: denominator is in the 1950s room. CORRECTION 2026-07-07: this fact previously displayed '3.1x ($25,633 -> $79,490)', figures traceable to no source in the registry."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
