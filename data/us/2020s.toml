# US, the 2020s. Tier A room — the current-data era.
# Most recent available data (2024 for income, 2024 for wages/CPI).
# This decade is ongoing — each fact states its data year.

[room]
country = "us"
decade = "2020s"
wage_anchor = "us-2020s-hourly-earnings"
income_anchor = "us-2020s-median-income-four-person"
data_as_of = "2024"

# ── Budget panel ──────────────────────────────────────────────────────────
# National-median facts from Census F-8 (Tier A) + CEX expenditure shares (Tier A)

# The saved four-person table is the aggregate-share variant. Precise budget
# shares and dollar means previously asserted from it could not be verified.
# Retain the record IDs as explicit gaps pending the actual means table.

[[fact]]
id = "us-2020s-expenditure-breakdown-4p"
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 2024"
value = "no reliable record verified for this comparison"
unit = "% of total annual expenditure"
source = "bls-cex-four-person-2024-aggregate"
tier = "D"
notes = "The archived 2024 Table 1400 contains rounded shares of national aggregate spending by consumer-unit size, not published within-budget mean expenditure shares. Its income mean also differs from the previous transcription. Exact four-person expenditure amounts and budget shares previously shown here cannot be reproduced from this file and have been withdrawn pending the correct annual-means table. The direct official means-table download returned HTTP 403 on 2026-09-07. Historical comparisons also mix survey populations; 1901 rent is narrower than modern housing expenditure. All-consumer-unit 2024 figures remain separately available and audited."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values"]

