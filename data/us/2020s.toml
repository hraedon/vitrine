notes = "Computed: $30.12 per hour × 33.7 weekly hours = $1,015.04, using total-private production and nonsupervisory employees for both operands. Assuming 52 paid weeks gives $52,782.08, or 49.9% of the all-family median income of $105,800. These describe separate worker and family populations; the ratio does not measure household needs, sufficiency, or the number of family earners. The former value mixed total-private wages with manufacturing hours and has been withdrawn."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2020s-car-price"
panel = "work-buys"
label = "Average new car transaction price, 2020"
