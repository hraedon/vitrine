# Census observation 1950; income reference year 1949. See Plan 035 and
# docs/reconstruction-20261029.md. The former INCTOT/HHWT estimates are withdrawn.

[[fact]]
id = "us-1950s-median-income-metro"
audit = { file = "reconstruction-20261029/ipums/family-income-curator.json", extractor = "json-pointer", locator = "/groups/metro/median_code", target = "amount_minor", scale = "100", guards = [{ locator = "/extract_id", value = "usa_00003" }, { locator = "/ddi_sha256", value = "b7c6a48135e53031e1ec719eed2073f618b32f9f8dfa5c6f43b9a2da989a2bbb" }, { locator = "/data_sha256", value = "697a3b2fe3b095d9d080c65df96f7d771b3dda4d825548c8c7ae5ea3bcb5a6da" }, { locator = "/income_reference_year", value = "1949" }, { locator = "/selection", value = "RELATE=1; FAMUNIT=1; head FAMSIZE=4; four FAMUNIT=1 records per household; GQ=1; unique household head; SLWT>0" }, { locator = "/median_rule", value = "smallest ordered value whose cumulative SLWT is at least half the total; no interpolation" }, { locator = "/geography", value = "METRO 1 nonmetro; 2 indeterminable/excluded; 3 outside central city; 4 city status indeterminable; 5 central city; metro combines 3, 4, 5" }, { locator = "/groups/metro/unweighted_count", value = "13734" }] }
basis = "annual"
price_year = 1949
currency = "USD"
amount_minor = 365000
quantity = 3650
panel = "budget"
label = "Median primary-family income, four people, metropolitan areas, 1949"
value = "$3,650"
unit = "USD per year, nominal 1949 income; median of category-coded primary-family income"
source = "ipums-1950-primary-family-income-1949"
tier = "B"
notes = "New reconstruction from the 1950 1% census sample, extract 00003; income refers to 1949. SLWT-weighted inverse-CDF median of FTOTINC for 13,734 valid sample-line heads in this geography. Primary family units of four in GQ=1 households are selected by the documented unit-membership checks. FTOTINC uses income-category midpoints, so this is a median of coded values, not an exact-dollar measurement. No interpolation or adjustment to the separate CPS median is made. These replace the withdrawn household-sum estimates; they do not reproduce the original calculation."
assumptions = ["composite-family", "nominal-values", "metropolitan-definition", "ipums-1950-primary-family-median"]

