[[fact]]
id = "us-1930s-rent-index"
quantity = 23.7
panel = "home"
label = "Rent, 1939 (index, 1982-84=100)"
value = "23.7 in 1939, down from 31.2 in 1930"
unit = "CPI-U rent-of-primary-residence index (1982-84=100), annual average"
source = "bls-api"
