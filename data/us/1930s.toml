# US, the 1930s. Primary sources: Census historical homeownership, Historical
# Statistics Vol 1 (life expectancy, manufacturing wages), Historical Statistics
# Vol 2 (telephone). The Great Depression: 25% unemployment, deflation, New Deal.
# No income survey. The 1935 Consumer Purchases Survey is the closest expenditure data.
# Data year anchors: 1930 (Census), 1929-31 (life expectancy), 1935 (wages).

[room]
country = "us"
decade = "1930s"
wage_anchor = "us-1930s-manufacturing-wages"

# ── Budget panel ──────────────────────────────────────────────────────────

[[fact]]
id = "us-1930s-income-gap"
panel = "budget"
label = "Median family income, 1930s"
value = "no reliable record accessible online"
unit = "n/a"
source = "census-hist-income-families"
tier = "D"
notes = "A suitable decade-specific national median family income has not been verified for this room."

# ── Home panel ────────────────────────────────────────────────────────────

[[fact]]
id = "us-1930s-homeownership"
quantity = 47.8
panel = "home"
label = "Homeownership rate, 1930"
value = "47.8%"
unit = "% of occupied dwelling units (owner-occupied)"
source = "census-homeownership-historical"
tier = "A"
notes = "The Census historical homeownership series reports 47.8% of occupied housing units owner-occupied in 1930."
assumptions = ["composite-family"]

[[fact]]
id = "us-1930s-housing-gap"
panel = "home"
label = "Home value, rooms, plumbing, electricity"
value = "no reliable record accessible online"
unit = "n/a"
source = "census-decennial-pubs"
tier = "D"
notes = "Suitable decade-specific measures of rooms, plumbing, and heating have not been transcribed for this room."

# ── Day panel ─────────────────────────────────────────────────────────────

[[fact]]
id = "us-1930s-life-expectancy"
panel = "day"
label = "Life expectancy at birth, 1929-31"
value = "59.1 male, 62.7 female (white)"
unit = "years"
source = "hist-stats-life-expectancy-white"
tier = "A"
notes = "Period life expectancy at birth for the white population, by sex, 1929–31. Coverage: the conterminous United States."

[[fact]]
id = "us-1930s-manufacturing-wages"
panel = "day"
label = "Manufacturing production worker wages, 1930 and 1933"
value = "1930: $0.55/hr, 42.1 hrs/wk, $23.00/wk | 1933: $0.44/hr, 38.1 hrs/wk, $16.65/wk"
unit = "USD, nominal (hourly earnings, weekly hours, weekly earnings)"
source = "hist-stats-wages-manufacturing"
tier = "A"
amount_minor = 55
currency = "USD"
price_year = 1930
basis = "hourly"
notes = "Historical Statistics Series D 802–804 reports average hourly earnings, weekly hours, and weekly earnings of manufacturing production workers in 1930 and 1933. Weekly earnings are published figures."
assumptions = ["nominal-values", "manufacturing-wage-proxy"]

# ── Diffusion panel ───────────────────────────────────────────────────────

[[fact]]
id = "us-1930s-telephone"
panel = "diffusion"
label = "Telephone diffusion, 1930s"
value = "136.4 per 1,000 population (1935)"
unit = "telephones per 1,000 population"
source = "hist-stats-telephones-r1-r3"
tier = "A"
quantity = 136.4
audit = { file = "remaining-audit-20261028/early_us-telephone-extract.json", extractor = "json-pointer", locator = "/rows/1935/per_1000_population", target = "quantity", guards = [{ locator = "/source_sha256", value = "0e209a421af0cf48af7261f6fbd7a599c27a0afce5b7523f2bc89a7d18647fa5" }, { locator = "/series", value = "R 1–12" }, { locator = "/population", value = "Telephone instruments and extensions per total population" }] }
notes = "Historical Statistics Series R 2, 1935. Telephones are instruments and extensions per 1,000 people, including business instruments; through 1930 the count also includes telegraph and teletypewriter stations, and through 1934 private-line telephones."

[[fact]]
id = "us-1930s-radio-automobile"
panel = "diffusion"
label = "Motor vehicle registrations, 1930"
value = "26,749.8 thousand motor vehicles; 23,034.7 thousand automobiles"
unit = "thousands of registered vehicles"
source = "hist-stats-auto-factory-q148"
tier = "A"
notes = "Historical Statistics Series Q 152–155 reports total motor vehicles and the automobile component in 1930."

# ── Table panel ───────────────────────────────────────────────────────────

[[fact]]
id = "us-1930s-food-basket-gap"
panel = "table"
label = "The food basket, 1930s"
value = "no reliable record accessible online"
unit = "n/a"
source = "bls-1935-consumer-purchases"
tier = "D"
notes = "The 1935–36 consumer purchases survey is available but a suitable basket has not been transcribed."

[[fact]]
id = "us-1930s-cigarette-consumption"
quantity = 1485
panel = "table"
label = "Adult per capita cigarette consumption, 1930"
value = "1,485 cigarettes per adult per year"
unit = "cigarettes per adult (≥18 years) per year"
price_year = 1930
source = "cdc-mmwr-tobacco-surveillance"
tier = "A"
notes = "Estimated manufactured cigarette consumption per person aged 18 or older, from CDC MMWR Table 1. Total and per-capita measures have different overseas-military coverage in some years. The numerator is total manufactured-cigarette consumption; dividing by the population aged eighteen and older does not restrict the numerator to cigarettes smoked by adults."
assumptions = ["composite-family"]

[[fact]]
id = "us-1930s-ethanol-per-capita"
quantity = 0.97
panel = "table"
label = "Alcohol consumed per person, 1934"
value = "0.97 gallons of pure ethanol per person per year"
unit = "gallons of pure ethanol per person per year"
price_year = 1934
source = "niaaa-surveillance-122"
tier = "A"
notes = "NIAAA Table 1 reports apparent ethanol consumption for 1934. The pre-1970 denominator is people aged 15 and older; the estimate is not limited to drinkers."
assumptions = ["composite-family"]

[[fact]]
id = "us-1930s-traffic-death-rate"
quantity = 15.12
panel = "day"
label = "Road deaths per 100 million vehicle-miles, 1930"
value = "15.12 deaths per 100 million vehicle-miles travelled"
unit = "deaths per 100 million vehicle-miles travelled"
price_year = 1930
source = "fhwa-fi200-2023"
tier = "A"
notes = "FHWA FI-200 reports motor-vehicle traffic fatalities per 100 million vehicle-miles in 1930. The table is a historical series and its earlier estimates have limitations."
assumptions = ["composite-family"]

# ── Work-buys panel ───────────────────────────────────────────────────────

[[fact]]
id = "us-1930s-work-buys-gap"
panel = "work-buys"
label = "Share-of-family-income comparison, 1930s"
value = "no reliable record accessible online"
unit = "n/a"
source = "hist-stats-colonial-1970"
tier = "D"
notes = "A suitable decade-specific median family income has not been verified for a share-of-income comparison."

[[fact]]
id = "us-1930s-car-price"
panel = "work-buys"
label = "Passenger-car factory sales, 1930"
value = "2,787,400 passenger cars; wholesale value $1,644 million"
unit = "factory sales and wholesale value, nominal"
source = "hist-stats-auto-factory-q148"
tier = "A"
notes = "Historical Statistics Series Q 148–149 reports passenger cars sold by factories and their wholesale value in 1930; the figures are not retail prices."
assumptions = ["nominal-values"]


# ── Home production hours (Ramey 2009) ─────────────────────────────────────
# Plan 005 WI-2: women's + men's weekly unpaid home-production hours.
# Source: Ramey (2009), Table 6A (women) & Table 7 (men), "All Prime-Age" cols.
# Population: ages 18–64, weighted by employment-population ratio.
# Tier C: reconstruction from period time-diary studies linked to modern surveys.
# Note: actor/hours_kind fields pending Plan 005 WI-1 model changes.

[[fact]]
id = "us-1930s-home-production-women"
quantity = 43.2
panel = "day"
label = "Women's weekly unpaid home-production hours, 1930"
value = "43.2"
unit = "hours per week, prime-age women (ages 18–64)"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 6A estimates average weekly home-production hours for all women aged 18–64 in 1930. Some estimates are partly extrapolated."
assumptions = ["composite-family"]

[[fact]]
id = "us-1930s-home-production-men"
quantity = 6
panel = "day"
label = "Men's weekly unpaid home-production hours, 1930"
value = "6.0"
unit = "hours per week, prime-age men (ages 18–64)"
source = "ramey-2009"
tier = "C"
notes = "Ramey Table 7 estimates average weekly home-production hours for all men aged 18–64 in 1930. Some estimates are partly extrapolated."
assumptions = ["composite-family"]

# ── Married women's labor force participation ─────────────────────────────

[[fact]]
id = "us-1930s-married-women-lfpr"
quantity = 11.7
panel = "day"
label = "Married women in the labor force"
value = "~11.7%"
unit = "% of married women aged 15 and older"
source = "hist-stats-married-women-lfpr-early"
tier = "A"
notes = "Historical Statistics Series D 60 reports married women total in the civilian labor force as a percentage of married women aged 15 and older. The historical gainful-worker and modern labor-force measures are not identical."
assumptions = ["composite-family"]

# ── Median age at first marriage ──────────────────────────────────────────

[[fact]]
id = "us-1930s-median-age-first-marriage"
quantity = 24.3
panel = "day"
label = "Median age at first marriage, 1930"
value = "Men: 24.3, Women: 21.3"
unit = "years (median age at first marriage)"
source = "census-table-ms2"
tier = "A"
notes = "Estimated median age at first marriage, separately for men and women, from Census Table MS-2. The table identifies the historical figures as decennial-census estimates."

# ── Net worth (aggregate household sector) ────────────────────────────────

[[fact]]
id = "us-1930s-household-net-worth"
quantity = 341
panel = "day"
label = "Nonfarm household net worth, 1939"
value = "$341 billion"
unit = "aggregate net worth of nonfarm household sector, current dollars"
source = "goldsmith-balance-sheet"
tier = "D"
notes = "Goldsmith Table 1 estimates the aggregate net worth of nonfarm households in 1939. This is not a household median."

