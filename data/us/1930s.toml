audit = { file = "remaining-audit-20261028/early_us-cpi-annual-extract.json", extractor = "json-pointer", locator = "/values/CUUR0000SAF1/1939", target = "quantity", guards = [{ locator = "/values/CUUR0000SAF1/1929", value = "16.5" }, { locator = "/period", value = "M13" }, { locator = "/population", value = "CPI-U U.S. city average" }, { locator = "/seasonality", value = "Not Seasonally Adjusted" }, { locator = "/original_sha256/bls-cpi-annual-1913-1929.json", value = "68290db70bebfdc3d071602f8d2d4c947aa6377e9ef3a310fedd1e1fbc597715" }, { locator = "/original_sha256/bls-cpi-annual-1930-1939.json", value = "fd3f869ca3b15fc26d236d4830065a4defed004fb6c049abb56af094eb2ba8a7" }] }
