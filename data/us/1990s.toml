[[fact]]
id = "us-1990s-expenditure-shares"
audit = { file = "59-workbook-review/cex-food-observations.json", extractor = "json-pointer", locator = "/1996/values/housing", target = "quantity", guards = [{ locator = "/1996/year", value = "1996" }, { locator = "/1996/source_sha256", value = "f85753e37acc96a31070183e18db7993c52613149df550c3469d9e3f9ba5eca5" }, { locator = "/1996/file", value = "02-cex/cusize-1996.pdf" }, { locator = "/1996/population", value = "Four-person consumer units" }, { locator = "/1996/statistic", value = "Annual expenditure means" }, { locator = "/1996/source_header", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996\nItem\nAll\nconsumer\nunits\nOne\nperson\nTwo or\nmore\npersons\nTwo\npersons\nThree\npersons\nFour\npersons\nFive or\nmore\npersons" }, { locator = "/1996/budget_placard", value = "Housing 31.3%, transportation 18.7%, food 15.0%, insurance/pensions 10.1%, entertainment 6.0%, healthcare 4.3%, apparel 5.7%, cash contributions 2.1%, education 1.8%" }], calculation = { op = "pct_of", operands = ["/1996/values/total"], precision = 1, rounding = "half_up", method = "Housing mean divided by total annual expenditure mean for four-person consumer units; times one hundred, rounded once half up to one decimal place. Companion category shares are reproduced by the same source extractor and full-value guard." } }
quantity = 31.3
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 1996"
value = "Housing 31.3%, transportation 18.7%, food 15.0%, insurance/pensions 10.1%, entertainment 6.0%, healthcare 4.3%, apparel 5.7%, cash contributions 2.1%, education 1.8%"
unit = "% of total annual expenditure"
source = "bls-cex-four-person-1996"
tier = "A"
notes = "Ratios of published annual category expenditure means to the total-expenditure mean for four-person consumer units, rounded once half up to one decimal place by scripts/cex_food_review.py. These are not published individual budget distributions or the mean of unit-level budget shares. The archived table provides expenditure means; the audit checks the housing ratio and the full reproduced category-share string."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values", "cex-ratios-of-means"]

[[fact]]
id = "us-1990s-poverty-rate"
quantity = 13.5
panel = "budget"
label = "Official poverty rate, 1990"
value = "13.5% (33.6 million people in poverty)"
unit = "% of all people below official poverty level"
source = "census-poverty-historical"
tier = "A"
notes = "Historical Poverty Tables (Census API histpov2), all-races U.S. population. In 1990, 13.5% (33.6 million) of all people were below the official poverty threshold; family poverty rate was 12.0%. The response reports 33,590,000 people and 248,600,000 population."

[[fact]]
id = "us-1990s-cex-total-expenditures"
audit = { file = "02-cex/cusize-1996.txt", extractor = "text-regex", locator = "^Average annual expenditures[ .]+(\\$[\\d,]+)", guards = [{ locator = "^(Table 4\\. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996)$", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996" }] }
panel = "budget"
label = "Average annual consumer-unit expenditures, 1996"
quantity = 33797
value = "$33,797"
unit = "USD per consumer unit, nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1996.pdf). All consumer units. Income before taxes: $38,014. Expenditure/income ratio: 88.9%. Consumer units averaged 2.5 persons; 64% were homeowners."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1990s-cex-expenditure-income-ratio"
audit = { file = "02-cex/cusize-1996.txt", extractor = "text-regex", locator = "^Average annual expenditures[ .]+(\\$[\\d,]+)", guards = [{ locator = "^(Table 4\\. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996)$", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996" }], calculation = { op = "pct_of", operands = ["^ ?Income before taxes 1/[ .]+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1996: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Expenditure-to-income ratio, 1996"
quantity = 88.9
value = "88.9% — expenditures $33,797 vs income $38,014"
unit = "% (total expenditures ÷ income before taxes)"
source = "bls-cex"
tier = "A"
notes = "Ratio of mean annual expenditures to mean before-tax income for all consumer units in 1996. This ratio of survey means is not an individual household budget and does not establish how spending was financed."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1990s-cex-healthcare-share"
audit = { file = "02-cex/cusize-1996.txt", extractor = "text-regex", locator = "^ Health care[ .]+([\\d,]+)", guards = [{ locator = "^(Table 4\\. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996)$", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996" }], calculation = { op = "pct_of", operands = ["^Average annual expenditures[ .]+(\\$[\\d,]+)"], precision = 1, rounding = "half_up", method = "All consumer units, 1996: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Healthcare share of consumer-unit expenditure, 1996"
quantity = 5.2
value = "5.2% of total expenditures ($1,770)"
unit = "% of total annual expenditures; USD nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX Table 4 (cusize-1996.pdf). All consumer units. Healthcare: $1,770 of $33,797. Health insurance: $827. Medical services: $543. Drugs: $303. Medical supplies: $97. Healthcare share rose from 4.7% (1985) to 5.2% (1996)."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-1990s-cex-apparel-share"
audit = { file = "02-cex/cusize-1996.txt", extractor = "text-regex", locator = "^ Apparel and services[ .]+(?:\\$?[\\d,]+\\s+){5}(\\$?[\\d,]+)", guards = [{ locator = "^(Table 4\\. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996)$", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure Survey, 1996" }], calculation = { op = "pct_of", operands = ["^Average annual expenditures[ .]+(?:\\$?[\\d,]+\\s+){5}(\\$?[\\d,]+)"], precision = 1, rounding = "half_up", method = "Four-person consumer units, 1996: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Apparel share of expenditure, four-person consumer units, 1996"
quantity = 5.7
value = "5.7% of total expenditures"
unit = "% of total annual expenditures"
source = "bls-cex-four-person-1996"
tier = "A"
notes = "Four-person consumer units: apparel and services of $2,492 divided by total annual expenditures of $43,670, rounded to one decimal place. The previous note transcribed the apparel operand incorrectly; the corrected percentage is unchanged. These are not all-consumer-unit estimates."
assumptions = ["composite-family", "nominal-values"]

