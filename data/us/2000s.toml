[[fact]]
id = "us-2000s-expenditure-shares"
audit = { file = "59-workbook-review/cex-food-observations.json", extractor = "json-pointer", locator = "/2005/values/housing", target = "quantity", guards = [{ locator = "/2005/year", value = "2005" }, { locator = "/2005/source_sha256", value = "09571721f46ca8af45a1dd398a74e44c743507134047f7a2da7cf209ba18127e" }, { locator = "/2005/file", value = "02-cex/cusize-2005.pdf" }, { locator = "/2005/population", value = "Four-person consumer units" }, { locator = "/2005/statistic", value = "Annual expenditure means" }, { locator = "/2005/source_header", value = "Table 4. Size of consumer unit: Average annual expenditures and characteristics, Consumer Expenditure\nSurvey, 2005\nItem\nAll\nconsumer\nunits\nOne\nperson\nTwo or more persons\nTotal Two\npersons\nThree\npersons\nFour\npersons\nFive or\nmore\npersons" }, { locator = "/2005/budget_placard", value = "Housing 32.3%, transportation 18.6%, food 13.9%, insurance/pensions 12.1%, entertainment 5.1%, healthcare 4.5%, apparel 4.6%, cash contributions 2.6%, education 2.4%" }], calculation = { op = "pct_of", operands = ["/2005/values/total"], precision = 1, rounding = "half_up", method = "Housing mean divided by total annual expenditure mean for four-person consumer units; times one hundred, rounded once half up to one decimal place. Companion category shares are reproduced by the same source extractor and full-value guard." } }
quantity = 32.3
panel = "budget"
label = "Expenditure breakdown, four-person consumer units, 2005"
value = "Housing 32.3%, transportation 18.6%, food 13.9%, insurance/pensions 12.1%, entertainment 5.1%, healthcare 4.5%, apparel 4.6%, cash contributions 2.6%, education 2.4%"
unit = "% of total annual expenditure"
source = "bls-cex-four-person-2005"
tier = "A"
notes = "Ratios of published annual category expenditure means to the total-expenditure mean for four-person consumer units, rounded once half up to one decimal place by scripts/cex_food_review.py. These are not published individual budget distributions or the mean of unit-level budget shares. The archived table provides expenditure means; the audit checks the housing ratio and the full reproduced category-share string."
assumptions = ["composite-family", "income-vs-consumption", "nominal-values", "cex-ratios-of-means"]

[[fact]]
id = "us-2000s-poverty-rate"
quantity = 11.3
panel = "budget"
label = "Official poverty rate, 2000"
value = "11.3% (31.6 million people in poverty)"
unit = "% of all people below official poverty level"
source = "census-poverty-historical"
tier = "A"
notes = "Historical Poverty Tables (Census API histpov2), all-races U.S. population. In 2000, 11.3% of all people were below the official poverty threshold; family poverty rate was 9.6%. This is the accessed API vintage. No recession/recovery causal attribution or unverified trend values."

[[fact]]
id = "us-2000s-cex-total-expenditures"
audit = { file = "19-cpi-tables/cu-all-multi-year-2000-2005.xlsx", extractor = "xlsx-cell", locator = "multiyr2000-05!B28", guards = [{ locator = "multiyr2000-05!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Survey, 2000-2005" }, { locator = "multiyr2000-05!A28", value = "Average annual expenditures" }, { locator = "multiyr2000-05!B3", value = "2000" }] }
panel = "budget"
label = "Average annual consumer-unit expenditures, 2000"
quantity = 38045
value = "$38,045"
unit = "USD per consumer unit, nominal"
source = "bls-cex"
tier = "A"
notes = "From BLS CEX multi-year table (cu-all-multi-year-2000-2005.xlsx). All consumer units. Income before taxes: $44,649. Expenditure/income ratio: 85.2%. 109,367 thousand consumer units; 66% homeowners."
assumptions = ["composite-family", "nominal-values"]

[[fact]]
id = "us-2000s-cex-expenditure-income-ratio"
audit = { file = "19-cpi-tables/cu-all-multi-year-2000-2005.xlsx", extractor = "xlsx-cell", locator = "multiyr2000-05!B28", guards = [{ locator = "multiyr2000-05!A1", value = "Average annual expenditures and characteristics of all consumer units, Consumer Expenditure Survey, 2000-2005" }, { locator = "multiyr2000-05!B3", value = "2000" }, { locator = "multiyr2000-05!A28", value = "Average annual expenditures" }, { locator = "multiyr2000-05!A5", value = "Income before taxes 1/" }], calculation = { op = "pct_of", operands = ["multiyr2000-05!B5"], precision = 1, rounding = "half_up", method = "All consumer units, 2000: numerator mean divided by denominator mean, multiplied by 100, rounded once to one decimal place. This is a ratio of survey means, not the mean of individual household ratios." } }
panel = "budget"
label = "Expenditure-to-income ratio, 2000"
quantity = 85.2
value = "85.2% — expenditures $38,045 vs income $44,649"
unit = "% (total expenditures ÷ income before taxes)"
source = "bls-cex"
tier = "A"
notes = "Ratio of average annual expenditures to average income before taxes for all consumer units in 2000. It is not the average household expenditure-to-income ratio and does not identify how any particular family financed spending. The audit reproduces the percentage from both source means."
assumptions = ["composite-family", "nominal-values"]

