[[fact]]
id = "us-2000s-flight-smoking-ban"
panel = "day"
label = "Smoking on scheduled passenger flights, 2000"
value = "From June 4, 2000 smoking was prohibited on all scheduled passenger flights of U.S. and foreign air carriers — including foreign air transportation and the over-six-hour segments the 1989 statute had left out — subject to a waiver of the foreign-carrier rule where a foreign government objects and an alternative prohibition is negotiated"
unit = "legal status of smoking aboard scheduled passenger flights (federal statute)"
