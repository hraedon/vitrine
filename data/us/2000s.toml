tier = "A"
notes = "Section 708 of Public Law 106-181 prohibited smoking on scheduled passenger interstate and intrastate air transportation and required foreign air carriers to prohibit smoking on scheduled passenger foreign air transportation, subject to its foreign-government waiver provision. The law took effect 60 days after enactment; DOT’s final rule gives June 4, 2000 as the effective date."
assumptions = ["composite-family"]

