server {
    listen 8080;
    server_name _;
    root /out;
    index index.html;

    # Generated attributes carry tier colors, chart proportions and SVG labels.
    # Permit those attributes without allowing inline style elements or scripts:
    # https://www.w3.org/TR/CSP3/#directive-style-src-attr
    add_header Content-Security-Policy "default-src 'self'; style-src-attr 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;

    # Relative links throughout the site → no path rewriting needed.
    location / {
        try_files $uri $uri/ =404;
    }

    # Filenames are stable across releases, so the server-wide no-cache policy
    # above requires revalidation and prevents mixed-version pages and assets.
}
